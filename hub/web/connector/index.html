  <section class="lang-panel" data-lang-panel="en">
    <h1>MaClaw Third-Party Software Access Protocol v1</h1>
    <p class="lead">Third-party software connects to the MaClaw HTTP gateway, sends user messages with JSON, and retrieves Agent replies through cursor-based long polling. The client does not need to expose public callback or file download URLs; MaClaw provides upload and download URLs for files.</p>
    <p>
      <span class="pill">Default endpoint http://127.0.0.1:18777/api/im-gateway/v1</span>
      <span class="pill">Bearer Token</span>
      <span class="pill">Small files inline</span>
      <span class="pill">Large files by server URL</span>
    </p>

    <h2>1. Integration Flow</h2>
    <ol>
      <li>Open <code>Settings / Message Access / Third-party Access</code> in MaClaw.</li>
      <li>Configure <code>Host</code>, <code>Port</code>, and <code>Token</code>. The default listener is <code>127.0.0.1:18777</code>.</li>
      <li>Call <code>POST /handshake</code> to discover capabilities, limits, and polling settings.</li>
      <li>For small files, send base64 <code>data</code> directly in <code>POST /incoming</code>.</li>
      <li>For large files, call <code>POST /media/upload-url</code>, upload bytes with the returned <code>PUT</code> URL, then reference the returned <code>media.id</code> or <code>media.url</code> in the message.</li>
      <li>Call <code>GET /outgoing</code> with a <code>cursor</code> to long-poll replies, then call <code>POST /ack</code>.</li>
    </ol>

    <h2>2. Authentication</h2>
    <p>Except for <code>/health</code> and media URLs protected by <code>mediaToken</code>, requests should include:</p>
    <pre>Authorization: Bearer &lt;token&gt;</pre>
    <p>Use Generate Token in MaClaw to create a strong random key. If it may have leaked, regenerate it and update the third-party configuration. The <code>mediaToken</code> inside upload/download URLs is generated by MaClaw; clients should only use those URLs, not construct them.</p>

    <h2>3. Capabilities and Limits</h2>
    <p>Protocol structs, validators, default limits, feature flags, strict JSON decoding, and handshake response construction are centralized in <code>corelib/im</code>. MaClawSrv and MaClaw GUI use the same core implementation, so a ThirdAPIDemo client sees the same protocol behavior from either endpoint. The handshake <code>mode</code> is <code>maclaw</code> for both server implementations.</p>
    <p><code>/handshake</code> returns these capabilities:</p>
    <pre>["text","image","file","voice","audio","attachments","server_media_upload","server_media_download","long_poll","ack","idempotency","client_tools","tool_call","tool_plan","tool_result","tool_cancel"]</pre>
    <table>
      <thead><tr><th>Limit</th><th>Meaning</th></tr></thead>
      <tbody>
        <tr><td><code>maxTextChars</code></td><td>Maximum text message length.</td></tr>
        <tr><td><code>maxMediaCaption</code></td><td>Maximum caption length for image, file, and voice messages.</td></tr>
        <tr><td><code>maxAttachments</code></td><td>Maximum attachments per message, currently 10.</td></tr>
        <tr><td><code>maxDirectBytes</code></td><td>Maximum bytes allowed in direct base64 <code>data</code>, currently 256 KiB. Larger files must use server media URLs.</td></tr>
        <tr><td><code>maxBodyBytes</code></td><td>Maximum JSON request body size, currently 16 MiB.</td></tr>
        <tr><td><code>maxMediaBytes</code></td><td>Maximum server-media upload size, currently 50 MiB for both MaClawSrv and MaClaw GUI.</td></tr>
      </tbody>
    </table>

    <h2>4. Endpoints</h2>
    <h3>GET /health</h3>
    <pre>{ "ok": true, "requestId": "gw_1760000000000000000", "status": "connected", "protocolVersion": "1" }</pre>

    <h3>POST /handshake</h3>
    <pre>{
  "clientId": "demo-client",
  "clientName": "Demo CRM",
  "protocolVersion": "1"
}</pre>

    <h3>POST /incoming</h3>
    <pre>{
  "eventId": "evt-20260610-0001",
  "clientId": "demo-client",
  "conversationId": "customer-42",
  "user": { "id": "u42", "name": "Zhang San" },
  "message": { "type": "text", "text": "Check order status" },
  "createdAt": 1781028000000
}</pre>
    <p><code>eventId</code> is idempotent. Retrying the same event will not trigger duplicate processing. Supported <code>message.type</code> values are <code>text</code>, <code>image</code>, <code>file</code>, and <code>voice</code>; <code>audio</code> is normalized to <code>voice</code>.</p>

    <h3>Small Direct Media</h3>
    <pre>{
  "eventId": "evt-image-1",
  "clientId": "demo-client",
  "conversationId": "customer-42",
  "user": { "id": "u42", "name": "Zhang San" },
  "message": {
    "type": "image",
    "text": "Please inspect this screenshot",
    "fileName": "screen.png",
    "mimeType": "image/png",
    "data": "&lt;base64&gt;",
    "sizeBytes": 12345
  }
}</pre>
    <p>For direct <code>data</code>, <code>sizeBytes</code> is optional. When it is greater than zero, it must equal the decoded base64 byte count or the gateway returns <code>400</code>.</p>

    <h3>Large File Upload URL</h3>
    <pre>POST /media/upload-url
{
  "clientId": "demo-client",
  "type": "file",
  "fileName": "report.pdf",
  "mimeType": "application/pdf",
  "sizeBytes": 7340032
}</pre>
    <pre>{
  "ok": true,
  "media": {
    "id": "server-media-id",
    "type": "file",
    "fileName": "report.pdf",
    "mimeType": "application/pdf",
    "url": "http://127.0.0.1:18777/api/im-gateway/v1/media/server-media-id?mediaToken=..."
  },
  "upload": {
    "method": "PUT",
    "url": "http://127.0.0.1:18777/api/im-gateway/v1/media/server-media-id/upload?mediaToken=...",
    "contentType": "application/pdf",
    "maxBytes": 52428800
  },
  "download": {
    "url": "http://127.0.0.1:18777/api/im-gateway/v1/media/server-media-id?mediaToken=..."
  }
}</pre>
    <p>The client then sends raw bytes to <code>upload.url</code> with <code>PUT</code>, and references the returned media object in the message. The client must not provide its own download URL for the server to fetch. <code>upload.maxBytes</code> is enforced by the gateway; when <code>sizeBytes</code> is greater than zero, the uploaded byte count must match it exactly or the gateway returns <code>400</code>.</p>
    <pre>{
  "eventId": "evt-file-1",
  "clientId": "demo-client",
  "conversationId": "customer-42",
  "user": { "id": "u42", "name": "Zhang San" },
  "message": {
    "type": "file",
    "text": "Please read this report",
    "attachments": [{
      "id": "server-media-id",
      "type": "file",
      "fileName": "report.pdf",
      "mimeType": "application/pdf",
      "url": "http://127.0.0.1:18777/api/im-gateway/v1/media/server-media-id?mediaToken=...",
      "sizeBytes": 7340032
    }]
  }
}</pre>
    <p>The same server media can also be referenced by <code>id</code> only. Small files are passed to the Agent as inline attachments for reading or vision; large files are represented in Agent context by server media ID/URL.</p>

    <h3>GET /outgoing</h3>
    <pre>GET /outgoing?clientId=demo-client&amp;cursor=0&amp;timeout=25&amp;limit=20</pre>
    <pre>{
  "ok": true,
  "messages": [{
    "id": "reply-12",
    "cursor": "12",
    "conversationId": "customer-42",
    "replyToMessageId": "third_api_demo_1781028000000",
    "type": "text",
    "text": "The order is being delivered.",
    "createdAt": 1781028005123
  }],
  "nextCursor": "12",
  "hasMore": false
}</pre>

    <h3>POST /ack</h3>
    <pre>{ "clientId": "demo-client", "messageIds": ["reply-12"], "status": "delivered" }</pre>

    <h2>5. Client Tool Execution Extension</h2>
    <p>This optional extension is for industrial control, desktop automation, and other integrations where the connected client can execute a small whitelist of tools. It is not enabled unless the client advertises <code>client_tools</code> during <code>/handshake</code>.</p>
    <pre>{
  "capabilities": { "client_tools": true },
  "tools": [{
    "name": "plc.write_register",
    "risk": "write",
    "requiresApproval": true,
    "inputSchema": {
      "type": "object",
      "properties": {
        "address": { "type": "integer" },
        "value": { "type": "integer" }
      },
      "required": ["address", "value"]
    }
  }]
}</pre>
    <p>MaClaw may return <code>type: "tool_call"</code> for one operation or <code>type: "tool_plan"</code> for multiple steps. Tool plans can use <code>sequential</code>, <code>parallel</code>, <code>dag</code>, or <code>interactive</code> mode. For industrial control, prefer <code>sequential</code> or <code>dag</code>; dangerous writes should require approval per step.</p>
    <pre>{
  "type": "tool_plan",
  "toolPlan": {
    "id": "tp_001",
    "mode": "sequential",
    "steps": [
      { "id": "step_1", "tool": "plc.read_register", "arguments": { "address": 40001 } },
      { "id": "step_2", "tool": "plc.write_register", "arguments": { "address": 40002, "valueFrom": "step_1.value" }, "dependsOn": ["step_1"], "requiresApproval": true }
    ]
  }
}</pre>
    <p>Execution completion must be reported to <code>POST /tool-result</code> with stable <code>resultId</code> or <code>idempotencyKey</code>, and <code>status</code> set to <code>success</code>, <code>error</code>, <code>rejected</code>, <code>cancelled</code>, or <code>timeout</code>. <code>/ack</code> only means the client received the outgoing message; it does not mean a tool completed. Every write-like call should have an <code>idempotencyKey</code>, timeout, audit record, and local client-side policy check. Large tool outputs should use the same server-owned media flow instead of large JSON payloads.</p>

    <h2>6. Field Contract</h2>
    <table>
      <thead><tr><th>Field</th><th>Description</th></tr></thead>
      <tbody>
        <tr><td><code>clientId</code></td><td>Stable unique ID for the third-party software instance.</td></tr>
        <tr><td><code>conversationId</code></td><td>Conversation, customer, ticket, or group ID from the third-party system.</td></tr>
        <tr><td><code>eventId</code></td><td>Unique inbound message ID for retry idempotency.</td></tr>
        <tr><td><code>message.id</code> / <code>attachments[].id</code></td><td>Server media ID. It can be used as the only media reference.</td></tr>
        <tr><td><code>message.data</code> / <code>attachments[].data</code></td><td>Base64 content for small files. Must be smaller than <code>maxDirectBytes</code>.</td></tr>
        <tr><td><code>message.url</code> / <code>attachments[].url</code></td><td>Server-provided media download URL. Clients only access it.</td></tr>
        <tr><td><code>message.fileName</code> / <code>attachments[].fileName</code></td><td>Media metadata only. It does not replace <code>id</code>, <code>data</code>, or server <code>url</code>.</td></tr>
        <tr><td><code>toolCall.id</code></td><td>Unique tool call ID generated by MaClaw.</td></tr>
        <tr><td><code>toolCall.idempotencyKey</code></td><td>Stable key used by the client to prevent duplicate execution.</td></tr>
        <tr><td><code>tool-result.resultId</code> / <code>tool-result.idempotencyKey</code></td><td>Stable result identity. Reusing it on retry prevents duplicate Agent injection.</td></tr>
        <tr><td><code>toolPlan.steps[].dependsOn</code></td><td>Step dependency list for <code>dag</code> or guarded sequential execution.</td></tr>
        <tr><td><code>cursor</code></td><td>Outgoing message cursor. The client stores the last returned value.</td></tr>
      </tbody>
    </table>

    <h2>7. Request Tracing, Errors, and ACK Semantics</h2>
    <p>Responses usually include <code>requestId</code>. Include it when reporting issues. <code>/outgoing</code> provides at-least-once delivery by cursor, so clients should deduplicate by <code>message.id</code>. <code>/ack</code> is a delivery receipt after the third-party system has delivered the reply to its user or business system; it does not replace client-side cursor persistence.</p>
    <pre>{
  "ok": false,
  "requestId": "gw_1760000000000000000",
  "error": {
    "code": "bad_request",
    "message": "clientId is required"
  }
}</pre>
    <p>MaClawSrv and MaClaw GUI return the same error envelope. Read <code>error.code</code> and <code>error.message</code>; do not depend on top-level <code>code</code> or <code>message</code> fields.</p>

    <h2>8. Test Client</h2>
    <pre>$env:MACLAW_GATEWAY_TOKEN = "your-token"
go run ./cmd/connnectMaClaw -text "hello, check gateway"</pre>

    <h2>9. Error Handling</h2>
    <table>
      <thead><tr><th>HTTP</th><th>Meaning</th><th>Action</th></tr></thead>
      <tbody>
        <tr><td>400</td><td>Invalid request shape, field, or media reference</td><td>Check JSON, base64, attachment size, and media ID.</td></tr>
        <tr><td>401</td><td>Missing or invalid token</td><td>Check the Authorization header.</td></tr>
        <tr><td>404</td><td>Media not found or invalid mediaToken</td><td>Request a new upload URL or check expiry.</td></tr>
        <tr><td>409</td><td>Duplicate event or state conflict</td><td>Treat idempotent duplicates as success, or refresh cursor.</td></tr>
        <tr><td>429</td><td>Too many requests</td><td>Retry with exponential backoff.</td></tr>
        <tr><td>5xx</td><td>MaClaw processing failure</td><td>Keep the same eventId and retry later.</td></tr>
      </tbody>
    </table>
  </section>
</main>
<script>
(function(){
  var saved = localStorage.getItem("maclawConnectorLang");
  var lang = saved || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
  function setLang(next){
    lang = next === "en" ? "en" : "zh";
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    localStorage.setItem("maclawConnectorLang", lang);
    document.querySelectorAll("[data-lang-panel]").forEach(function(el){
      el.classList.toggle("active", el.getAttribute("data-lang-panel") === lang);
    });
    document.querySelectorAll("[data-lang]").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });
  }
  document.querySelectorAll("[data-lang]").forEach(function(btn){
    btn.addEventListener("click", function(){ setLang(btn.getAttribute("data-lang")); });
  });
  setLang(lang);
})();
</script>
