<!doctype html>
<html lang="en" id="html-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaClaw Binding Manager</title>
  <style>
    :root{--bg:#f0f5ff;--panel:#fff;--text:#1a2b42;--muted:#6b7f99;--primary:#2c6fca;--ok:#1f8f6a;--danger:#bf5648;--warn:#b98219;--line:rgba(37,84,140,.15);--radius:14px;--shadow:0 12px 32px rgba(37,84,140,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:linear-gradient(180deg,#eef5ff 0%,var(--bg) 100%);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .container{width:min(520px,100%);background:var(--panel);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
    .header{padding:28px 28px 20px;background:linear-gradient(135deg,#d4e4f7 0%,#a8c8e8 100%);text-align:center}
    .header h1{font-size:24px;color:#123456;margin-bottom:4px}.header p{color:rgba(18,52,86,.7);font-size:14px}
    .tabs{display:flex;border-bottom:1px solid var(--line)}
    .tabs button{flex:1;padding:14px 0;background:none;border:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
    .tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tabs button:hover{color:var(--primary);background:rgba(44,111,202,.04)}
    .panel{display:none;padding:24px}.panel.active{display:block}
    label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
    input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:#fff;color:var(--text);transition:border-color .2s,box-shadow .2s}
    input:focus{outline:none;border-color:rgba(44,111,202,.5);box-shadow:0 0 0 3px rgba(44,111,202,.1)}
    .field{margin-bottom:16px}
    .btn{width:100%;height:44px;border:none;border-radius:var(--radius);font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
    .btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
    .btn-primary{background:linear-gradient(135deg,#2c6fca,#558fd7);color:#fff;box-shadow:0 8px 20px rgba(44,111,202,.25)}
    .btn-danger{background:#fff1ee;color:var(--danger);border:1px solid rgba(199,90,74,.2)}
    .btn-secondary{background:#eef3fb;color:#234f87}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .result{margin-top:16px;padding:16px;border-radius:var(--radius);font-size:13px;line-height:1.7;word-break:break-all}
    .result.success{background:rgba(31,143,106,.08);border:1px solid rgba(31,143,106,.2);color:var(--ok)}
    .result.error{background:rgba(199,90,74,.08);border:1px solid rgba(199,90,74,.2);color:var(--danger)}
    .result.info{background:rgba(44,111,202,.06);border:1px solid rgba(44,111,202,.15);color:var(--primary)}
    .result.warn{background:rgba(185,130,25,.06);border:1px solid rgba(185,130,25,.2);color:var(--warn)}
    .code-row{display:flex;gap:10px;align-items:flex-end}
    .code-row .field{flex:1;margin-bottom:0}
    .code-row .btn{width:auto;min-width:110px;flex-shrink:0;height:44px;font-size:13px}
    .channel-select{display:flex;gap:8px;margin-bottom:16px}
    .channel-select button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
    .channel-select button.active{background:rgba(44,111,202,.08);border-color:rgba(44,111,202,.3);color:var(--primary)}
    .hidden{display:none!important}
    .info-grid{display:grid;gap:8px}.info-row{display:flex;gap:8px}.info-label{min-width:80px;color:var(--muted);font-size:12px;font-weight:700}.info-value{font-size:13px}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
    .badge-ok{background:rgba(31,143,106,.12);color:var(--ok)}.badge-warn{background:rgba(185,130,25,.12);color:var(--warn)}
    .warn-box{padding:14px 16px;border-radius:var(--radius);background:rgba(185,130,25,.06);border:1px dashed rgba(185,130,25,.3);color:var(--warn);font-size:13px;line-height:1.6;margin-bottom:16px}
    body.embed{min-height:auto;padding:0;background:#fff;align-items:flex-start}
    body.embed .container{border-radius:0;box-shadow:none;width:100%}
    body.embed .header{padding:14px 20px 10px}
    body.embed .header h1{font-size:18px}
    body.embed .header p{font-size:12px}
    body.embed .tabs button{padding:10px 0;font-size:13px}
    body.embed .panel{padding:16px 20px}
    body.embed .field{margin-bottom:10px}
    body.embed label{margin-bottom:4px;font-size:11px}
    body.embed input{height:36px;padding:0 10px;font-size:13px;border-radius:10px}
    body.embed .btn{height:36px;font-size:13px;border-radius:10px}
    body.embed .code-row .btn{min-width:90px;height:36px;font-size:12px}
    body.embed .result{margin-top:10px;padding:10px 12px;font-size:12px;border-radius:10px}
    body.embed .channel-select{gap:6px;margin-bottom:10px}
    body.embed .channel-select button{padding:7px;font-size:12px;border-radius:8px}
    body.embed .warn-box{padding:10px 12px;font-size:12px;margin-bottom:10px;border-radius:10px}
    body.embed .info-label{font-size:11px}
    body.embed .info-value{font-size:12px}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle">MaClaw Binding Manager</h1>
    <p id="pageDesc"></p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="bind" class="active" aria-selected="true" data-i18n="tabBind">Bind Device</button>
    <button role="tab" data-tab="query" aria-selected="false" data-i18n="tabQuery">Query Binding</button>
    <button role="tab" data-tab="unbind" aria-selected="false" data-i18n="tabUnbind">Unbind Device</button>
  </div>

  <div id="tab-bind" class="panel active" role="tabpanel">
    <div class="field"><label for="bindEmail" data-i18n="emailLabel">Email</label><input id="bindEmail" type="email" placeholder="your@email.com"></div>
    <div id="bindCodeField" class="field"><label for="bindCode" data-i18n="inviteCodeLabel">Invitation Code</label><input id="bindCode" type="text"></div>
    <button class="btn btn-primary" id="btnBind" data-i18n="bindAction">Bind</button>
    <div id="bindResult" class="result hidden"></div>
  </div>

  <div id="tab-query" class="panel" role="tabpanel">
    <div class="field"><label for="queryEmail" data-i18n="emailLabel">Email</label><input id="queryEmail" type="email" placeholder="your@email.com"></div>
    <button class="btn btn-secondary" id="btnQuery" data-i18n="queryAction">Query</button>
    <div id="queryResult" class="result hidden"></div>
  </div>

  <div id="tab-unbind" class="panel" role="tabpanel">
    <div id="unbindWarning" class="warn-box hidden"></div>
    <div class="field"><label for="unbindEmail" data-i18n="emailLabel">Email</label><input id="unbindEmail" type="email" placeholder="your@email.com"></div>
    <label data-i18n="sendCodeChannel">Verification Channel</label>
    <div class="channel-select" role="radiogroup">
      <button role="radio" aria-checked="true" class="active" data-channel="email" data-i18n="channelEmail">Email</button>
      <button role="radio" aria-checked="false" data-channel="feishu" data-i18n="channelFeishu">Feishu</button>
      <button role="radio" aria-checked="false" data-channel="both" data-i18n="channelBoth">Both</button>
    </div>
    <div class="code-row">
      <div class="field"><label for="unbindCode" data-i18n="verifyCodeLabel">Verification Code</label><input id="unbindCode" type="text" maxlength="6" inputmode="numeric" pattern="[0-9]*"></div>
      <button id="sendCodeBtn" class="btn btn-secondary" data-i18n="sendCode">Send Code</button>
    </div>
    <div style="height:16px"></div>
    <button class="btn btn-danger" id="btnUnbind" data-i18n="unbindConfirm">Confirm Unbind</button>
    <div id="unbindResult" class="result hidden"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var LANG = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  document.getElementById('html-root').lang = LANG === 'zh' ? 'zh-CN' : 'en';

  var I18N = {
    title: { zh: '绑定管理', en: 'Binding Manager' },
    pageTitle: { zh: 'MaClaw 绑定管理', en: 'MaClaw Binding Manager' },
    pageDesc: { zh: '绑定、查询或解除您的设备绑定', en: 'Bind, query, or remove your device binding.' },
    tabBind: { zh: '绑定设备', en: 'Bind Device' },
    tabQuery: { zh: '查询绑定', en: 'Query Binding' },
    tabUnbind: { zh: '解除绑定', en: 'Unbind Device' },
    emailLabel: { zh: '邮箱', en: 'Email' },
    inviteCodeLabel: { zh: '邀请码', en: 'Invitation Code' },
    inviteCodePlaceholder: { zh: '输入邀请码', en: 'Enter invitation code' },
    bindAction: { zh: '绑定', en: 'Bind' },
    queryAction: { zh: '查询', en: 'Query' },
    sendCodeChannel: { zh: '发送验证码渠道', en: 'Verification Channel' },
    channelEmail: { zh: '📧 邮箱', en: 'Email' },
    channelFeishu: { zh: '💬 飞书', en: 'Feishu' },
    channelBoth: { zh: '📧+💬 两者', en: 'Both' },
    verifyCodeLabel: { zh: '验证码', en: 'Verification Code' },
    verifyCodePlaceholder: { zh: '6位验证码', en: '6-digit code' },
    sendCode: { zh: '发送验证码', en: 'Send Code' },
    unbindConfirm: { zh: '确认解绑', en: 'Confirm Unbind' },
    unbindWarning: { zh: '⚠️ 解绑将删除所有设备绑定、IM 绑定（飞书/QQ等）。', en: 'Unbinding will remove all device bindings and IM bindings (Feishu/QQ, etc.).' },
    unbindWarningInvite: { zh: '原邀请码将失效，解绑后需要获取新的邀请码才能重新绑定。', en: 'The original invitation code will become invalid. You will need a new invitation code to bind again.' },
    pleaseEnterEmail: { zh: '请输入邮箱', en: 'Please enter your email.' },
    pleaseEnterEmailAndCode: { zh: '请输入邮箱和验证码', en: 'Please enter your email and verification code.' },
    bindSuccess: { zh: '✅ 绑定成功', en: 'Bind successful' },
    pendingApproval: { zh: '⏳ 已提交，等待管理员审批', en: 'Submitted. Waiting for administrator approval.' },
    manualBindingRequired: { zh: '⚠️ 当前需要管理员手动绑定，请联系管理员', en: 'Manual administrator binding is required. Please contact the administrator.' },
    bindFailed: { zh: '绑定失败', en: 'Bind failed' },
    queryNoBinding: { zh: '该邮箱尚未绑定', en: 'This email is not bound yet.' },
    networkError: { zh: '网络错误', en: 'Network error' },
    statusLabel: { zh: '状态', en: 'Status' },
    boundBadge: { zh: '已绑定', en: 'Bound' },
    userStatusLabel: { zh: '用户状态', en: 'User Status' },
    createdAtLabel: { zh: '注册时间', en: 'Created At' },
    deviceIdLabel: { zh: '设备ID', en: 'Device ID' },
    codeSent: { zh: '✅ 验证码已发送至: {channels}', en: 'Verification code sent to: {channels}' },
    sendFailed: { zh: '发送失败', en: 'Send failed' },
    confirmUnbind: { zh: '\u786e\u5b9a\u8981\u89e3\u9664 {email} \u7684\u6240\u6709\u7ed1\u5b9a\u5417\uff1f\n\n\u5c06\u4f1a\uff1a\n\u2022 \u5220\u9664\u6240\u6709\u8bbe\u5907\u7ed1\u5b9a\n\u2022 \u5220\u9664\u98de\u4e66/QQ\u7b49 IM \u7ed1\u5b9a', en: 'Are you sure you want to remove all bindings for {email}?\n\nThis will:\n- Remove all device bindings\n- Remove IM bindings such as Feishu/QQ' },
    confirmUnbindInvite: { zh: '\n\u2022 \u539f\u9080\u8bf7\u7801\u5c06\u5931\u6548\n\n\u26a0\ufe0f \u89e3\u7ed1\u540e\u9700\u8981\u83b7\u53d6\u65b0\u7684\u9080\u8bf7\u7801\u624d\u80fd\u91cd\u65b0\u7ed1\u5b9a\uff01', en: '\n- The original invitation code will be invalidated\n\nYou will need a new invitation code to bind again.' },
    unbindSuccess: { zh: '✅ 解绑成功，已删除 {count} 台设备', en: 'Unbind successful. Removed {count} device(s).' },
    codesDeleted: { zh: '，已删除 {count} 个邀请码', en: ', and removed {count} invitation code(s)' },
    needNewInvite: { zh: '⚠️ 重新绑定需要获取新的邀请码', en: 'A new invitation code is required to bind again.' },
    unbindFailed: { zh: '解绑失败', en: 'Unbind failed' }
  };

  function t(key, vars) {
    var text = (I18N[key] && I18N[key][LANG]) || key;
    return String(text).replace(/{(w+)}/g, function(_, name) {
      return vars && vars[name] != null ? vars[name] : '';
    });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function applyI18n() {
    document.title = 'MaClaw ' + t('title');
    document.getElementById('pageTitle').textContent = t('pageTitle');
    document.getElementById('pageDesc').textContent = t('pageDesc');
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.getElementById('bindCode').placeholder = t('inviteCodePlaceholder');
    document.getElementById('unbindCode').placeholder = t('verifyCodePlaceholder');
  }

  if (new URLSearchParams(window.location.search).get('embed') === '1') {
    document.body.classList.add('embed');
  }

  var selectedChannel = 'email';
  var countdownTimer = null;
  var invCodeRequired = false;
  var apiBase = window.location.origin;

  applyI18n();

  fetch(apiBase + '/api/bind/config').then(function(r) { return r.json(); }).then(function(cfg) {
    invCodeRequired = !!cfg.invitation_code_required;
    if (!invCodeRequired) {
      var f = document.getElementById('bindCodeField');
      if (f) f.classList.add('hidden');
    }
    var warn = document.getElementById('unbindWarning');
    var msg = esc(t('unbindWarning'));
    if (invCodeRequired) msg += '<br>' + esc(t('unbindWarningInvite'));
    warn.innerHTML = msg;
    warn.classList.remove('hidden');
  }).catch(function() {});

  document.querySelector('.tabs').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    var name = btn.dataset.tab;
    document.querySelectorAll('.tabs [data-tab]').forEach(function(b) {
      var active = b.dataset.tab === name;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active);
    });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('tab-' + name).classList.add('active');
  });

  document.querySelector('.channel-select').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-channel]');
    if (!btn) return;
    selectedChannel = btn.dataset.channel;
    this.querySelectorAll('[data-channel]').forEach(function(b) {
      var active = b.dataset.channel === selectedChannel;
      b.classList.toggle('active', active);
      b.setAttribute('aria-checked', active);
    });
  });

  function showResult(id, html, type) {
    var el = document.getElementById(id);
    el.className = 'result ' + type;
    el.innerHTML = html;
  }

  async function api(path, body) {
    var resp = await fetch(apiBase + path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    return resp.json();
  }

  document.getElementById('btnBind').addEventListener('click', async function() {
    var email = document.getElementById('bindEmail').value.trim();
    var code = document.getElementById('bindCode').value.trim();
    if (!email) return showResult('bindResult', esc(t('pleaseEnterEmail')), 'error');

    try {
      var data = await api('/api/enroll/start', {
        email: email, invitation_code: code,
        machine_name: 'WebBind', platform: 'web'
      });
      if (data.status === 'approved' || data.status === 'already_enrolled') {
        var h = '<strong>' + esc(t('bindSuccess')) + '</strong><br>';
        if (data.email) h += esc(t('emailLabel')) + ': ' + esc(data.email) + '<br>';
        if (data.sn) h += 'SN: ' + esc(data.sn) + '<br>';
        if (data.machine_id) h += esc(t('deviceIdLabel')) + ': ' + esc(data.machine_id) + '<br>';
        showResult('bindResult', h, 'success');
      } else if (data.status === 'pending_approval') {
        showResult('bindResult', esc(t('pendingApproval')), 'info');
      } else if (data.status === 'manual_binding_required') {
        showResult('bindResult', esc(t('manualBindingRequired')), 'error');
      } else {
        showResult('bindResult', esc(data.message || data.code || t('bindFailed')), 'error');
      }
    } catch (e) {
      showResult('bindResult', esc(t('networkError')) + ': ' + esc(e.message), 'error');
    }
  });

  document.getElementById('btnQuery').addEventListener('click', async function() {
    var email = document.getElementById('queryEmail').value.trim();
    if (!email) return showResult('queryResult', esc(t('pleaseEnterEmail')), 'error');

    try {
      var data = await api('/api/bind/query', { email: email });
      if (data.bound) {
        var h = '<div class="info-grid">';
        h += '<div class="info-row"><span class="info-label">' + esc(t('statusLabel')) + '</span><span class="info-value"><span class="badge badge-ok">' + esc(t('boundBadge')) + '</span></span></div>';
        h += '<div class="info-row"><span class="info-label">' + esc(t('emailLabel')) + '</span><span class="info-value">' + esc(data.email) + '</span></div>';
        h += '<div class="info-row"><span class="info-label">SN</span><span class="info-value">' + esc(data.sn) + '</span></div>';
        h += '<div class="info-row"><span class="info-label">' + esc(t('userStatusLabel')) + '</span><span class="info-value">' + esc(data.status) + '</span></div>';
        h += '<div class="info-row"><span class="info-label">' + esc(t('createdAtLabel')) + '</span><span class="info-value">' + esc(new Date(data.created_at).toLocaleString(LANG === 'zh' ? 'zh-CN' : 'en-US')) + '</span></div>';
        h += '</div>';
        showResult('queryResult', h, 'info');
      } else {
        showResult('queryResult', esc(t('queryNoBinding')), 'info');
      }
    } catch (e) {
      showResult('queryResult', esc(t('networkError')) + ': ' + esc(e.message), 'error');
    }
  });

  document.getElementById('sendCodeBtn').addEventListener('click', async function() {
    var email = document.getElementById('unbindEmail').value.trim();
    if (!email) return showResult('unbindResult', esc(t('pleaseEnterEmail')), 'error');

    var btn = this;
    btn.disabled = true;
    var sec = 60;
    btn.textContent = sec + 's';
    countdownTimer = setInterval(function() {
      sec--;
      btn.textContent = sec + 's';
      if (sec <= 0) {
        clearInterval(countdownTimer);
        countdownTimer = null;
        btn.disabled = false;
        btn.textContent = t('sendCode');
      }
    }, 1000);

    try {
      var data = await api('/api/bind/send-code', { email: email, channel: selectedChannel });
      if (data.ok) {
        showResult('unbindResult', esc(t('codeSent', { channels: (data.sent_via || []).join(', ') })), 'success');
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        btn.disabled = false;
        btn.textContent = t('sendCode');
        showResult('unbindResult', esc(data.message || t('sendFailed')), 'error');
      }
    } catch (e) {
      clearInterval(countdownTimer);
      countdownTimer = null;
      btn.disabled = false;
      btn.textContent = t('sendCode');
      showResult('unbindResult', esc(t('networkError')) + ': ' + esc(e.message), 'error');
    }
  });

  document.getElementById('btnUnbind').addEventListener('click', async function() {
    var email = document.getElementById('unbindEmail').value.trim();
    var code = document.getElementById('unbindCode').value.trim();
    if (!email || !code) return showResult('unbindResult', esc(t('pleaseEnterEmailAndCode')), 'error');

    var confirmMsg = t('confirmUnbind', { email: email });
    if (invCodeRequired) confirmMsg += t('confirmUnbindInvite');
    if (!confirm(confirmMsg)) return;

    try {
      var data = await api('/api/bind/unbind', { email: email, code: code });
      if (data.ok) {
        var msg = esc(t('unbindSuccess', { count: String(data.deleted_machines) }));
        if (data.codes_deleted > 0) msg += esc(t('codesDeleted', { count: String(data.codes_deleted) }));
        if (invCodeRequired) msg += '<br><br>' + esc(t('needNewInvite'));
        showResult('unbindResult', msg, 'success');
      } else {
        showResult('unbindResult', esc(data.message || t('unbindFailed')), 'error');
      }
    } catch (e) {
      showResult('unbindResult', esc(t('networkError')) + ': ' + esc(e.message), 'error');
    }
  });
})();
</script>
</body>
</html>
