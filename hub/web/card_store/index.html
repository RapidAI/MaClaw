<html lang="zh-CN">

          <svg viewBox="0 0 24 24" focusable="false">

            <path d="M8.5 9.5V7a3.5 3.5 0 0 1 7 0v2" fill="none"/>
            <path d="M4.4 9.5 6 4.7h12l1.6 4.8" fill="none"/>
          </svg>
        </span>
        <span><strong data-i18n="brandName">MaClaw 商店</strong><small data-i18n="brandSubtitle">购买服务兑换卡</small></span>
      </a>
      <nav class="top-actions" aria-label="Store links">
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="langZh" type="button" data-lang="zh" aria-pressed="true">中</button>
          <button id="langEn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <span id="tenantChip" class="tenant-chip" hidden></span>
        <button id="accountBtn" class="account-chip" type="button" hidden></button>
        <a class="ghost" href="/get-credits" data-credits-center-link data-i18n="creditsCenter">额度中心</a>
        <button id="reloadBtn" type="button" data-i18n="reload">刷新</button>

        <h1 data-i18n="heroTitle">购买服务兑换卡</h1>
        <p class="lead" data-i18n="heroLead">选择日卡、周卡、月卡、季卡、年卡，或购买 1 万 / 5 万点纯点卡。填写注册邮箱后创建支付订单，支付完成后页面会显示服务兑换码并发送到邮箱。</p>
      </div>
      <div class="hero-card" aria-hidden="true">
        <svg viewBox="0 0 360 220" role="img">
          <defs>
            <linearGradient id="heroCardGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13315c"/><stop offset=".56" stop-color="#2563eb"/><stop offset="1" stop-color="#13a68b"/></linearGradient>
            <pattern id="heroCircuit" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 16h12M20 16h12M16 0v12M16 20v12" stroke="rgba(255,255,255,.18)" stroke-width="1.4" fill="none"/><circle cx="16" cy="16" r="2" fill="rgba(255,255,255,.38)"/></pattern>
          </defs>
          <rect x="18" y="24" width="324" height="172" rx="18" fill="url(#heroCardGradient)"/>
          <rect x="18" y="24" width="324" height="172" rx="18" fill="url(#heroCircuit)"/>
          <path d="M48 66h88M48 92h154M48 148h68" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".92"/>
          <path d="M250 58a38 38 0 1 1-1 0M250 76v40M230 96h40" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none" opacity=".86"/>
        </svg>
      </div>
    </section>

    <section class="status-band">
      <div><strong id="storeState" data-i18n="loading">加载中...</strong><span data-i18n="priceConfigured">所有价格由后台「在线商店」配置。</span></div>
      <div><strong data-i18n="paymentTitle">支付后续</strong><span data-i18n="paymentDesc">支付通知验签成功后，系统自动生成服务兑换码。</span></div>
      <div><strong data-i18n="recoveryTitleShort">邮箱找回</strong><span data-i18n="recoveryDescShort">忘记兑换码时可用购买邮箱重新发送。</span></div>
    </section>

    <section class="section-head">
      <div><p class="eyebrow" data-i18n="catalogEyebrow">Catalog</p><h2 data-i18n="catalogTitle">可购买卡种</h2></div>
      <p data-i18n="catalogDesc">服务卡覆盖固定周期，点卡用于补充 credits。</p>
    </section>
    <section id="products" class="products" aria-live="polite"></section>

    <section class="recovery-panel">
      <div><p class="eyebrow" data-i18n="recoveryEyebrow">Recovery</p><h2 data-i18n="recoveryTitle">找回服务兑换码</h2><p data-i18n="recoveryDesc">输入购买时使用的注册邮箱或第二邮箱，系统会把已支付订单的兑换码发送到该邮箱。</p></div>
      <form id="recoverForm" class="recover-form">

        </div>
        <div class="captcha-field">
          <label for="recoverCaptchaInput" data-i18n="captchaLabel">图形验证码</label>
          <div class="captcha-row">
            <canvas id="recoverCaptchaCanvas" width="112" height="42" aria-label="图形验证码"></canvas>
            <input id="recoverCaptchaInput" type="text" inputmode="numeric" autocomplete="off" maxlength="3" data-i18n-placeholder="captchaPlaceholder" placeholder="输入结果" required>
            <button id="refreshCaptchaBtn" class="captcha-refresh" type="button" data-i18n="captchaRefresh">换一张</button>
          </div>
        </div>
        <button id="recoverSubmitBtn" type="submit" data-i18n="recoverButton">发送找回邮件</button>
      </form>
      <div id="recoverMsg" class="msg" aria-live="polite"></div>
    </section>
  </main>

    function newCaptchaChallenge() {
      const left = Math.floor(Math.random() * 18) + 2;
      const right = Math.floor(Math.random() * 9) + 1;

      return useSubtract

        : { text: left + ' + ' + right + ' = ?', answer: String(left + right) };
    }

      const canvas = document.getElementById('recoverCaptchaCanvas');

      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#eff6ff');
      gradient.addColorStop(1, '#ecfdf5');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = i % 2 ? 'rgba(37,99,235,.16)' : 'rgba(15,143,104,.16)';

        if (res.ok) msg.textContent = t('waitingNotify') + orderNo;
      }
      msg.textContent = t('notifyTimeout');
    }
    async function resumeReturnedOrder() {
      const orderNo = String(urlParams.get('order_no') || '').trim();
      if (!orderNo) return;
      const email = registeredEmail || normalizeEmail(urlParams.get('email') || '');
      if (!email) return;
      showCheckoutResult({ order_no: orderNo, email, message: urlParams.get('payment_return') === 'alipay_verify_pending' ? t('alipayVerifyPending') : t('returnOrderLoading') }, false);
      const panel = ensureCheckoutResultPanel();
      const msg = panel.querySelector('[data-result-msg]');
      try {
        const qs = new URLSearchParams({ email });
        if (tenantId) qs.set('tenant_id', tenantId);
        const res = await fetch('/api/card-store/orders/' + encodeURIComponent(orderNo) + '?' + qs.toString());
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.status === 'paid' && body.code) {
          showCheckoutResult(body, true);
          return;
        }
      } catch (_) {}
      pollOrder(orderNo, tenantId, email, msg, null);
    }
    async function loadProducts() {
      state.textContent = t('loading');
      try {
        const qs = tenantId ? '?tenant_id=' + encodeURIComponent(tenantId) : '';
        const res = await fetch('/api/card-store/products' + qs);
        render(await res.json());
      } catch (_) {
        state.textContent = t('loadFailed');
      }
    }
    async function loadMe() {
      const hash = (window.location.hash || '').replace(/^#/, '');
      const hashToken = new URLSearchParams(hash).get('token') || '';
      const queryToken = new URLSearchParams(window.location.search || '').get('token') || '';
      const token = hashToken || queryToken || localStorage.getItem('maclaw-get-credits-token') || localStorage.getItem('viewer_token') || localStorage.getItem('maclaw_viewer_token') || '';
      if (hashToken || queryToken) { localStorage.setItem('maclaw-get-credits-token', token); if (window.history && window.history.replaceState) window.history.replaceState(null, document.title, cleanCardStoreURL()); }
      if (!token) return;
      try {
        const res = await fetch('/api/card-store/me', { headers: { Authorization: 'Bearer ' + token } });
        const body = await res.json();
        if (body.authenticated && body.email) {
          setBuyerEmails(body.email, secondaryEmail);
          if (body.tenant_id) setTenantId(body.tenant_id);
          if (window.history && window.history.replaceState) window.history.replaceState(null, document.title, cleanCardStoreURL());
        }
      } catch (_) {}
    }
    document.getElementById('recoverForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const msg = document.getElementById('recoverMsg');
      const emailInput = document.getElementById('recoverEmail');
      const submitBtn = document.getElementById('recoverSubmitBtn');
      const email = emailInput.value.trim().toLowerCase();
      const captchaInput = document.getElementById('recoverCaptchaInput');
      const captcha = String(captchaInput.value || '').trim();
      if (!email || !emailInput.checkValidity()) { msg.textContent = t('enterEmail'); emailInput.focus(); return; }
      if (!captcha || captcha !== recoverCaptchaCode) { msg.textContent = t('captchaInvalid'); captchaInput.focus(); drawRecoverCaptcha(); captchaInput.value = ''; return; }
      msg.textContent = t('recoverSending');
      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/card-store/recover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, tenant_id: tenantId }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.message || t('recoverFailed'));
        msg.textContent = body.count ? t('recoverSent') : t('recoverNone');
        drawRecoverCaptcha();
        captchaInput.value = '';
      } catch (err) { msg.textContent = err.message || t('recoverFailed'); drawRecoverCaptcha(); captchaInput.value = ''; }
      finally { submitBtn.disabled = false; }
    });
    document.getElementById('refreshCaptchaBtn').addEventListener('click', () => { drawRecoverCaptcha(); document.getElementById('recoverCaptchaInput').value = ''; });
    document.getElementById('recoverCaptchaInput').addEventListener('input', event => { event.target.value = String(event.target.value || '').replace(/\D/g, ''); });
    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => {
        lang = normalizeLang(button.dataset.lang);
        applyI18n();
      });
    });
    document.getElementById('accountBtn').addEventListener('click', () => { void openBuyerEmailDialog(); });
    document.getElementById('reloadBtn').addEventListener('click', loadProducts);
    applyI18n();
    drawRecoverCaptcha();
    updateTenantChip();
    updateAccountChip();
    updateTenantScopedLinks();
    loadMe().finally(async () => { await loadProducts(); await resumeReturnedOrder(); });
  </script>
</body>
</html>
