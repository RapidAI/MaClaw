server:
  listen_host: 0.0.0.0
  listen_port: 9399
  public_base_url: https://hub.example.com

database:
  driver: sqlite
  dsn: ./data/maclaw-hub.db
  wal: true
  busy_timeout_ms: 5000
  max_read_open_conns: 8
  max_read_idle_conns: 4
  max_write_open_conns: 1
  max_write_idle_conns: 1

identity:
  enrollment_mode: open
  allow_self_enroll: true

pwa:
  static_dir: ./web/dist
  route_prefix: /app

center:
  enabled: true
  base_url: https://hubs.maclaw.top
  base_urls:
    - https://hubs.maclaw.top
    - https://hc-2.example.com
    - https://hc-3.example.com
  # Generated once after first registration. Keep this value when rebuilding
  # Hub's local data directory so existing ESP32 hardware bindings recover.
  installation_id: ""
  # Saved after the first registration. Retain it together with installation_id
  # if rebuilding the Hub data directory so recovery can re-register itself.
  owner_email: ""
  register_on_startup: true
  heartbeat_interval_sec: 30

hub:
  name: MaClaw Hub
  description: Self-hosted MaClaw remote hub
  visibility: private
  corporate_email_domain: ""

# Enterprise digital asset libraries (Admin "Digital Assets" + client one-way sync).
# Process-level seed only: when true, tenants start with the feature on until an admin toggles it.
# Tenant admins can enable/disable anytime under System Settings → Digital Assets (no restart).
# Env MACLAW_DIGITAL_ASSETS_ENABLED=true also seeds enabled=true for tenants without a saved setting.
digital_assets:
  enabled: false

mail:
  enabled: false
  provider: smtp
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_username: no-reply@example.com
  smtp_password: change-me
  from_name: MaClaw Hub
  from_email: no-reply@example.com

logging:
  level: info
  # Runtime logs: hub.log (all) and registration.log (onboarding/registration only).
  dir: ./data/logs
