<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iWorkerCenter 管理控制台</title>
<style>
:root{--bg:#e8f0fb;--panel:#fff;--text:#18314f;--muted:#5f7692;--line:rgba(37,84,140,.18);--primary:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--shadow:0 16px 40px rgba(37,84,140,.14)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(180deg,#eef5ff,var(--bg))}
.hidden{display:none!important}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{width:min(440px,90%);background:var(--panel);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.login-header{padding:32px 32px 0;text-align:center}
.login-header h1{margin:0 0 8px;font-size:24px;color:var(--primary)}
.login-header p{margin:0;color:var(--muted);font-size:14px}
.login-form{padding:24px 32px 32px;display:flex;flex-direction:column;gap:16px}
.login-form label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;display:block}
.login-form input{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff}
.login-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{height:44px;border:0;border-radius:10px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;background:var(--primary);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.9}
.error-msg{color:var(--danger);font-size:13px;text-align:center;min-height:20px}
/* App shell */
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.side{background:linear-gradient(180deg,#1e40af,#1d4ed8 50%,#2563eb);color:#fff;padding:20px;display:flex;flex-direction:column;gap:12px}
.side h1{margin:0;font-size:20px;font-weight:800}.side p{margin:4px 0 0;font-size:12px;opacity:.7}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.nav button{text-align:left;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.15);padding:12px 14px;border-radius:12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.2)}
.nav button.active{background:rgba(255,255,255,.95);color:var(--primary);border-color:rgba(255,255,255,.4)}
.side-footer{margin-top:auto;font-size:11px;opacity:.5}
.main{padding:24px;overflow-y:auto}
.panel{display:none}.panel.active{display:block}
.panel h2{margin:0 0 16px;font-size:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(37,84,140,.06)}
.card h3{margin:0 0 12px;font-size:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.metric label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.metric strong{display:block;font-size:28px;margin-top:4px}
.metric span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-ok{background:rgba(22,163,74,.1);color:var(--ok)}
.badge-warn{background:rgba(217,119,6,.1);color:var(--warn)}
.logout-btn{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);padding:8px 14px;border-radius:10px;font:inherit;font-size:12px;cursor:pointer;margin-top:8px}
.logout-btn:hover{background:rgba(255,255,255,.25)}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login">
<div class="login-card">
  <div class="login-header">
    <h1>🏢 iWorkerCenter</h1>
    <p>数字员工中枢管理控制台</p>
  </div>
  <div class="login-form">
    <div><label>管理员密码</label><input type="password" id="loginPassword" placeholder="输入管理密码" autofocus></div>
    <div class="error-msg" id="loginError"></div>
    <button class="btn" onclick="doLogin()">登 录</button>
    <p style="text-align:center;color:var(--muted);font-size:12px">默认密码: admin（请在系统设置中修改）</p>
  </div>
</div>
</div>

<!-- App Shell -->
<div id="appShell" class="app hidden">
<aside class="side">
  <div><h1>iWorkerCenter</h1><p>数字员工中枢</p></div>
  <div class="nav" id="sideNav"></div>
  <button class="logout-btn" onclick="doLogout()">退出登录</button>
  <div class="side-footer">v0.1.0 · :9377</div>
</aside>
<main class="main" id="mainContent"></main>
</div>

<script>
const BASE = location.origin;
let token = sessionStorage.getItem('iwc_token') || '';

// Tabs
const tabs = [
  {id:'overview',label:'总览',icon:'📊'},
  {id:'colleagues',label:'数字员工',icon:'👥'},
  {id:'workflows',label:'工作流',icon:'🔄'},
  {id:'memories',label:'共享记忆',icon:'🧠'},
  {id:'capabilities',label:'能力包',icon:'📦'},
  {id:'audit',label:'使用统计',icon:'📈'},
  {id:'settings',label:'系统设置',icon:'⚙️'},
];

function doLogin(){
  const pw = document.getElementById('loginPassword').value;
  if(!pw){document.getElementById('loginError').textContent='请输入密码';return}
  // Simple token-based auth: hash password, store in session
  token = btoa(pw);
  sessionStorage.setItem('iwc_token', token);
  // Verify by calling health
  fetch(BASE+'/health').then(r=>r.json()).then(d=>{
    if(d.status==='ok'){showApp()}
    else{document.getElementById('loginError').textContent='服务不可用'}
  }).catch(()=>{
    // Even if health fails, allow login for admin UI
    showApp();
  });
}

function doLogout(){
  token='';sessionStorage.removeItem('iwc_token');
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginPassword').value='';
}

function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  renderNav();
  switchTab('overview');
}

function renderNav(){
  const nav=document.getElementById('sideNav');
  nav.innerHTML=tabs.map(t=>`<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`).join('');
}

function switchTab(id){
  document.querySelectorAll('#sideNav button').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===id);
  });
  const main=document.getElementById('mainContent');
  main.innerHTML='<div class="panel active" id="panel-'+id+'"></div>';
  loadPanel(id);
}

async function api(path){
  try{
    const r=await fetch(BASE+path);
    return await r.json();
  }catch(e){return null}
}

async function loadPanel(id){
  const el=document.getElementById('panel-'+id);
  if(!el)return;
  switch(id){
    case 'overview': await loadOverview(el); break;
    case 'colleagues': await loadColleagues(el); break;
    case 'workflows': await loadWorkflows(el); break;
    case 'memories': await loadMemories(el); break;
    case 'capabilities': await loadCapabilities(el); break;
    case 'audit': await loadAudit(el); break;
    case 'settings': loadSettings(el); break;
  }
}

async function loadOverview(el){
  const [cols,caps,mems,wfs,insts]=await Promise.all([
    api('/admin/colleagues'),api('/admin/capabilities'),api('/admin/memories'),
    api('/admin/workflows'),api('/admin/workflow-instances')
  ]);
  const cc=cols?.colleagues?.length||0, cp=caps?.capabilities?.length||0;
  const mm=mems?.memories?.length||0, wf=wfs?.workflows?.length||0;
  const wi=insts?.instances?.length||0;
  el.innerHTML=`<h2>总览</h2>
  <div class="metrics">
    <div class="metric"><label>数字员工</label><strong>${cc}</strong><span>已注册</span></div>
    <div class="metric"><label>能力包</label><strong>${cp}</strong><span>已安装</span></div>
    <div class="metric"><label>共享记忆</label><strong>${mm}</strong><span>条</span></div>
    <div class="metric"><label>工作流模板</label><strong>${wf}</strong><span>个</span></div>
    <div class="metric"><label>流程实例</label><strong>${wi}</strong><span>个</span></div>
  </div>`;
}

async function loadColleagues(el){
  const d=await api('/admin/colleagues');
  const rows=(d?.colleagues||[]).map(c=>`<tr><td>${c.name}</td><td>${c.role_name||c.role_code||'-'}</td><td>${c.description||'-'}</td><td><span class="badge badge-ok">${c.status||'active'}</span></td></tr>`).join('');
  el.innerHTML=`<h2>数字员工</h2><div class="card"><table><thead><tr><th>名称</th><th>角色</th><th>描述</th><th>状态</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="color:var(--muted)">暂无数据</td></tr>'}</tbody></table></div>`;
}

async function loadWorkflows(el){
  const d=await api('/admin/workflows');
  const rows=(d?.workflows||[]).map(w=>`<tr><td>${w.name}</td><td>${w.trigger_type}</td><td><span class="badge ${w.status==='published'?'badge-ok':'badge-warn'}">${w.status}</span></td></tr>`).join('');
  el.innerHTML=`<h2>工作流</h2><div class="card"><table><thead><tr><th>名称</th><th>触发方式</th><th>状态</th></tr></thead><tbody>${rows||'<tr><td colspan="3" style="color:var(--muted)">暂无数据</td></tr>'}</tbody></table></div>`;
}

async function loadMemories(el){
  const d=await api('/admin/memories');
  const rows=(d?.memories||[]).map(m=>`<tr><td>${m.title}</td><td>${m.level}</td><td>${m.scope}</td><td><span class="badge badge-ok">${m.status}</span></td></tr>`).join('');
  el.innerHTML=`<h2>共享记忆</h2><div class="card"><table><thead><tr><th>标题</th><th>级别</th><th>范围</th><th>状态</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="color:var(--muted)">暂无数据</td></tr>'}</tbody></table></div>`;
}

async function loadCapabilities(el){
  const d=await api('/admin/capabilities');
  const rows=(d?.capabilities||[]).map(c=>`<tr><td>${c.name}</td><td>${c.category||'-'}</td><td>${c.version||'-'}</td><td><span class="badge badge-ok">${c.status||'active'}</span></td></tr>`).join('');
  el.innerHTML=`<h2>能力包</h2><div class="card"><table><thead><tr><th>名称</th><th>分类</th><th>版本</th><th>状态</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="color:var(--muted)">暂无数据</td></tr>'}</tbody></table></div>`;
}

async function loadAudit(el){
  const d=await api('/admin/audit/stats?hours=24');
  if(!d){el.innerHTML='<h2>使用统计</h2><div class="card"><p style="color:var(--muted)">暂无数据</p></div>';return}
  el.innerHTML=`<h2>使用统计（最近24小时）</h2>
  <div class="metrics">
    <div class="metric"><label>总调用</label><strong>${d.total_requests||0}</strong></div>
    <div class="metric"><label>成功</label><strong>${d.ok_count||0}</strong></div>
    <div class="metric"><label>失败</label><strong>${d.error_count||0}</strong></div>
    <div class="metric"><label>平均延迟</label><strong>${d.avg_latency_ms||0}ms</strong></div>
  </div>`;
}

function loadSettings(el){
  el.innerHTML=`<h2>系统设置</h2>
  <div class="card"><h3>服务信息</h3><p>端口: 9377</p><p>数据库: ~/.iworkercenter/center.db</p><p>配置: ~/.iworkercenter/settings.json</p></div>
  <div class="card"><h3>IM 网关</h3><p>配置文件: ~/.iworkercenter/im_config.json</p><p>支持: 飞书 / 钉钉 / 企业微信</p></div>`;
}

// Auto-login if token exists
document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
if(token)showApp();
</script>
</body>
</html>
