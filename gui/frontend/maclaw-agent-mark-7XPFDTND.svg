<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MaClaw Agent Mark</title>
  <desc id="desc">A background-free MaClaw agent mark preserving a rounded square frame around an M-shaped intelligence core.</desc>
  <defs>
    <linearGradient id="core" x1="38" y1="40" x2="90" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F8FB"/>
      <stop offset=".25" stop-color="#7CA9BE"/>
      <stop offset=".58" stop-color="#256887"/>
      <stop offset="1" stop-color="#2F7D66"/>
    </linearGradient>
    <linearGradient id="frame" x1="30" y1="30" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C6D83"/>
      <stop offset="1" stop-color="#263F54"/>
    </linearGradient>
    <linearGradient id="core-highlight" x1="42" y1="46" x2="84" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".82"/>
      <stop offset=".5" stop-color="#C5DDE8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#EAF4F7" stop-opacity=".12"/>
    </linearGradient>
    <filter id="core-depth" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.45" flood-color="#07131F" flood-opacity=".46"/>
    </filter>
  </defs>
  <g transform="translate(64 64) scale(1.52) translate(-64 -64)">
    <rect x="30" y="30" width="68" height="68" rx="18" fill="none" stroke="url(#frame)" stroke-width="4.5"/>
    <path d="M43 80V48h9l12 18 12-18h9v32" stroke="#0F2637" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".96"/>
    <path d="M43 80V48h9l12 18 12-18h9v32" stroke="url(#core)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#core-depth)"/>
    <path d="M43 80V48h9l12 18 12-18h9v32" stroke="url(#core-highlight)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity=".68"/>
    <path d="M36 64h10M82 64h10M64 36v10M64 82v10" stroke="#38586E" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="43" cy="48" r="4.8" fill="#8FAEC0"/>
    <circle cx="64" cy="66" r="4.8" fill="#3F9074"/>
    <circle cx="85" cy="48" r="4.8" fill="#8FAEC0"/>
