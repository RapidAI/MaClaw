<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob: https: http:; connect-src 'self' https: http: wss: ws:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:;">
    <title>MaClaw</title>
</head>
<body>
<!-- Sync background colour with the persisted theme BEFORE React mounts.
     Every native shell stays opaque so there is no white flash or transparent
     edge while the React application becomes ready. Keep these values in sync
     with App.css --theme-page-bg. -->
<script>
  try {
    var d = localStorage.getItem('ai_assistant_theme_mode') === 'dark';
    var c;
    if (d) {
      var s = localStorage.getItem('maclaw.ai.darkScheme');
      c = s === 'aurora' ? '#071018'
        : s === 'classic' ? '#0b1220'
        : s === 'ember' ? '#140e0a'
        : s === 'violet' ? '#0e0a18'
        : '#0f141b';
    } else {
      var l = localStorage.getItem('maclaw.ai.lightScheme');
      c = l === 'default' ? '#f4f7fb'
        : l === 'notion' || l === 'stripe' || l === 'vercel' ? '#ffffff'
        : l === 'linear' ? '#fbfbfd'
        : '#f6f8fa';
    }
    document.documentElement.style.backgroundColor = c;
    document.body.style.backgroundColor = c;
  } catch(e) {}
</script>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
