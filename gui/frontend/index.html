<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob: https: http:; connect-src 'self' https: http: wss: ws:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:;">
    <title>MaClaw</title>
</head>
<body>
<!-- Sync background colour with the persisted theme BEFORE React mounts.
     On all platforms, set the theme colour to avoid a flash of white.
     On Windows 10, the React effect will override this to transparent
     (for true CSS border-radius clipping) within milliseconds of mount.
     On Windows 11, DWM handles rounding natively so the theme colour stays.
     Keep colour values in sync with App.css --theme-page-bg. -->
<script>
  try {
    var d = localStorage.getItem('ai_assistant_theme_mode') === 'dark';
    var c = d ? '#0b1220' : '#f4f5f7';
    document.documentElement.style.backgroundColor = c;
    document.body.style.backgroundColor = c;
  } catch(e) {}
</script>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
