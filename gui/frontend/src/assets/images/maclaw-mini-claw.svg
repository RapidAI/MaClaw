<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pet-eye, .pet-eye-line { transform-box: fill-box; transform-origin: center; animation: pet-eye-blink 4.6s ease-in-out infinite; }
    .pet-mouth { transform-box: fill-box; transform-origin: center; animation: pet-mouth-live 2.4s ease-in-out infinite; }
    .pet-antenna { transform-box: fill-box; transform-origin: 50% 100%; animation: pet-antenna-live 3.8s ease-in-out infinite; }
    @keyframes pet-eye-blink { 0%, 88%, 100% { transform: scaleY(1); } 92%, 95% { transform: scaleY(.18); } }
    @keyframes pet-mouth-live { 0%, 100% { transform: scaleY(.86) translateY(0); } 45% { transform: scaleY(1.18) translateY(1px); } }
    @keyframes pet-antenna-live { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }
  </style>
  <rect width="240" height="240" rx="56" fill="#F5F8FF"/>
  <circle cx="120" cy="122" r="76" fill="#EAF2FF" stroke="#B9D1FF" stroke-width="6"/>
