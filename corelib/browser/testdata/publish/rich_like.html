<!doctype html><html><head><meta charset="utf-8"><title>写文章 (rich fixture)</title>
<!-- Zhihu-like rich editor: textarea title, contenteditable body that takes
     pasted HTML (keeps h2/h3/strong/em/ul/ol/li/p/blockquote, drops the rest)
     and pasted image files (inserted at the caret as <img>). Query flags:
     ?plainpaste=1 drops all formatting; ?imgtop=1 puts every image at the top; ?hang=1 freezes the page for 25s on publish; ?stickyquote=1 pulls everything after a pasted quote into it; ?toolong=1 refuses publish with a length error; ?busypost=1 lands on a post page whose JS is busy for 9s; ?lazypost=1 publishes pictures as lazy placeholders (data: src, real URL in data-actualsrc); ?slowupload=1 stores the n-th picture only after 6s*n; ?noupload=1 never stores pasted pictures (they keep a data: source). -->
<style>.public-DraftEditor-content{min-height:300px;width:690px;border:1px solid #ccc} img{width:200px}</style></head><body>
<div class="WriteIndex-titleInput"><textarea class="Input" placeholder="请输入标题（最多 100 个字）"></textarea></div>
<div class="DraftEditor-editorContainer"><div class="notranslate public-DraftEditor-content" contenteditable="true" role="textbox"></div></div>
<button class="Button Button--primary" id="pub">发布</button>
<script>
const q = new URLSearchParams(location.search);
const ed = document.querySelector('.public-DraftEditor-content');
const keep = new Set(['P','H2','H3','H4','STRONG','B','EM','UL','OL','LI','BLOCKQUOTE','BR','A']);
function clean(node) { for (const c of [...node.childNodes]) { if (c.nodeType === 1) { clean(c); if (!keep.has(c.tagName) || q.get('plainpaste')) { c.replaceWith(...c.childNodes); } } } }
function atCaret(frag) { const s = getSelection(); if (!s.rangeCount || !ed.contains(s.anchorNode)) { ed.appendChild(frag); return; } const r = s.getRangeAt(0); r.deleteContents(); const last = frag.lastChild; r.insertNode(frag); if (last) { r.setStartAfter(last); r.collapse(true); s.removeAllRanges(); s.addRange(r); } }
ed.addEventListener('paste', e => {
  e.preventDefault();
  const fs = [...(e.clipboardData.files || [])];
  if (fs.length) {
    for (const f of fs) { const rd = new FileReader(); const i = document.createElement('img'); i.width = 200; rd.onload = () => { i.src = rd.result; if (!q.get('noupload')) setTimeout(() => { i.src = location.origin + '/img/' + Math.random(); }, q.get('slowupload') ? 6000 * (++window.__up || (window.__up = 1)) : 800); }; rd.readAsDataURL(f);
      if (q.get('imgtop')) ed.insertBefore(i, ed.firstChild); else { const f2 = document.createDocumentFragment(); f2.appendChild(i); atCaret(f2); } }
    return;
  }
  const h = e.clipboardData.getData('text/html'); const t = document.createElement('template');
  if (h) { t.innerHTML = h; clean(t.content); if (q.get('stickyquote')) { const bq = t.content.querySelector('blockquote'); if (bq) { let x = bq.nextSibling; while (x) { const nx = x.nextSibling; bq.appendChild(x); x = nx; } } } } else { t.content.appendChild(document.createTextNode(e.clipboardData.getData('text/plain'))); }
  atCaret(t.content);
});
if (q.get('toolong')) document.getElementById('pub').addEventListener('click', ev => { ev.stopImmediatePropagation(); if (!document.getElementById('tl')) { const d = document.createElement('div'); d.id = 'tl'; d.textContent = '正文超出字数限制'; document.body.appendChild(d); } }, true);
if (q.get('hang')) document.getElementById('pub').addEventListener('click', () => { const t = Date.now(); while (Date.now() - t < 25000) {} });
document.getElementById('pub').addEventListener('click', async ev => {
  if (!ev.isTrusted) return;
  const t = document.querySelector('textarea').value;
  const r = await fetch('/publish', {method: 'POST', body: JSON.stringify({title: t, body: ed.innerText, html: q.get('lazypost') ? ed.innerHTML.replace(/<img([^>]*?) src="([^"]*)"/g, '<img$1 src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-actualsrc="$2"') : ed.innerHTML})});
  location.href = (await r.text()) + (q.get('busypost') ? '?busy=1' : '');
});
</script></body></html>
