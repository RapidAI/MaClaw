<!doctype html><html><head><meta charset="utf-8"><title>写文章 - 知乎 (fixture)</title>
<!-- Structure captured read-only from zhuanlan.zhihu.com/write on 2026-10-23:
     textarea title (placeholder 请输入标题（最多 100 个字）), Draft.js body
     div.public-DraftEditor-content[contenteditable], decoy 发布设置 buttons,
     button.Button--primary 发布. -->
<style>.public-DraftEditor-content{min-height:300px;width:690px;border:1px solid #ccc}</style></head><body>
<div class="WriteIndex-titleInput"><textarea class="Input" placeholder="请输入标题（最多 100 个字）"></textarea></div>
<div class="DraftEditor-editorContainer"><div class="notranslate public-DraftEditor-content" contenteditable="true" role="textbox"></div></div>
<button class="css-9dyic7">发布设置</button><div class="RadioButtonSet-label">发布到专栏</div>
<button class="Button Button--primary" id="pub">发布</button>
<script>
const ed = document.querySelector('.public-DraftEditor-content');
// Draft.js keeps its own model: DOM writes that bypass input events are lost.
let model = ''; ed.addEventListener('input', () => { model = ed.innerText; if (!location.pathname.endsWith('/p/123/edit')) history.replaceState(null, '', '/p/123/edit'); });
// Autosave moves the URL into a draft editor; that is not a publish.
document.getElementById('pub').addEventListener('click', ev => {
  if (!ev.isTrusted || document.getElementById('dlg')) return;
  // The first click opens a panel whose own 发布 does the publish.
  const d = document.createElement('div'); d.id = 'dlg'; d.innerHTML = '<div>发布设置</div><button class="Button Button--primary" id="pub2">发布</button>';
  document.body.appendChild(d);
  document.getElementById('pub2').addEventListener('click', go);
});
async function go(ev) {
  if (!ev.isTrusted) return;
  const t = document.querySelector('textarea').value;
  if (!t || !model.trim()) { alert('empty'); return; }
  const r = await fetch('/publish', {method: 'POST', body: JSON.stringify({title: t, body: model})});
  location.href = await r.text();
}
document.querySelector('.public-DraftEditor-content').addEventListener('paste', e => {
  const fs = [...(e.clipboardData && e.clipboardData.files || [])];
  if (!fs.length) return;
  e.preventDefault();
  for (const f of fs) { const i = document.createElement('img'); i.src = URL.createObjectURL(f); e.currentTarget.appendChild(i); }
});
</script></body></html>
