name: Release Build

on:
  push:
    tags:
      - '[Vv]*'
  workflow_dispatch:
    inputs:
      BRAND:
        description: 'Brand to build: empty = all (maclaw + tigerclaw), "maclaw" = maclaw only, "qianxin" = tigerclaw only'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  APP_NAME: MaClaw
  GO_VERSION: '1.25.0'
  NODE_VERSION: '20'
  RELEASE_CHANNEL: stable
  MANIFEST_NAME: latest.json

jobs:
  # ============================================================
  # Verify: pure Go embedding build path compiles and tests pass
  # ============================================================
  verify-noembedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify build compiles (pure Go, no CGO)
        run: |
          echo "=== Verifying pure Go build compiles ==="
          CGO_ENABLED=0 go build ./corelib/embedding/...
          CGO_ENABLED=0 go build ./corelib/memory/...

      - name: Run tests (pure Go, no CGO)
        run: |
          echo "=== Running tests for embedding and memory packages ==="
          CGO_ENABLED=0 go test ./corelib/embedding/... ./corelib/memory/...

  # ============================================================
  # Windows: GUI (amd64/arm64) + TUI + maclaw-tool + NSIS installer
  # ============================================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        brand: ${{ inputs.BRAND == 'maclaw' && fromJSON('[""]') || inputs.BRAND == 'qianxin' && fromJSON('["qianxin"]') || fromJSON('["", "qianxin"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute brand variables
        shell: pwsh
        run: |
          $brand = "${{ matrix.brand }}"
          if ($brand -ne "") {
            # Brand display name mapping
            $displayNames = @{ "qianxin" = "TigerClaw" }
            $icoNames = @{ "qianxin" = "tigerclaw" }
            $displayName = if ($displayNames.ContainsKey($brand)) { $displayNames[$brand] } else { $brand }
            $icoName = if ($icoNames.ContainsKey($brand)) { $icoNames[$brand] } else { $brand }
            echo "BRAND_TAG=oem_${brand}" >> $env:GITHUB_ENV
            echo "BRAND_ICON_ICO=assets/${icoName}.ico" >> $env:GITHUB_ENV
            echo "BRAND_ICON_PNG=assets/${brand}.png" >> $env:GITHUB_ENV
            echo "BRAND_APP_NAME=${displayName}" >> $env:GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${displayName}" >> $env:GITHUB_ENV
          } else {
            echo "BRAND_TAG=" >> $env:GITHUB_ENV
            echo "BRAND_ICON_ICO=build/windows/icon.ico" >> $env:GITHUB_ENV
            echo "BRAND_ICON_PNG=build/appicon.png" >> $env:GITHUB_ENV
            echo "BRAND_APP_NAME=$env:APP_NAME" >> $env:GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=$env:APP_NAME" >> $env:GITHUB_ENV
          }

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Check source encoding
        run: npm run check:encoding

      - name: Extract version (prefer git tag, fallback to wails.json)
        shell: pwsh
        run: |
          # Prefer git tag as the authoritative version source
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^[Vv](\d+\.\d+\.\d+(\.\d+)?)') {
            $version = $Matches[1]
            echo "VERSION=$version" >> $env:GITHUB_ENV
            echo "Version from git tag: $version"
          } else {
            $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
            $version = $cfg.info.productVersion
            echo "VERSION=$version" >> $env:GITHUB_ENV
            echo "Version from wails.json: $version"
          }
          # Sync version.ts so frontend version matches backend
          $parts = $version.Split('.')
          $buildNum = if ($parts.Length -ge 4) { $parts[3] } else { '0' }
          $content = "export const buildNumber = '${buildNum}';`nexport const appVersion = '${version}';"
          Set-Content -Path 'gui/frontend/src/version.ts' -Value $content -Encoding Utf8

      - name: Build frontend
        shell: pwsh
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Install goversioninfo
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate ICO from PNG if needed
        shell: pwsh
        run: |
          $ico = $env:BRAND_ICON_ICO
          if ($ico -and -not (Test-Path $ico)) {
            $png = $ico -replace '\.ico$', '.png'
            if (-not (Test-Path $png)) {
              Write-Error "Neither $ico nor $png found"; exit 1
            }
            Write-Host "Converting $png -> $ico (multi-size)"
            Add-Type -AssemblyName System.Drawing
            $src = [System.Drawing.Bitmap]::FromFile((Resolve-Path $png))
            # Build ICO binary: header + directory entries + PNG data for each size
            $sizes = @(256, 128, 64, 48, 32, 16)
            $ms = New-Object System.IO.MemoryStream
            $bw = New-Object System.IO.BinaryWriter($ms)
            # ICO header: reserved(2) + type=1(2) + count(2)
            $bw.Write([uint16]0); $bw.Write([uint16]1); $bw.Write([uint16]$sizes.Count)
            # Collect PNG data first to calculate offsets
            $pngDataList = @()
            foreach ($sz in $sizes) {
              $resized = New-Object System.Drawing.Bitmap($src, $sz, $sz)
              $pngMs = New-Object System.IO.MemoryStream
              $resized.Save($pngMs, [System.Drawing.Imaging.ImageFormat]::Png)
              $pngDataList += ,($pngMs.ToArray())
              $pngMs.Dispose(); $resized.Dispose()
            }
            # Directory entries offset starts after header(6) + entries(16 * count)
            $dataOffset = 6 + 16 * $sizes.Count
            for ($i = 0; $i -lt $sizes.Count; $i++) {
              $sz = $sizes[$i]; $data = $pngDataList[$i]
              $bw.Write([byte]$(if ($sz -ge 256) { 0 } else { $sz }))  # width
              $bw.Write([byte]$(if ($sz -ge 256) { 0 } else { $sz }))  # height
              $bw.Write([byte]0)       # color palette
              $bw.Write([byte]0)       # reserved
              $bw.Write([uint16]1)     # color planes
              $bw.Write([uint16]32)    # bits per pixel
              $bw.Write([uint32]$data.Length)  # image data size
              $bw.Write([uint32]$dataOffset)   # offset
              $dataOffset += $data.Length
            }
            # Write PNG data
            foreach ($data in $pngDataList) { $bw.Write($data) }
            [System.IO.File]::WriteAllBytes($ico, $ms.ToArray())
            $bw.Dispose(); $ms.Dispose(); $src.Dispose()
            Write-Host "Created $ico with sizes: $($sizes -join ', ')"
          }

      - name: Install MinGW-w64 for CGO
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Generate Windows resources & build GUI
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          # Prepare manifest
          $manifest = Get-Content build/windows/wails.exe.manifest -Raw
          $manifest = $manifest.Replace('{{.Name}}', $cfg.name).Replace('{{.Info.ProductVersion}}', $env:VERSION)
          [System.IO.File]::WriteAllText("build/windows/wails.exe.manifest.tmp", $manifest, [System.Text.UTF8Encoding]::new($false))
          # Prepare versioninfo.json
          $parts = $env:VERSION.Split('.')
          $versionInfo = @{
            FixedFileInfo = @{
              FileVersion    = @{ Major=[int]$parts[0]; Minor=[int]$parts[1]; Patch=[int]$parts[2]; Build=[int]$parts[3] }
              ProductVersion = @{ Major=[int]$parts[0]; Minor=[int]$parts[1]; Patch=[int]$parts[2]; Build=[int]$parts[3] }
            }
            StringFileInfo = @{
              CompanyName     = $cfg.info.companyName
              FileDescription = $cfg.info.productName
              FileVersion     = $env:VERSION
              ProductName     = $cfg.info.productName
              ProductVersion  = $env:VERSION
              LegalCopyright  = $cfg.info.copyright
            }
            VarFileInfo = @{ Translation = @{ LangID='0409'; CharsetID='04B0' } }
          } | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("build/windows/versioninfo.json.tmp", $versionInfo, [System.Text.UTF8Encoding]::new($false))

          $goversioninfo = Join-Path (go env GOPATH) "bin/goversioninfo.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Determine build tags
          $guiTagsBase = "desktop,production"
          if ($env:BRAND_TAG -ne "") { $guiTagsBase = "$guiTagsBase,$($env:BRAND_TAG)" }
          $outName = $env:BRAND_APP_NAME

          # --- amd64 (CGO enabled for Wails WebView) ---
          & $goversioninfo -64 -icon $env:BRAND_ICON_ICO -manifest build/windows/wails.exe.manifest.tmp -o gui/resource_windows_amd64.syso build/windows/versioninfo.json.tmp
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='1'
          $env:CC='gcc'
          go build -tags $guiTagsBase -ldflags "-s -w -H windowsgui -X main.version=$env:VERSION" -o "dist/${outName}_amd64.exe" ./gui/
          Remove-Item gui/resource_windows_amd64.syso -ErrorAction SilentlyContinue

          # --- arm64 (no CGO, NoopEmbedder — cross-compile CGO not supported) ---
          & $goversioninfo -64 -arm -icon $env:BRAND_ICON_ICO -manifest build/windows/wails.exe.manifest.tmp -o gui/resource_windows_arm64.syso build/windows/versioninfo.json.tmp
          $env:GOARCH='arm64'; $env:CGO_ENABLED='0'
          go build -tags $guiTagsBase -ldflags "-s -w -H windowsgui -X main.version=$env:VERSION" -o "dist/${outName}_arm64.exe" ./gui/
          Remove-Item gui/resource_windows_arm64.syso -ErrorAction SilentlyContinue

          Remove-Item build/windows/wails.exe.manifest.tmp, build/windows/versioninfo.json.tmp

      - name: Build TUI & maclaw-tool & maclaw-cli
        shell: pwsh
        run: |
          $ldflags = "-s -w -X main.version=$env:VERSION"
          $tuiTags = ""
          if ($env:BRAND_TAG -ne "") { $tuiTags = $env:BRAND_TAG }
          $outPrefix = $env:BRAND_APP_NAME.ToLower()
          foreach ($arch in @('amd64','arm64')) {
            $env:GOOS='windows'; $env:GOARCH=$arch; $env:CGO_ENABLED='0'
            if ($tuiTags -ne "") {
              go build -tags $tuiTags -ldflags $ldflags -o "dist/${outPrefix}-tui_${arch}.exe" ./tui/
              go build -tags $tuiTags -ldflags $ldflags -o "dist/${outPrefix}-tool_${arch}.exe" ./cmd/maclaw-tool/
              go build -tags $tuiTags -ldflags $ldflags -o "dist/${outPrefix}-cli_${arch}.exe" ./maclaw-cli/
            } else {
              go build -ldflags $ldflags -o "dist/maclaw-tui_${arch}.exe" ./tui/
              go build -ldflags $ldflags -o "dist/maclaw-tool_${arch}.exe" ./cmd/maclaw-tool/
              go build -ldflags $ldflags -o "dist/maclaw-cli_${arch}.exe" ./maclaw-cli/
            }
          }

      - name: Build maclawsrv, datasrv & srvdemo (default brand only)
        if: matrix.brand == ''
        shell: pwsh
        run: |
          $commit = git rev-parse --short HEAD
          $builtAt = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          $srvLdflags = "-s -w -X main.serviceVersion=$env:VERSION -X main.serviceCommit=$commit -X main.serviceBuiltAt=$builtAt"
          $dataSrvLdflags = "-s -w -X main.serviceVersion=$env:VERSION"
          # maclawsrv: pure Go server, CGO_ENABLED=0, cross-compile all arches
          foreach ($arch in @('amd64','arm64')) {
            $env:GOOS='windows'; $env:GOARCH=$arch; $env:CGO_ENABLED='0'
            go build -ldflags $srvLdflags -o "dist/maclawsrv_${arch}.exe" ./MaClawSrv/
            # datasrv is a separate Go module under datasrv/, build from that directory
            Push-Location datasrv
            go build -ldflags $dataSrvLdflags -o "../dist/maclaw-data-srv_${arch}.exe" ./cmd/maclaw-data-srv/
            Pop-Location
          }
          # srvdemo: Wails GUI app (pre-committed frontend, no npm build needed)
          # amd64 with CGO (native WebView)
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='1'; $env:CC='gcc'
          go build -tags "desktop,production" -ldflags "-s -w -H windowsgui" -o "dist/srvdemo_amd64.exe" ./srvdemo/
          # arm64 without CGO (cross-compile, NoopEmbedder)
          $env:GOARCH='arm64'; $env:CGO_ENABLED='0'
          go build -tags "desktop,production" -ldflags "-s -w -H windowsgui" -o "dist/srvdemo_arm64.exe" ./srvdemo/

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Refresh PATH so makensis is discoverable
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          # Verify installation and locate makensis
          $nsisPath = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsisPath) {
            # Fallback: search common locations
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              (Join-Path $env:ChocolateyInstall "bin\makensis.exe")
            )
            $nsisPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $nsisPath) { Write-Error "NSIS makensis.exe not found after install"; exit 1 }
          Write-Host "NSIS found at: $nsisPath"
          echo "NSIS_PATH=$nsisPath" >> $env:GITHUB_ENV

      - name: Create NSIS installer
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $nsis = $env:NSIS_PATH
          $root = (Get-Location).Path
          $outName = $env:BRAND_APP_NAME
          $cliPrefix = $env:BRAND_APP_NAME.ToLower()
          & $nsis /DINFO_PROJECTNAME="${outName}" `
                  /DPRODUCT_EXECUTABLE="${outName}.exe" `
                  /DINFO_PRODUCTNAME="$($env:BRAND_DISPLAY_NAME)" `
                  /DINFO_COMPANYNAME="$($cfg.info.companyName)" `
                  /DINFO_COPYRIGHT="$($cfg.info.copyright)" `
                  /DINFO_PRODUCTVERSION="$env:VERSION" `
                  /DARG_WAILS_AMD64_BINARY="$root\dist\${outName}_amd64.exe" `
                  /DARG_WAILS_ARM64_BINARY="$root\dist\${outName}_arm64.exe" `
                  /DARG_MACLAWCLI_AMD64_BINARY="$root\dist\${cliPrefix}-cli_amd64.exe" `
                  /DARG_MACLAWCLI_ARM64_BINARY="$root\dist\${cliPrefix}-cli_arm64.exe" `
                  /DMUI_ICON_PATH="$root\$($env:BRAND_ICON_ICO)" `
                  build/windows/installer/multiarch.nsi

      - name: Create DataSrv NSIS installer (default brand only)
        if: matrix.brand == ''
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $nsis = $env:NSIS_PATH
          $root = (Get-Location).Path
          & $nsis /DINFO_PRODUCTNAME="MaClaw Data Service" `
                  /DINFO_COMPANYNAME="$($cfg.info.companyName)" `
                  /DINFO_COPYRIGHT="$($cfg.info.copyright)" `
                  /DINFO_PRODUCTVERSION="$env:VERSION" `
                  /DPRODUCT_EXECUTABLE="maclaw-data-srv.exe" `
                  /DARG_DATASRV_AMD64_BINARY="$root\dist\maclaw-data-srv_amd64.exe" `
                  /DARG_DATASRV_ARM64_BINARY="$root\dist\maclaw-data-srv_arm64.exe" `
                  build/windows/installer/datasrv.nsi

      - name: Create MaClawSrv NSIS installer (default brand only)
        if: matrix.brand == ''
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $nsis = $env:NSIS_PATH
          $root = (Get-Location).Path
          & $nsis /DINFO_PRODUCTNAME="MaClaw Service" `
                  /DINFO_COMPANYNAME="$($cfg.info.companyName)" `
                  /DINFO_COPYRIGHT="$($cfg.info.copyright)" `
                  /DINFO_PRODUCTVERSION="$env:VERSION" `
                  /DPRODUCT_EXECUTABLE="maclawsrv.exe" `
                  /DARG_MACLAWSRV_AMD64_BINARY="$root\dist\maclawsrv_amd64.exe" `
                  /DARG_MACLAWSRV_ARM64_BINARY="$root\dist\maclawsrv_arm64.exe" `
                  build/windows/installer/maclawsrv.nsi

      - name: Create portable zip
        shell: pwsh
        run: |
          $outName = $env:BRAND_APP_NAME
          $outPrefix = $env:BRAND_APP_NAME.ToLower()
          Copy-Item "dist/${outName}_amd64.exe" "dist/${outName}.exe"
          if ($env:BRAND_TAG -ne "") {
            Copy-Item "dist/${outPrefix}-tui_amd64.exe" "dist/${outPrefix}-tui.exe"
            Copy-Item "dist/${outPrefix}-tool_amd64.exe" "dist/${outPrefix}-tool.exe"
            Copy-Item "dist/${outPrefix}-cli_amd64.exe" "dist/${outPrefix}-cli.exe"
            Compress-Archive -Path "dist/${outName}.exe","dist/${outPrefix}-tui.exe","dist/${outPrefix}-tool.exe","dist/${outPrefix}-cli.exe" `
              -DestinationPath "dist/${outName}-Windows-Portable.zip" -Force
          } else {
            Copy-Item "dist/maclaw-tui_amd64.exe" "dist/maclaw-tui.exe"
            Copy-Item "dist/maclaw-tool_amd64.exe" "dist/maclaw-tool.exe"
            Copy-Item "dist/maclaw-cli_amd64.exe" "dist/maclaw-cli.exe"
            Compress-Archive -Path "dist/${outName}.exe","dist/maclaw-tui.exe","dist/maclaw-tool.exe","dist/maclaw-cli.exe" `
              -DestinationPath "dist/${outName}-Windows-Portable.zip" -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts-${{ matrix.brand || 'default' }}
          path: |
            dist/${{ env.BRAND_APP_NAME }}-Setup.exe
            dist/${{ env.BRAND_APP_NAME }}-Windows-Portable.zip
            dist/${{ env.BRAND_APP_NAME }}_amd64.exe
            dist/${{ env.BRAND_APP_NAME }}_arm64.exe
            dist/*-tui_amd64.exe
            dist/*-tui_arm64.exe
            dist/*-tool_amd64.exe
            dist/*-tool_arm64.exe
            dist/*-cli_amd64.exe
            dist/*-cli_arm64.exe
            dist/maclaw-tui_amd64.exe
            dist/maclaw-tui_arm64.exe
            dist/maclaw-tool_amd64.exe
            dist/maclaw-tool_arm64.exe
            dist/maclaw-cli_amd64.exe
            dist/maclaw-cli_arm64.exe
            dist/maclawsrv-Setup.exe
            dist/maclawsrv_amd64.exe
            dist/maclawsrv_arm64.exe
            dist/maclaw-data-srv-Setup.exe
            dist/maclaw-data-srv_amd64.exe
            dist/maclaw-data-srv_arm64.exe
            dist/srvdemo_amd64.exe
            dist/srvdemo_arm64.exe



  # ============================================================
  # Ins-maclaw: small native bootstrap installer for all platforms
  # ============================================================
  build-ins-maclaw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install goversioninfo
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Sync Ins-maclaw assets
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./Ins-maclaw/sync-assets.ps1

      - name: Test Ins-maclaw bootstrap app
        shell: pwsh
        run: go test ./Ins-maclaw -count=1

      - name: Vet Ins-maclaw bootstrap app
        shell: pwsh
        run: go vet ./Ins-maclaw

      - name: Build Ins-maclaw bootstrap installers
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./Ins-maclaw/build.ps1

      - name: Upload Ins-maclaw bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ins-maclaw-artifacts
          if-no-files-found: error
          path: dist/Ins-maclaw/*

  # ============================================================
  # macOS: GUI universal binary + PKG + TUI/tool (darwin)
  # ============================================================
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        brand: ${{ inputs.BRAND == 'maclaw' && fromJSON('[""]') || inputs.BRAND == 'qianxin' && fromJSON('["qianxin"]') || fromJSON('["", "qianxin"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute brand variables
        run: |
          BRAND="${{ matrix.brand }}"
          if [ -n "$BRAND" ]; then
            # Brand display name mapping (case instead of declare -A for macOS bash 3.x compat)
            case "$BRAND" in
              qianxin) DISPLAY_NAME="TigerClaw" ;;
              *)       DISPLAY_NAME="$BRAND" ;;
            esac
            echo "BRAND_TAG=oem_${BRAND}" >> $GITHUB_ENV
            echo "BRAND_ICON_PNG=assets/${BRAND}.png" >> $GITHUB_ENV
            echo "BRAND_APP_NAME=${DISPLAY_NAME}" >> $GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${DISPLAY_NAME}" >> $GITHUB_ENV
          else
            echo "BRAND_TAG=" >> $GITHUB_ENV
            echo "BRAND_ICON_PNG=build/appicon.png" >> $GITHUB_ENV
            echo "BRAND_APP_NAME=${APP_NAME}" >> $GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${APP_NAME}" >> $GITHUB_ENV
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Extract version (prefer git tag, fallback to wails.json)
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[Vv]([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Version from git tag: $VERSION"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('wails.json'))['info']['productVersion'])")
            echo "Version from wails.json: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Sync version.ts so frontend version matches backend
          BUILD_NUM=$(echo "$VERSION" | awk -F. '{print ($4 != "" ? $4 : "0")}')
          printf "export const buildNumber = '%s';\nexport const appVersion = '%s';\n" "$BUILD_NUM" "$VERSION" > gui/frontend/src/version.ts

      - name: Build frontend
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Build macOS GUI binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          mkdir -p dist build/bin
          GUI_TAGS="desktop,production"
          if [ -n "$BRAND_TAG" ]; then GUI_TAGS="${GUI_TAGS},${BRAND_TAG}"; fi
          OUT_NAME="${BRAND_APP_NAME}"
          # amd64
          CGO_ENABLED=1 CGO_LDFLAGS="-weak_framework UniformTypeIdentifiers" \
            GOOS=darwin GOARCH=amd64 \
            go build -tags "${GUI_TAGS}" -ldflags "-X main.version=${VERSION}" -o "build/bin/${OUT_NAME}_amd64" ./gui/
          # arm64
          CGO_ENABLED=1 CGO_LDFLAGS="-weak_framework UniformTypeIdentifiers" \
            GOOS=darwin GOARCH=arm64 \
            go build -tags "${GUI_TAGS}" -ldflags "-X main.version=${VERSION}" -o "build/bin/${OUT_NAME}_arm64" ./gui/

      - name: Build TUI & maclaw-tool & maclaw-cli (darwin)
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          TUI_TAGS=""
          if [ -n "$BRAND_TAG" ]; then TUI_TAGS="$BRAND_TAG"; fi
          OUT_PREFIX=$(echo "$BRAND_APP_NAME" | tr '[:upper:]' '[:lower:]')
          for ARCH in amd64 arm64; do
            if [ -n "$TUI_TAGS" ]; then
              CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
                go build -tags "$TUI_TAGS" -ldflags "$LDFLAGS" -o "dist/${OUT_PREFIX}-tui_${ARCH}_darwin" ./tui/
              CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
                go build -tags "$TUI_TAGS" -ldflags "$LDFLAGS" -o "dist/${OUT_PREFIX}-tool_${ARCH}_darwin" ./cmd/maclaw-tool/
              CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
                go build -tags "$TUI_TAGS" -ldflags "$LDFLAGS" -o "dist/${OUT_PREFIX}-cli_${ARCH}_darwin" ./maclaw-cli/
            else
              CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
                go build -ldflags "$LDFLAGS" -o "dist/maclaw-tui_${ARCH}_darwin" ./tui/
              CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
                go build -ldflags "$LDFLAGS" -o "dist/maclaw-tool_${ARCH}_darwin" ./cmd/maclaw-tool/
              CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
                go build -ldflags "$LDFLAGS" -o "dist/maclaw-cli_${ARCH}_darwin" ./maclaw-cli/
            fi
          done

      - name: Build maclawsrv, datasrv & srvdemo (default brand only, darwin)
        if: matrix.brand == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SRV_LDFLAGS="-s -w -X main.serviceVersion=${VERSION} -X main.serviceCommit=${COMMIT} -X main.serviceBuiltAt=${BUILT_AT}"
          DATA_SRV_LDFLAGS="-s -w -X main.serviceVersion=${VERSION}"
          # maclawsrv: pure Go server, CGO_ENABLED=0
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
              go build -ldflags "$SRV_LDFLAGS" -o "dist/maclawsrv_${ARCH}_darwin" ./MaClawSrv/
            # datasrv is a separate Go module under datasrv/, build from that directory
            (cd datasrv && CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH \
              go build -ldflags "$DATA_SRV_LDFLAGS" -o "../dist/maclaw-data-srv_${ARCH}_darwin" ./cmd/maclaw-data-srv/)
          done
          # srvdemo: Wails GUI app (pre-committed frontend)
          for ARCH in amd64 arm64; do
            CGO_ENABLED=1 CGO_LDFLAGS="-weak_framework UniformTypeIdentifiers" \
              GOOS=darwin GOARCH=$ARCH \
              go build -tags "desktop,production" -ldflags "-s -w" -o "dist/srvdemo_${ARCH}_darwin" ./srvdemo/
          done

      - name: Generate .icns
        run: |
          ICON_SRC="${BRAND_ICON_PNG}"
          if [ -f "$ICON_SRC" ]; then
            ICONSET=build/appicon.iconset
            mkdir -p "$ICONSET"
            for sz in 16 32 64 128 256 512 1024; do
              sips -z $sz $sz "$ICON_SRC" --out "$ICONSET/icon_${sz}x${sz}.png" > /dev/null
            done
            # Retina variants
            cp "$ICONSET/icon_32x32.png"   "$ICONSET/icon_16x16@2x.png"
            cp "$ICONSET/icon_64x64.png"   "$ICONSET/icon_32x32@2x.png"
            cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
            cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png"
            cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png"
            rm -f "$ICONSET/icon_64x64.png" "$ICONSET/icon_1024x1024.png"
            iconutil -c icns "$ICONSET" -o build/AppIcon.icns
            cp build/AppIcon.icns build/iconfile.icns
            rm -rf "$ICONSET"
          fi

      - name: Create App Bundles & Universal Binary
        run: |
          IDENTIFIER="com.wails.MaClaw"
          OUT_NAME="${BRAND_APP_NAME}"
          DISPLAY_NAME="${BRAND_DISPLAY_NAME}"
          for ARCH in amd64 arm64; do
            BUNDLE="dist/${OUT_NAME}_${ARCH}.app"
            mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
            cp "build/bin/${OUT_NAME}_${ARCH}" "$BUNDLE/Contents/MacOS/${OUT_NAME}"
            chmod +x "$BUNDLE/Contents/MacOS/${OUT_NAME}"
            [ -f build/AppIcon.icns ] && cp build/AppIcon.icns "$BUNDLE/Contents/Resources/"
            cat > "$BUNDLE/Contents/Info.plist" <<PEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleName</key><string>${DISPLAY_NAME}</string>
            <key>CFBundleExecutable</key><string>${OUT_NAME}</string>
            <key>CFBundleIdentifier</key><string>${IDENTIFIER}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><string>true</string>
            <key>NSDesktopFolderUsageDescription</key><string>${DISPLAY_NAME} needs access to your Desktop folder to manage project files.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>${DISPLAY_NAME} needs access to your Documents folder to manage project files.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>${DISPLAY_NAME} needs access to your Downloads folder to install tools and updates.</string>
            <key>NSLocalNetworkUsageDescription</key><string>${DISPLAY_NAME} uses local network to discover and connect to Hub services.</string>
            <key>NSScreenCaptureUsageDescription</key><string>${DISPLAY_NAME} needs screen recording permission to capture screenshots for remote coding sessions.</string>
          </dict></plist>
          PEOF
            # Strip leading whitespace from plist (heredoc indentation artifact)
            sed -i '' 's/^[[:space:]]*//' "$BUNDLE/Contents/Info.plist"
          done
          # Universal
          UBUNDLE="dist/${OUT_NAME}.app"
          mkdir -p "$UBUNDLE/Contents/MacOS" "$UBUNDLE/Contents/Resources"
          lipo -create "build/bin/${OUT_NAME}_amd64" "build/bin/${OUT_NAME}_arm64" \
            -output "$UBUNDLE/Contents/MacOS/${OUT_NAME}"
          cp "dist/${OUT_NAME}_arm64.app/Contents/Info.plist" "$UBUNDLE/Contents/Info.plist"
          cp -R "dist/${OUT_NAME}_arm64.app/Contents/Resources/" "$UBUNDLE/Contents/Resources/"

      - name: Create PKGs
        run: |
          IDENTIFIER="com.wails.MaClaw"
          OUT_NAME="${BRAND_APP_NAME}"
          for ARCH in amd64 arm64 universal; do
            if [ "$ARCH" = "universal" ]; then
              BUNDLE="dist/${OUT_NAME}.app"
              PKG_NAME="${OUT_NAME}-Universal.pkg"
              SCRIPTS_DIR="build/scripts_universal"
            else
              BUNDLE="dist/${OUT_NAME}_${ARCH}.app"
              PKG_NAME="${OUT_NAME}-${ARCH}.pkg"
              [ "$ARCH" = "arm64" ] && SCRIPTS_DIR="build/scripts_arm64" || SCRIPTS_DIR="build/scripts_x64"
            fi
            TEMP_ROOT="build/pkg_root_${ARCH}"
            rm -rf "$TEMP_ROOT"
            mkdir -p "$TEMP_ROOT/Applications"
            cp -R "$BUNDLE" "$TEMP_ROOT/Applications/${OUT_NAME}.app"
            chmod +x "$SCRIPTS_DIR/preinstall" "$SCRIPTS_DIR/postinstall"
            pkgbuild --root "$TEMP_ROOT" --identifier "$IDENTIFIER" --version "$VERSION" \
              --install-location "/" --scripts "$SCRIPTS_DIR" "dist/${PKG_NAME}"
            rm -rf "$TEMP_ROOT"
          done

      - name: Create DataSrv PKGs (default brand only)
        if: matrix.brand == ''
        run: |
          IDENTIFIER="com.rapidai.maclaw.datasrv"
          for ARCH in amd64 arm64 universal; do
            if [ "$ARCH" = "universal" ]; then
              SRC_BINARY="dist/maclaw-data-srv_universal_darwin"
              PKG_NAME="maclaw-data-srv-Universal.pkg"
              if [ ! -f "$SRC_BINARY" ]; then
                lipo -create "dist/maclaw-data-srv_amd64_darwin" "dist/maclaw-data-srv_arm64_darwin" \
                  -output "$SRC_BINARY"
              fi
            else
              SRC_BINARY="dist/maclaw-data-srv_${ARCH}_darwin"
              PKG_NAME="maclaw-data-srv-${ARCH}.pkg"
            fi

            TEMP_ROOT="build/datasrv_pkg_root_${ARCH}"
            rm -rf "$TEMP_ROOT"
            mkdir -p "$TEMP_ROOT/usr/local/bin"
            cp "$SRC_BINARY" "$TEMP_ROOT/usr/local/bin/maclaw-data-srv"
            chmod 755 "$TEMP_ROOT/usr/local/bin/maclaw-data-srv"
            pkgbuild --root "$TEMP_ROOT" --identifier "$IDENTIFIER" --version "$VERSION" \
              --install-location "/" "dist/${PKG_NAME}"
            rm -rf "$TEMP_ROOT"
          done

      - name: Create MaClawSrv PKGs (default brand only)
        if: matrix.brand == ''
        run: |
          IDENTIFIER="com.rapidai.maclaw.srv"
          for ARCH in amd64 arm64 universal; do
            if [ "$ARCH" = "universal" ]; then
              SRC_BINARY="dist/maclawsrv_universal_darwin"
              PKG_NAME="maclawsrv-Universal.pkg"
              if [ ! -f "$SRC_BINARY" ]; then
                lipo -create "dist/maclawsrv_amd64_darwin" "dist/maclawsrv_arm64_darwin" \
                  -output "$SRC_BINARY"
              fi
            else
              SRC_BINARY="dist/maclawsrv_${ARCH}_darwin"
              PKG_NAME="maclawsrv-${ARCH}.pkg"
            fi

            TEMP_ROOT="build/maclawsrv_pkg_root_${ARCH}"
            SCRIPTS_DIR="build/maclawsrv_pkg_scripts_${ARCH}"
            rm -rf "$TEMP_ROOT" "$SCRIPTS_DIR"
            mkdir -p "$TEMP_ROOT/usr/local/bin"
            cp "$SRC_BINARY" "$TEMP_ROOT/usr/local/bin/maclawsrv"
            chmod 755 "$TEMP_ROOT/usr/local/bin/maclawsrv"
            mkdir -p "$SCRIPTS_DIR"
            cat > "$SCRIPTS_DIR/postinstall" <<'EOF'
          #!/bin/sh
          set -e

          LABEL="com.rapidai.maclaw.srv"
          PLIST="/Library/LaunchDaemons/${LABEL}.plist"
          DATA_ROOT="/Library/Application Support/MaClawSrv"
          LOG_DIR="/Library/Logs/MaClawSrv"

          make_secret() {
              BYTES="$1"
              if command -v openssl >/dev/null 2>&1; then
                  openssl rand -hex "$BYTES"
                  return
              fi
              uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]'
          }

          ADMIN_SECRET="$(make_secret 24)"
          TOKEN_SECRET="$(make_secret 32)"
          if [ -f "$PLIST" ]; then
              OLD_ADMIN_SECRET="$(/usr/libexec/PlistBuddy -c 'Print :EnvironmentVariables:MACLAW_ADMIN_SECRET' "$PLIST" 2>/dev/null || true)"
              OLD_TOKEN_SECRET="$(/usr/libexec/PlistBuddy -c 'Print :EnvironmentVariables:MACLAW_TOKEN_SECRET' "$PLIST" 2>/dev/null || true)"
              [ -n "$OLD_ADMIN_SECRET" ] && ADMIN_SECRET="$OLD_ADMIN_SECRET"
              [ -n "$OLD_TOKEN_SECRET" ] && TOKEN_SECRET="$OLD_TOKEN_SECRET"
          fi

          mkdir -p "$DATA_ROOT" "$LOG_DIR"
          chown root:wheel "$DATA_ROOT" "$LOG_DIR"
          chmod 700 "$DATA_ROOT"
          chmod 755 "$LOG_DIR"

          if launchctl print "system/${LABEL}" >/dev/null 2>&1; then
              launchctl bootout system "$PLIST" >/dev/null 2>&1 || true
          fi

          cat > "$PLIST" <<PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>${LABEL}</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/usr/local/bin/maclawsrv</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
              <key>EnvironmentVariables</key>
              <dict>
                  <key>MACLAW_ADMIN_SECRET</key>
                  <string>${ADMIN_SECRET}</string>
                  <key>MACLAW_TOKEN_SECRET</key>
                  <string>${TOKEN_SECRET}</string>
                  <key>MACLAW_DATA_ROOT</key>
                  <string>${DATA_ROOT}</string>
              </dict>
              <key>StandardOutPath</key>
              <string>/Library/Logs/MaClawSrv/maclawsrv.log</string>
              <key>StandardErrorPath</key>
              <string>/Library/Logs/MaClawSrv/maclawsrv.err.log</string>
          </dict>
          </plist>
          PLIST_EOF

          chown root:wheel "$PLIST"
          chmod 600 "$PLIST"
          launchctl bootstrap system "$PLIST"
          launchctl enable "system/${LABEL}"
          launchctl kickstart -k "system/${LABEL}"
          exit 0
          EOF
            sed -i '' 's/^[[:space:]]*//' "$SCRIPTS_DIR/postinstall"
            chmod 755 "$SCRIPTS_DIR/postinstall"
            pkgbuild --root "$TEMP_ROOT" --scripts "$SCRIPTS_DIR" --identifier "$IDENTIFIER" --version "$VERSION" \
              --install-location "/" "dist/${PKG_NAME}"
            rm -rf "$TEMP_ROOT" "$SCRIPTS_DIR"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.brand || 'default' }}
          path: |
            dist/${{ env.BRAND_APP_NAME }}-Universal.pkg
            dist/${{ env.BRAND_APP_NAME }}-amd64.pkg
            dist/${{ env.BRAND_APP_NAME }}-arm64.pkg
            dist/*-tui_amd64_darwin
            dist/*-tui_arm64_darwin
            dist/*-tool_amd64_darwin
            dist/*-tool_arm64_darwin
            dist/*-cli_amd64_darwin
            dist/*-cli_arm64_darwin
            dist/maclaw-tui_amd64_darwin
            dist/maclaw-tui_arm64_darwin
            dist/maclaw-tool_amd64_darwin
            dist/maclaw-tool_arm64_darwin
            dist/maclaw-cli_amd64_darwin
            dist/maclaw-cli_arm64_darwin
            dist/maclawsrv-Universal.pkg
            dist/maclawsrv-amd64.pkg
            dist/maclawsrv-arm64.pkg
            dist/maclawsrv_amd64_darwin
            dist/maclawsrv_arm64_darwin
            dist/maclaw-data-srv-Universal.pkg
            dist/maclaw-data-srv-amd64.pkg
            dist/maclaw-data-srv-arm64.pkg
            dist/maclaw-data-srv_amd64_darwin
            dist/maclaw-data-srv_arm64_darwin
            dist/srvdemo_amd64_darwin
            dist/srvdemo_arm64_darwin


  # ============================================================
  # Linux: GUI (amd64, CGO native) + TUI/tool + AppImage
  # Build on multiple Ubuntu versions to produce binaries for:
  #   - Ubuntu 22.04 (webkit2gtk-4.0)
  #   - Ubuntu 24.04 (webkit2gtk-4.1)
  #   - Ubuntu 26.04 (webkit2gtk-4.1, same binary as 24.04)
  # When ubuntu-26.04 runner becomes available, add it to the
  # os_version matrix to build natively on that platform.
  # ============================================================
  build-linux:
    strategy:
      matrix:
        brand: ${{ inputs.BRAND == 'maclaw' && fromJSON('[""]') || inputs.BRAND == 'qianxin' && fromJSON('["qianxin"]') || fromJSON('["", "qianxin"]') }}
        os_version: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute brand variables
        run: |
          BRAND="${{ matrix.brand }}"
          if [ -n "$BRAND" ]; then
            case "$BRAND" in
              qianxin) DISPLAY_NAME="TigerClaw" ;;
              *)       DISPLAY_NAME="$BRAND" ;;
            esac
            echo "BRAND_TAG=oem_${BRAND}" >> $GITHUB_ENV
            echo "BRAND_ICON_PNG=assets/${BRAND}.png" >> $GITHUB_ENV
            echo "BRAND_APP_NAME=${DISPLAY_NAME}" >> $GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${DISPLAY_NAME}" >> $GITHUB_ENV
          else
            echo "BRAND_TAG=" >> $GITHUB_ENV
            echo "BRAND_ICON_PNG=build/appicon.png" >> $GITHUB_ENV
            echo "BRAND_APP_NAME=${APP_NAME}" >> $GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${APP_NAME}" >> $GITHUB_ENV
          fi

      - name: Compute OS suffix for artifact naming
        run: |
          # Extract Ubuntu version number (e.g. "22.04" from "ubuntu-22.04")
          OS_VER="${{ matrix.os_version }}"
          UBUNTU_VER="${OS_VER#ubuntu-}"
          # Short label for filenames: "u2204", "u2404", etc.
          UBUNTU_LABEL="u${UBUNTU_VER/./}"
          echo "UBUNTU_VER=${UBUNTU_VER}" >> $GITHUB_ENV
          echo "UBUNTU_LABEL=${UBUNTU_LABEL}" >> $GITHUB_ENV
          # Only build TUI/tool/maclawsrv on the newest runner (avoid duplicate pure-Go artifacts)
          if [ "${{ matrix.os_version }}" = "ubuntu-24.04" ]; then
            echo "BUILD_PURE_GO=true" >> $GITHUB_ENV
          else
            echo "BUILD_PURE_GO=false" >> $GITHUB_ENV
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          # Try 4.0 first (Ubuntu 22.04), fall back to 4.1 (Ubuntu 24.04/26.04)
          if sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev 2>/dev/null; then
            TAGS="desktop,production"
            echo "WEBKIT_API=4.0" >> $GITHUB_ENV
            echo "WEBKIT_SONAME=libwebkit2gtk-4.0.so.37" >> $GITHUB_ENV
            echo "WEBKIT_PKG=libwebkit2gtk-4.0-37" >> $GITHUB_ENV
          else
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
            TAGS="desktop,production,webkit2_41"
            echo "WEBKIT_API=4.1" >> $GITHUB_ENV
            echo "WEBKIT_SONAME=libwebkit2gtk-4.1.so.0" >> $GITHUB_ENV
            echo "WEBKIT_PKG=libwebkit2gtk-4.1-0" >> $GITHUB_ENV
          fi
          if [ -n "$BRAND_TAG" ]; then TAGS="${TAGS},${BRAND_TAG}"; fi
          echo "WEBKIT_TAGS=${TAGS}" >> $GITHUB_ENV

      - name: Extract version (prefer git tag, fallback to wails.json)
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[Vv]([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Version from git tag: $VERSION"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('wails.json'))['info']['productVersion'])")
            echo "Version from wails.json: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Sync version.ts so frontend version matches backend
          BUILD_NUM=$(echo "$VERSION" | awk -F. '{print ($4 != "" ? $4 : "0")}')
          printf "export const buildNumber = '%s';\nexport const appVersion = '%s';\n" "$BUILD_NUM" "$VERSION" > gui/frontend/src/version.ts

      - name: Build frontend
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Build Linux GUI (amd64)
        run: |
          mkdir -p dist build/bin
          OUT_NAME="${BRAND_APP_NAME}"
          # Include Ubuntu label in binary name so both versions coexist in artifacts
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -tags "${WEBKIT_TAGS}" -ldflags "-X main.version=${VERSION}" \
            -o "build/bin/${OUT_NAME}_amd64_linux_${UBUNTU_LABEL}" ./gui/
          # Also copy to the generic name for AppImage packaging
          cp "build/bin/${OUT_NAME}_amd64_linux_${UBUNTU_LABEL}" "build/bin/${OUT_NAME}_amd64_linux"

      - name: Build TUI & maclaw-tool & maclaw-cli (linux, pure Go — only on newest runner)
        if: env.BUILD_PURE_GO == 'true'
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          TUI_TAGS=""
          if [ -n "$BRAND_TAG" ]; then TUI_TAGS="$BRAND_TAG"; fi
          OUT_PREFIX=$(echo "$BRAND_APP_NAME" | tr '[:upper:]' '[:lower:]')
          for ARCH in amd64 arm64; do
            if [ -n "$TUI_TAGS" ]; then
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
                go build -tags "$TUI_TAGS" -ldflags "$LDFLAGS" -o "dist/${OUT_PREFIX}-tui_${ARCH}_linux" ./tui/
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
                go build -tags "$TUI_TAGS" -ldflags "$LDFLAGS" -o "dist/${OUT_PREFIX}-tool_${ARCH}_linux" ./cmd/maclaw-tool/
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
                go build -tags "$TUI_TAGS" -ldflags "$LDFLAGS" -o "dist/${OUT_PREFIX}-cli_${ARCH}_linux" ./maclaw-cli/
            else
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
                go build -ldflags "$LDFLAGS" -o "dist/maclaw-tui_${ARCH}_linux" ./tui/
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
                go build -ldflags "$LDFLAGS" -o "dist/maclaw-tool_${ARCH}_linux" ./cmd/maclaw-tool/
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
                go build -ldflags "$LDFLAGS" -o "dist/maclaw-cli_${ARCH}_linux" ./maclaw-cli/
            fi
          done

      - name: Build maclawsrv, datasrv & srvdemo (default brand, newest runner only)
        if: matrix.brand == '' && env.BUILD_PURE_GO == 'true'
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SRV_LDFLAGS="-s -w -X main.serviceVersion=${VERSION} -X main.serviceCommit=${COMMIT} -X main.serviceBuiltAt=${BUILT_AT}"
          DATA_SRV_LDFLAGS="-s -w -X main.serviceVersion=${VERSION}"
          # maclawsrv: pure Go server, CGO_ENABLED=0
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
              go build -ldflags "$SRV_LDFLAGS" -o "dist/maclawsrv_${ARCH}_linux" ./MaClawSrv/
            # datasrv is a separate Go module under datasrv/, build from that directory
            (cd datasrv && CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
              go build -ldflags "$DATA_SRV_LDFLAGS" -o "../dist/maclaw-data-srv_${ARCH}_linux" ./cmd/maclaw-data-srv/)
          done
          # srvdemo: Wails GUI app (pre-committed frontend), needs CGO for WebView
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -tags "${WEBKIT_TAGS}" -ldflags "-s -w" -o "dist/srvdemo_amd64_linux" ./srvdemo/

      - name: Create AppImage (amd64)
        run: |
          OUT_NAME="${BRAND_APP_NAME}"
          OUT_LOWER=$(echo "$OUT_NAME" | tr '[:upper:]' '[:lower:]')
          # AppImage name includes Ubuntu label so both versions are released
          APPIMAGE_NAME="${OUT_NAME}-x86_64-${UBUNTU_LABEL}.AppImage"
          # Prepare AppDir
          APP_DIR="build/linux/AppDir_amd64"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin"
          mkdir -p "$APP_DIR/usr/share/icons/hicolor/512x512/apps"
          cp "build/bin/${OUT_NAME}_amd64_linux" "$APP_DIR/usr/bin/${OUT_LOWER}"
          cp "${BRAND_ICON_PNG}" "$APP_DIR/${OUT_LOWER}.png"
          cp "${BRAND_ICON_PNG}" "$APP_DIR/.DirIcon"
          cp "${BRAND_ICON_PNG}" "$APP_DIR/usr/share/icons/hicolor/512x512/apps/${OUT_LOWER}.png"

          # Desktop file (no leading spaces allowed)
          cat > "$APP_DIR/${OUT_LOWER}.desktop" << DEOF
          [Desktop Entry]
          Name=${BRAND_DISPLAY_NAME}
          Exec=${OUT_LOWER}
          Icon=${OUT_LOWER}
          Type=Application
          Categories=Development;
          DEOF
          sed -i 's/^[[:space:]]*//' "$APP_DIR/${OUT_LOWER}.desktop"

          # AppRun (shebang must be at column 0)
          cat > "$APP_DIR/AppRun" << REOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export PATH="\${HERE}/usr/bin:\${PATH}"

          # Check for WebKit2GTK runtime dependency
          # This AppImage was built against webkit2gtk-${WEBKIT_API}
          if ! ldconfig -p 2>/dev/null | grep -q "${WEBKIT_SONAME}"; then
            echo "=========================================="
            echo " Missing dependency: ${WEBKIT_PKG}"
            echo "=========================================="
            echo ""
            echo "This application requires WebKit2GTK ${WEBKIT_API} to run."
            echo "Please install it with your package manager:"
            echo ""
            echo "  sudo apt install ${WEBKIT_PKG}"
            echo ""
            echo "Note: This AppImage is built for Ubuntu ${UBUNTU_VER}."
            echo "For other Ubuntu versions, download the matching AppImage:"
            echo "  Ubuntu 22.04 → *-u2204.AppImage (webkit2gtk-4.0)"
            echo "  Ubuntu 24.04/26.04 → *-u2404.AppImage (webkit2gtk-4.1)"
            echo ""

            if command -v zenity &>/dev/null; then
              zenity --error --title="Missing Dependency" \
                --text="WebKit2GTK ${WEBKIT_API} is required but not installed.\n\nsudo apt install ${WEBKIT_PKG}\n\nThis AppImage is for Ubuntu ${UBUNTU_VER}." \
                --width=400 2>/dev/null
            elif command -v kdialog &>/dev/null; then
              kdialog --error "WebKit2GTK ${WEBKIT_API} is required but not installed.\n\nsudo apt install ${WEBKIT_PKG}\n\nThis AppImage is for Ubuntu ${UBUNTU_VER}." 2>/dev/null
            fi
            exit 1
          fi

          exec ${OUT_LOWER} "\$@"
          REOF
          sed -i 's/^[[:space:]]*//' "$APP_DIR/AppRun"
          chmod +x "$APP_DIR/AppRun"

          # Download appimagetool
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP_DIR" \
            "dist/${APPIMAGE_NAME}"

      - name: Upload Linux GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-${{ matrix.os_version }}-${{ matrix.brand || 'default' }}
          path: |
            dist/${{ env.BRAND_APP_NAME }}-x86_64-${{ env.UBUNTU_LABEL }}.AppImage

      - name: Upload Linux TUI & tool artifacts (newest runner only)
        if: env.BUILD_PURE_GO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tui-${{ matrix.brand || 'default' }}
          path: |
            dist/*-tui_amd64_linux
            dist/*-tui_arm64_linux
            dist/*-tool_amd64_linux
            dist/*-tool_arm64_linux
            dist/*-cli_amd64_linux
            dist/*-cli_arm64_linux
            dist/maclaw-tui_amd64_linux
            dist/maclaw-tui_arm64_linux
            dist/maclaw-tool_amd64_linux
            dist/maclaw-tool_arm64_linux
            dist/maclaw-cli_amd64_linux
            dist/maclaw-cli_arm64_linux

      - name: Upload Linux server artifacts (default brand, newest runner only)
        if: matrix.brand == '' && env.BUILD_PURE_GO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: |
            dist/maclawsrv_amd64_linux
            dist/maclawsrv_arm64_linux
            dist/maclaw-data-srv_amd64_linux
            dist/maclaw-data-srv_arm64_linux
            dist/srvdemo_amd64_linux

  # ============================================================
  # Linux ARM64: GUI (arm64, CGO native) + AppImage
  # Build on multiple Ubuntu versions for webkit2gtk compatibility.
  # ============================================================
  build-linux-arm64:
    strategy:
      matrix:
        brand: ${{ inputs.BRAND == 'maclaw' && fromJSON('[""]') || inputs.BRAND == 'qianxin' && fromJSON('["qianxin"]') || fromJSON('["", "qianxin"]') }}
        os_version: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute brand variables
        run: |
          BRAND="${{ matrix.brand }}"
          if [ -n "$BRAND" ]; then
            case "$BRAND" in
              qianxin) DISPLAY_NAME="TigerClaw" ;;
              *)       DISPLAY_NAME="$BRAND" ;;
            esac
            echo "BRAND_TAG=oem_${BRAND}" >> $GITHUB_ENV
            echo "BRAND_ICON_PNG=assets/${BRAND}.png" >> $GITHUB_ENV
            echo "BRAND_APP_NAME=${DISPLAY_NAME}" >> $GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${DISPLAY_NAME}" >> $GITHUB_ENV
          else
            echo "BRAND_TAG=" >> $GITHUB_ENV
            echo "BRAND_ICON_PNG=build/appicon.png" >> $GITHUB_ENV
            echo "BRAND_APP_NAME=${APP_NAME}" >> $GITHUB_ENV
            echo "BRAND_DISPLAY_NAME=${APP_NAME}" >> $GITHUB_ENV
          fi

      - name: Compute OS suffix for artifact naming
        run: |
          # Extract Ubuntu version number (e.g. "22.04" from "ubuntu-22.04-arm")
          OS_VER="${{ matrix.os_version }}"
          UBUNTU_VER=$(echo "$OS_VER" | sed 's/ubuntu-//;s/-arm//')
          UBUNTU_LABEL="u${UBUNTU_VER/./}"
          echo "UBUNTU_VER=${UBUNTU_VER}" >> $GITHUB_ENV
          echo "UBUNTU_LABEL=${UBUNTU_LABEL}" >> $GITHUB_ENV
          # Only build srvdemo on the newest runner (avoid duplicate artifacts)
          if [ "${{ matrix.os_version }}" = "ubuntu-24.04-arm" ]; then
            echo "BUILD_SRVDEMO=true" >> $GITHUB_ENV
          else
            echo "BUILD_SRVDEMO=false" >> $GITHUB_ENV
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          if sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev 2>/dev/null; then
            TAGS="desktop,production"
            echo "WEBKIT_SONAME=libwebkit2gtk-4.0.so.37" >> $GITHUB_ENV
            echo "WEBKIT_PKG=libwebkit2gtk-4.0-37" >> $GITHUB_ENV
            echo "WEBKIT_API=4.0" >> $GITHUB_ENV
          else
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
            TAGS="desktop,production,webkit2_41"
            echo "WEBKIT_SONAME=libwebkit2gtk-4.1.so.0" >> $GITHUB_ENV
            echo "WEBKIT_PKG=libwebkit2gtk-4.1-0" >> $GITHUB_ENV
            echo "WEBKIT_API=4.1" >> $GITHUB_ENV
          fi
          if [ -n "$BRAND_TAG" ]; then TAGS="${TAGS},${BRAND_TAG}"; fi
          echo "WEBKIT_TAGS=${TAGS}" >> $GITHUB_ENV

      - name: Extract version (prefer git tag, fallback to wails.json)
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[Vv]([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Version from git tag: $VERSION"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('wails.json'))['info']['productVersion'])")
            echo "Version from wails.json: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          BUILD_NUM=$(echo "$VERSION" | awk -F. '{print ($4 != "" ? $4 : "0")}')
          printf "export const buildNumber = '%s';\nexport const appVersion = '%s';\n" "$BUILD_NUM" "$VERSION" > gui/frontend/src/version.ts

      - name: Build frontend
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Build Linux GUI (arm64)
        run: |
          mkdir -p dist build/bin
          OUT_NAME="${BRAND_APP_NAME}"
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -tags "${WEBKIT_TAGS}" -ldflags "-X main.version=${VERSION}" \
            -o "build/bin/${OUT_NAME}_arm64_linux_${UBUNTU_LABEL}" ./gui/
          cp "build/bin/${OUT_NAME}_arm64_linux_${UBUNTU_LABEL}" "build/bin/${OUT_NAME}_arm64_linux"

      - name: Build srvdemo (default brand, newest runner only)
        if: matrix.brand == '' && env.BUILD_SRVDEMO == 'true'
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -tags "${WEBKIT_TAGS}" -ldflags "-s -w" -o "dist/srvdemo_arm64_linux" ./srvdemo/

      - name: Create AppImage (arm64)
        run: |
          OUT_NAME="${BRAND_APP_NAME}"
          OUT_LOWER=$(echo "$OUT_NAME" | tr '[:upper:]' '[:lower:]')
          APPIMAGE_NAME="${OUT_NAME}-aarch64-${UBUNTU_LABEL}.AppImage"
          APP_DIR="build/linux/AppDir_arm64"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin"
          mkdir -p "$APP_DIR/usr/share/icons/hicolor/512x512/apps"
          cp "build/bin/${OUT_NAME}_arm64_linux" "$APP_DIR/usr/bin/${OUT_LOWER}"
          cp "${BRAND_ICON_PNG}" "$APP_DIR/${OUT_LOWER}.png"
          cp "${BRAND_ICON_PNG}" "$APP_DIR/.DirIcon"
          cp "${BRAND_ICON_PNG}" "$APP_DIR/usr/share/icons/hicolor/512x512/apps/${OUT_LOWER}.png"

          cat > "$APP_DIR/${OUT_LOWER}.desktop" << DEOF
          [Desktop Entry]
          Name=${BRAND_DISPLAY_NAME}
          Exec=${OUT_LOWER}
          Icon=${OUT_LOWER}
          Type=Application
          Categories=Development;
          DEOF
          sed -i 's/^[[:space:]]*//' "$APP_DIR/${OUT_LOWER}.desktop"

          cat > "$APP_DIR/AppRun" << REOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export PATH="\${HERE}/usr/bin:\${PATH}"

          # This AppImage was built against webkit2gtk-${WEBKIT_API}
          if ! ldconfig -p 2>/dev/null | grep -q "${WEBKIT_SONAME}"; then
            echo "=========================================="
            echo " Missing dependency: ${WEBKIT_PKG}"
            echo "=========================================="
            echo ""
            echo "This application requires WebKit2GTK ${WEBKIT_API} to run."
            echo "Please install it with your package manager:"
            echo ""
            echo "  sudo apt install ${WEBKIT_PKG}"
            echo ""
            echo "Note: This AppImage is built for Ubuntu ${UBUNTU_VER}."
            echo "For other Ubuntu versions, download the matching AppImage:"
            echo "  Ubuntu 22.04 → *-u2204.AppImage (webkit2gtk-4.0)"
            echo "  Ubuntu 24.04/26.04 → *-u2404.AppImage (webkit2gtk-4.1)"
            echo ""

            if command -v zenity &>/dev/null; then
              zenity --error --title="Missing Dependency" \
                --text="WebKit2GTK ${WEBKIT_API} is required but not installed.\n\nsudo apt install ${WEBKIT_PKG}\n\nThis AppImage is for Ubuntu ${UBUNTU_VER}." \
                --width=400 2>/dev/null
            elif command -v kdialog &>/dev/null; then
              kdialog --error "WebKit2GTK ${WEBKIT_API} is required but not installed.\n\nsudo apt install ${WEBKIT_PKG}\n\nThis AppImage is for Ubuntu ${UBUNTU_VER}." 2>/dev/null
            fi
            exit 1
          fi

          exec ${OUT_LOWER} "\$@"
          REOF
          sed -i 's/^[[:space:]]*//' "$APP_DIR/AppRun"
          chmod +x "$APP_DIR/AppRun"

          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x appimagetool
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run "$APP_DIR" \
            "dist/${APPIMAGE_NAME}"

      - name: Upload Linux ARM64 GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-gui-${{ matrix.os_version }}-${{ matrix.brand || 'default' }}
          path: |
            dist/${{ env.BRAND_APP_NAME }}-aarch64-${{ env.UBUNTU_LABEL }}.AppImage

      - name: Upload Linux ARM64 srvdemo (default brand, newest runner only)
        if: matrix.brand == '' && env.BUILD_SRVDEMO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-srvdemo
          path: |
            dist/srvdemo_arm64_linux

  # ============================================================
  # Release: collect all artifacts and create GitHub Release
  # ============================================================
  release:
    needs: [build-windows, build-ins-maclaw, build-macos, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Prepare release assets
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          find artifacts -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            dest="release-assets/${base}"
            if [ -e "$dest" ]; then
              parent="$(basename "$(dirname "$file")")"
              dest="release-assets/${parent}-${base}"
              echo "warning: duplicate asset basename ${base}; using $(basename "$dest")" >&2
            fi
            cp "$file" "$dest"
          done
          echo "Release assets:"
          find release-assets -type f -printf '%f (%s bytes)\n' | sort

      - name: Prepare release notes
        run: |
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ github.ref_name }}" > release_notes.md
          fi

      - name: Generate latest manifest
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || 'https://pub-c837069cbe31469590a5fea6235b436b.r2.dev' }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          MANIFEST_OUTPUT_NAME: ${{ env.MANIFEST_NAME }}
          COS_RELEASE_ONLY_ASSETS: |
            MaClaw-aarch64-u2204.AppImage
            MaClaw-aarch64-u2404.AppImage
            MaClaw-x86_64-u2204.AppImage
            MaClaw-x86_64-u2404.AppImage
            MaClaw-Setup.exe
            MaClaw-Universal.pkg
            maclawsrv-Setup.exe
            maclawsrv-Universal.pkg
            maclaw-data-srv-Setup.exe
            maclaw-data-srv-Universal.pkg
            TigerClaw-aarch64-u2204.AppImage
            TigerClaw-aarch64-u2404.AppImage
            TigerClaw-x86_64-u2204.AppImage
            TigerClaw-x86_64-u2404.AppImage
            TigerClaw-Setup.exe
            TigerClaw-Universal.pkg
            Ins-maclaw-windows-amd64.exe
            Ins-maclaw-windows-arm64.exe
            Ins-maclaw-windows-amd64-tui.exe
            Ins-maclaw-windows-arm64-tui.exe
            Ins-maclaw-darwin-amd64
            Ins-maclaw-darwin-arm64
            Ins-maclaw-linux-amd64
            Ins-maclaw-linux-arm64
        run: |
          if [ -z "$COS_PUBLIC_BASE_URL" ]; then
            echo "COS_PUBLIC_BASE_URL is not configured; manifest cannot include fallback URLs." >&2
            exit 1
          fi
          python3 .github/scripts/sync_cos_release.py --manifest-only --manifest-name "${MANIFEST_NAME}"
          echo "${MANIFEST_NAME} preview:"
          cat "release-assets/${MANIFEST_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Set up Node.js 22 for Cloudflare R2
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload release assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || '67e0c3cc0a7fe73a0025b2de4711f649' }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'maclaw' }}
          RELEASE_ASSETS_DIR: release-assets
          R2_RELEASE_ONLY_ASSETS: |
            MaClaw-aarch64-u2204.AppImage
            MaClaw-aarch64-u2404.AppImage
            MaClaw-x86_64-u2204.AppImage
            MaClaw-x86_64-u2404.AppImage
            MaClaw-Setup.exe
            MaClaw-Universal.pkg
            maclawsrv-Setup.exe
            maclawsrv-Universal.pkg
            maclaw-data-srv-Setup.exe
            maclaw-data-srv-Universal.pkg
            TigerClaw-aarch64-u2204.AppImage
            TigerClaw-aarch64-u2404.AppImage
            TigerClaw-x86_64-u2204.AppImage
            TigerClaw-x86_64-u2404.AppImage
            TigerClaw-Setup.exe
            TigerClaw-Universal.pkg
            Ins-maclaw-windows-amd64.exe
            Ins-maclaw-windows-arm64.exe
            Ins-maclaw-windows-amd64-tui.exe
            Ins-maclaw-windows-arm64-tui.exe
            Ins-maclaw-darwin-amd64
            Ins-maclaw-darwin-arm64
            Ins-maclaw-linux-amd64
            Ins-maclaw-linux-arm64
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "Cloudflare R2 secrets are not configured; skipping R2 upload."
            exit 0
          fi
          node --version
          npm --version
          npm install -g wrangler@latest
          wrangler --version
          echo "Uploading release assets to Cloudflare R2 bucket=$R2_BUCKET"
          # Determine asset prefix based on release channel (stable → latest/, beta → beta/)
          ASSET_PREFIX="latest"
          if [ "${RELEASE_CHANNEL}" = "beta" ]; then
            ASSET_PREFIX="beta"
          fi
          echo "Channel=${RELEASE_CHANNEL} prefix=${ASSET_PREFIX}/ manifest=${MANIFEST_NAME}"
          printf '%s\n' "$R2_RELEASE_ONLY_ASSETS" | while IFS= read -r name; do
            [ -n "$name" ] || continue
            path="$RELEASE_ASSETS_DIR/$name"
            if [ ! -f "$path" ]; then
              echo "R2 release asset not found: $name" >&2
              exit 1
            fi
            echo "R2 upload $name size=$(stat -c%s "$path") key=$ASSET_PREFIX/$name"
            wrangler r2 object put "$R2_BUCKET/$ASSET_PREFIX/$name" --file "$path" --remote --cache-control "public, max-age=31536000, immutable"
          done
          wrangler r2 object put "$R2_BUCKET/${MANIFEST_NAME}" --file "release-assets/${MANIFEST_NAME}" --remote --cache-control "public, max-age=60"

      - name: Upload release assets to Tencent COS
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || 'https://pub-c837069cbe31469590a5fea6235b436b.r2.dev' }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          MANIFEST_OUTPUT_NAME: ${{ env.MANIFEST_NAME }}
          COS_UPLOAD_PART_SIZE_MB: 8
          COS_UPLOAD_THREADS: 8
          COS_RELEASE_ONLY_ASSETS: |
            MaClaw-aarch64-u2204.AppImage
            MaClaw-aarch64-u2404.AppImage
            MaClaw-x86_64-u2204.AppImage
            MaClaw-x86_64-u2404.AppImage
            MaClaw-Setup.exe
            MaClaw-Universal.pkg
            maclawsrv-Setup.exe
            maclawsrv-Universal.pkg
            maclaw-data-srv-Setup.exe
            maclaw-data-srv-Universal.pkg
            TigerClaw-aarch64-u2204.AppImage
            TigerClaw-aarch64-u2404.AppImage
            TigerClaw-x86_64-u2204.AppImage
            TigerClaw-x86_64-u2404.AppImage
            TigerClaw-Setup.exe
            TigerClaw-Universal.pkg
            Ins-maclaw-windows-amd64.exe
            Ins-maclaw-windows-arm64.exe
            Ins-maclaw-windows-amd64-tui.exe
            Ins-maclaw-windows-arm64-tui.exe
            Ins-maclaw-darwin-amd64
            Ins-maclaw-darwin-arm64
            Ins-maclaw-linux-amd64
            Ins-maclaw-linux-arm64
        run: |
          if [ -z "$COS_SECRET_ID" ] || [ -z "$COS_SECRET_KEY" ] || [ -z "$COS_BUCKET" ] || [ -z "$COS_REGION" ] || [ -z "$COS_PUBLIC_BASE_URL" ]; then
            echo "Tencent COS secrets are not configured; skipping COS upload."
            exit 0
          fi
          python3 -m pip install -q cos-python-sdk-v5
          python3 .github/scripts/sync_cos_release.py

      - name: Verify Gitee token secret
        env:
          GITEE_TOKEN: ${{ secrets.GITEE }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITEE_TOKEN"]
          print(f"GITEE_TOKEN length={len(token)} sha256_prefix={hashlib.sha256(token.encode()).hexdigest()[:12]}")
          user_url = "https://gitee.com/api/v5/user?" + urllib.parse.urlencode({"access_token": token})
          try:
              with urllib.request.urlopen(user_url, timeout=30) as resp:
                  user = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"Gitee token validation failed at /user: HTTP {exc.code} {payload}\n"
                  "The selected GitHub secret must be a Gitee API access token. "
                  "Check that repository secret GITEE contains the token value itself, not a secret name, SSH key, password, or prefixed text."
              )
          print(f"Verified Gitee token login={user.get('login')} name={user.get('name')} id={user.get('id')}")
          url = "https://gitee.com/api/v5/repos/znsoft/maclaw?" + urllib.parse.urlencode({"access_token": token})
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  repo = json.loads(resp.read().decode("utf-8"))
              print(f"Verified Gitee repo access: {repo.get('full_name') or repo.get('path_with_namespace') or 'znsoft/maclaw'}")
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Gitee token cannot access znsoft/maclaw: HTTP {exc.code} {payload}")
          PY

      - name: Push source tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN secret is required for Gitee sync" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import os

          token = os.environ["GITEE_TOKEN"]
          print(f"Push step GITEE_TOKEN length={len(token)} sha256_prefix={hashlib.sha256(token.encode()).hexdigest()[:12]}")
          PY
          tag="${{ github.ref_name }}"
          gitee_login="$(python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GITEE_TOKEN"]
          url = "https://gitee.com/api/v5/user?" + urllib.parse.urlencode({"access_token": token})
          with urllib.request.urlopen(url, timeout=30) as resp:
              user = json.loads(resp.read().decode("utf-8"))
          print(user.get("login") or "")
          PY
          )"
          if [ -z "$gitee_login" ]; then
            echo "Unable to resolve Gitee token username" >&2
            exit 1
          fi
          export GITEE_LOGIN="$gitee_login"
          gitee_login_encoded="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ["GITEE_LOGIN"], safe=""))
          PY
          )"
          gitee_token_encoded="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ["GITEE_TOKEN"], safe=""))
          PY
          )"
          git remote add gitee "https://${gitee_login_encoded}:${gitee_token_encoded}@gitee.com/znsoft/maclaw.git"
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub ref_name: ${tag}"
          echo "GitHub sha: ${{ github.sha }}"
          echo "Local HEAD: $(git rev-parse HEAD)"
          echo "Gitee token user: ${gitee_login}"
          echo "Gitee push username: ${gitee_login}"
          echo "Gitee push repository: znsoft/maclaw"
          echo "Gitee remote: https://${gitee_login}:***@gitee.com/znsoft/maclaw.git"
          git fetch origin main --tags --force
          echo "Origin main: $(git rev-parse refs/remotes/origin/main)"
          echo "Release tag object: $(git rev-parse refs/tags/${tag})"
          echo "Release tag peeled commit: $(git rev-parse refs/tags/${tag}^{})"

          if git ls-remote --exit-code gitee refs/heads/main >/tmp/gitee-main-ref 2>/tmp/gitee-main-err; then
            echo "Gitee main before push: $(cat /tmp/gitee-main-ref)"
          else
            echo "Gitee main before push: not found or inaccessible"
            cat /tmp/gitee-main-err >&2 || true
          fi

          if git ls-remote --exit-code gitee "refs/tags/${tag}" >/tmp/gitee-tag-ref 2>/tmp/gitee-tag-err; then
            echo "Gitee tag ${tag} before push: $(cat /tmp/gitee-tag-ref)"
          else
            echo "Gitee tag ${tag} before push: not found"
            cat /tmp/gitee-tag-err >&2 || true
          fi

          if ! GIT_LFS_SKIP_PUSH=1 git push gitee refs/remotes/origin/main:refs/heads/main 2>/tmp/gitee-main-push-err; then
            cat /tmp/gitee-main-push-err >&2 || true
            if grep -qi "Access denied\|403" /tmp/gitee-main-push-err; then
              echo "error: Gitee token user '${gitee_login}' can read znsoft/maclaw but cannot push to it." >&2
              echo "error: Grant '${gitee_login}' write access on Gitee, enable the token's repository write scope, or replace GITEE_TOKEN with a writable account token." >&2
            fi
            echo "warning: Gitee main branch push failed; continuing with current tag sync" >&2
          fi

          if git ls-remote --exit-code gitee "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Gitee tag ${tag} already exists; skip pushing tag"
          elif ! GIT_LFS_SKIP_PUSH=1 git push gitee "refs/tags/${tag}:refs/tags/${tag}" 2>/tmp/gitee-tag-push-err; then
            cat /tmp/gitee-tag-push-err >&2 || true
            if grep -qi "Access denied\|403" /tmp/gitee-tag-push-err; then
              echo "error: Gitee token user '${gitee_login}' does not have permission to create tag ${tag} in znsoft/maclaw." >&2
              echo "error: Gitee Release sync needs this tag to exist before assets can be uploaded." >&2
            fi
            echo "error: failed to push release tag ${tag} to Gitee" >&2
            exit 1
          fi

          git ls-remote gitee refs/heads/main "refs/tags/${tag}"

      - name: Skip Gitee release asset upload
        run: echo "Release packages are uploaded to Tencent COS; skipping slow Gitee asset upload."



