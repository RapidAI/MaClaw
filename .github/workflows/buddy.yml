name: Buddy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "buddy/**"
      - ".github/workflows/buddy.yml"
  push:
    paths:
      - "buddy/**"
      - ".github/workflows/buddy.yml"

jobs:
  host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Protocol and link tests
        run: go test ./buddy/protocol ./buddy/service -count=1

      - name: Layout goldens for both glasses
        run: |
          python -m pip install pillow
          python buddy/tools/preview_layout.py
