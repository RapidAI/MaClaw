name: Agent Architecture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agent-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check shared Runtime architecture
        run: node scripts/check-agent-architecture.mjs

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Run Runtime/service/HTTP contract tests
        run: >-
          go test ./corelib/agentruntime ./corelib/agentservice ./MaClawSrv
          -run 'Test(ModuleRegistry|RuntimeExecutor|RuntimeSurfaceDigest|DescribeRuntimeCapabilities|RuntimeCapabilitiesEndpoint|RuntimeCallbacks|CoreAgentCallbacks|RegisterBuiltinModules|ResolveRole|AdaptiveRetry|HeadlessScreenshot|GUIAndSrv|SQLiteRunEventStoreConcurrent|RunEventsStream|OpenAPIDocument)'
          -count=1 -race

      - name: Run desktop bot offline prompt cases
        run: go test ./corelib/desktopbot -run 'TestDesktopBotPromptPrefixCases|TestVisible|TestActivityPhrase' -count=1

      - name: Run desktop bot offline tool cases
        run: go test ./corelib/desktopbot ./MaClawSrv ./corelib/agentservice -run 'TestDesktopBot(PromptPrefix|Tool)Cases' -count=1

      - name: Run desktop bot offline progress cases
        run: go test ./corelib/desktopbot ./MaClawSrv ./corelib/agentservice -run TestDesktopBotProgressCases -count=1

      - name: Run desktop bot offline silence cases
        run: go test ./corelib/desktopbot ./corelib/agentservice ./corelib/scheduler ./MaClawSrv ./hub/internal/botmgmt -run TestDesktopBotSilenceCases -count=1

      - name: Run desktop bot offline computer cases
        run: go test ./corelib/desktopbot ./MaClawSrv -run TestDesktopBotComputerCases -count=1

      - name: Run desktop bot offline structure cases
        run: go test ./corelib/desktop/computeruse ./MaClawSrv -run TestDesktopBotStructureCases -count=1

      - name: Run desktop bot offline danger cases
        run: go test ./corelib/desktopbot ./MaClawSrv ./corelib/agentservice -run TestDesktopBotDangerCases -count=1

      - name: Run desktop bot offline memory cases
        run: go test ./corelib/memory ./corelib/agentservice -run TestDesktopBotMemoryCases -count=1

      - name: Run desktop bot offline summary cases
        run: go test ./corelib/agent ./corelib/agentservice -run TestDesktopBotSummaryCases -count=1

      - name: Run desktop bot offline sleep cases
        run: go test ./desktopd ./hub/internal/desktoppool -run TestDesktopBotSleepCases -count=1

      - name: Run desktop bot offline event cases
        run: go test ./corelib/agentservice ./corelib/scheduler ./MaClawSrv ./hub/internal/botmgmt -run TestDesktopBotEventCases -count=1

      - name: Run desktop bot offline split cases
        run: go test ./MaClawSrv ./hub/internal/botmgmt ./hub/internal/httpapi -run TestDesktopBotSplitCases -count=1

      - name: Run desktop bot offline durable cases
        run: go test ./corelib/desktopbot ./corelib/mailbox ./corelib/agentservice ./MaClawSrv -run TestDesktopBotDurableCases -count=1

      - name: Run desktop bot offline login cases
        run: go test ./desktopd -run TestDesktopBotLoginCases -count=1

      - name: Run desktop bot offline meta cases
        run: go test ./desktopd -run TestDesktopBotMetaCases -count=1

      - name: Run desktop bot offline publish cases
        run: go test ./desktopd -run TestDesktopBotPublishCases -count=1

      - name: Run desktop bot offline screen cases
        run: go test ./desktopd -run TestDesktopBotScreenCases -count=1

      - name: Run desktop bot offline runtime cases
        run: go test ./desktopd -run TestDesktopBotRuntimeCases -count=1

      - name: Run desktop bot offline file cases
        run: go test ./desktopd -run TestDesktopBotFileCases -count=1

      - name: Run desktop bot offline command cases
        run: go test ./desktopd -run TestDesktopBotCommandCases -count=1

      - name: Run desktop bot offline wake cases
        run: go test ./desktopd -run TestDesktopBotWakeCases -count=1

      # guiapp's linux pet/floating files are cgo with pkg-config gtk+-3.0, and
      # the wails v2 runtime needs webkit2gtk: install them (4.0 on 22.04, or
      # 4.1 + build tag on 24.04/26.04) or the compile step dies on pkg-config.
      - name: Install GTK for GUI host compile
        run: |
          # Ubuntu mirrors occasionally accept the connection and never
          # answer, which used to hang a job indefinitely. Bound each
          # attempt and retry a few times before giving up.
          for attempt in 1 2 3; do
            sudo timeout 180 apt-get update -o Acquire::Retries=2 && break
            echo "apt-get update failed (attempt $attempt/3); retrying in 10s"
            sleep 10
          done
          sudo timeout 300 apt-get install -y --no-install-recommends ca-certificates curl 2>/dev/null || true
          if sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev 2>/dev/null; then
            echo "GUIHOST_TAGS=" >> $GITHUB_ENV
          else
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
            echo "GUIHOST_TAGS=webkit2_41" >> $GITHUB_ENV
          fi

      - name: Compile GUI host contract tests
        run: GOFLAGS="-tags=$GUIHOST_TAGS" go test ./guiapp -run 'Test(SharedAgentLoopCallbacksEmitRuntimeEvents|RunAgentLoopSharedDelegatesThroughRuntimeContract|GUIRuntimeDescribesDeterministicToolSurface|GUIAndSrv)' -count=1 -race

      - name: Run desktop bot local progress cases
        run: GOFLAGS="-tags=$GUIHOST_TAGS" go test ./guiapp -run TestDesktopBotProgressCases -count=1

      - name: Run desktop bot local silence cases
        run: GOFLAGS="-tags=$GUIHOST_TAGS" go test ./guiapp -run TestDesktopBotSilenceCases -count=1

      - name: Run desktop bot local computer cases
        run: GOFLAGS="-tags=$GUIHOST_TAGS" go test ./guiapp -run TestDesktopBotComputerCases -count=1

      - name: Run desktop bot local split cases
        run: GOFLAGS="-tags=$GUIHOST_TAGS" go test ./guiapp -run TestDesktopBotSplitCases -count=1
