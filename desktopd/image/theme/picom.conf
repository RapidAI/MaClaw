# maclaw-gui:2: CPU-only compositor (Xvfb has no GPU).
backend = "xrender";
vsync = false;
use-damage = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.28;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Plank'",
  "class_g = 'fcitx'",
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];
# Short fades so screenshots settle quickly.
fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
fade-delta = 8;
no-fading-openclose = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;
wintypes: {
  tooltip = { fade = true; shadow = false; };
  popup_menu = { shadow = true; };
  dropdown_menu = { shadow = true; };
  dock = { shadow = false; };
};
