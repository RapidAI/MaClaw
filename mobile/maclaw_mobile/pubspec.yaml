name: maclaw_mobile
description: MaClaw Mobile emergency AI, document, and SSH companion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^22.0.1
  go_router: ^14.2.7
  intl: ^0.19.0
  share_plus: ^10.0.2
  receive_sharing_intent: 1.8.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  drift: ^2.20.3
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  web_socket_channel: ^3.0.1
  xterm: ^4.0.0
  dartssh2: ^2.9.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/maclaw_logo.png
