<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>服务商管理对话框布局预览</title>
<link rel="stylesheet" href="./src/App.css">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        background: var(--theme-page-bg);
        color: var(--theme-text-primary);
    }
    /* Simplified settings backdrop so the overlay reads in context. */
    .fake-panel { max-width: 760px; margin: 40px auto; padding: 20px 24px; border: 1px solid var(--theme-border); border-radius: 14px; background: var(--theme-surface); }
    .fake-panel h2 { margin: 0 0 10px; font-size: 1.02rem; }
    .fake-panel p { margin: 0; font-size: 0.78rem; color: var(--theme-text-secondary); }
    /* Mirrors the shared inline styles in LLMConfigPanelShared. */
    .field-label { display: block; font-size: 0.76rem; color: var(--theme-text-secondary); margin-bottom: 4px; }
    .field-input {
        width: 100%; padding: 7px 10px; font-size: 0.8rem; font-family: inherit;
        border: 1px solid var(--theme-border); border-radius: var(--radius-md, 10px);
        background: var(--theme-surface); color: var(--theme-text-primary); box-sizing: border-box;
    }
    .field-hint { font-size: 0.68rem; color: var(--theme-text-muted); margin: 4px 0 0 0; line-height: 1.4; }
</style>
</head>
<body>
<div class="fake-panel">
    <h2>远程设置 · 助手服务商</h2>
    <p>背景页面内容 —— 仅用于给对话框提供上下文。OpenAI Official (sk-admin-…)</p>
</div>

<div class="llm-config-dialog-overlay">
  <div class="llm-config-dialog" role="dialog" aria-modal="true" aria-label="MaClaw 大模型配置">
    <div class="llm-config-dialog__header">
      <div class="llm-config-dialog__heading">
        <span class="llm-config-dialog__title">MaClaw 大模型配置</span>
        <span class="llm-config-dialog__subtitle">选择服务商，检测连通性并维护连接凭据。</span>
      </div>
      <button class="llm-config-dialog__close" aria-label="关闭">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <div class="llm-config-dialog__body">
      <div class="llm-config-provider-section">
        <label class="field-label">选择服务商</label>
        <div class="llm-config-provider-grid">
          <button class="llm-config-provider-chip is-hub" style="position:relative;">MaClaw 官方<span class="llm-config-provider-chip__tag">未生效</span></button>
          <button class="llm-config-provider-chip is-active" style="position:relative;"><span class="llm-config-provider-chip__dot"></span>自定义服务商</button>
          <button class="llm-config-provider-chip" style="position:relative;"><span class="llm-config-provider-chip__dot"></span>OpenAI</button>
          <button class="llm-config-provider-chip" style="position:relative;"><span class="llm-config-provider-chip__dot"></span>DeepSeek</button>
          <button class="llm-config-provider-chip" style="position:relative;">智谱龙虾</button>
          <button class="llm-config-provider-chip" style="position:relative;"><span class="llm-config-provider-chip__dot"></span>Kimi (月之暗面)</button>
          <button class="llm-config-provider-chip" style="position:relative;">暂不配置</button>
        </div>
      </div>

      <div class="llm-config-form-card" style="border:1px solid var(--theme-border-subtle); background:var(--theme-surface); box-shadow:none;">
        <div class="llm-config-form-card__heading">
          <div class="llm-config-form-card__title">自定义服务商配置</div>
          <button class="llm-config-tokenbank-badge" style="border:1px solid color-mix(in srgb, var(--theme-primary) 32%, var(--theme-border)); border-radius:999px; background:var(--theme-surface); color:var(--theme-primary-strong); font-size:0.75rem; font-weight:600; cursor:pointer;">存入令牌银行</button>
        </div>

        <div class="llm-config-form-section">
          <div class="llm-config-form-section__title">连接配置</div>
          <div style="margin-bottom:12px;">
            <label class="field-label">从已知服务商快速填充</label>
            <select class="field-input"><option>-- 选择已知服务商自动填充 --</option><option>OpenAI Official — gpt-5.4</option><option>DeepSeek — deepseek-chat</option></select>
          </div>
          <div style="margin-bottom:12px;">
            <label class="field-label">API 协议</label>
            <div style="display:flex; gap:6px;">
              <button class="llm-config-option-btn is-active">OpenAI</button>
              <button class="llm-config-option-btn">Anthropic</button>
            </div>
            <p class="field-hint">使用 OpenAI 兼容 API（Bearer Token 鉴权）</p>
          </div>
          <div style="margin-bottom:12px;">
            <label class="field-label">User-Agent</label>
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
              <button class="llm-config-option-btn is-active">openclaw</button>
              <button class="llm-config-option-btn">claude code 2.0</button>
              <button class="llm-config-option-btn">Kilo Code</button>
              <button class="llm-config-option-btn">OpenCode</button>
              <button class="llm-config-option-btn">自定义</button>
            </div>
            <p class="field-hint">大多数服务商使用 OpenClaw 身份（如智谱龙虾）</p>
          </div>
          <div style="margin-bottom:12px;">
            <label class="field-label">服务商名称</label>
            <input class="field-input" value="我的中转站">
          </div>
          <div style="margin-bottom:12px;">
            <label class="field-label">API 地址 (URL)</label>
            <input class="field-input" value="https://api.example.com/v1">
          </div>
        </div>

        <div class="llm-config-form-section">
          <div class="llm-config-form-section__title">模型与认证</div>
          <div style="margin-bottom:12px;">
            <label class="field-label">模型名称 <span style="font-size:0.68rem;color:var(--theme-text-muted);margin-left:6px;">（可点击“获取”浏览）</span></label>
            <div style="display:flex;">
              <input class="field-input" role="combobox" value="deepseek-chat" style="border-radius:10px 0 0 10px; flex:1;">
              <button class="llm-config-option-btn" style="min-height:36px; border-start-start-radius:0; border-end-start-radius:0;" id="preview-fetch-btn">获取</button>
            </div>
          </div>
          <div>
            <label class="field-label">API Key <span style="color:var(--theme-danger);">*</span></label>
            <input class="field-input" type="password" value="sk-xxxxxxxxxxxxxxxx">
          </div>
        </div>

        <div class="llm-config-form-section">
          <div class="llm-config-form-section__title">高级参数</div>
          <div style="margin-bottom:12px;">
            <label class="field-label">上下文长度 (tokens)</label>
            <input class="field-input" type="number" value="128000" placeholder="128000">
            <p class="field-hint">模型支持的最大上下文长度。GLM 可支持 180000，留空默认 128000。</p>
          </div>
          <div style="margin-bottom:12px;">
            <label class="field-label">最大输出长度 (tokens)</label>
            <input class="field-input" type="number" value="65536" placeholder="65536">
            <p class="field-hint">单次回复最大 token 数。默认 65536。</p>
          </div>
          <div style="margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <div style="flex:1;">
              <label class="field-label" style="margin-bottom:2px;">视觉支持</label>
              <p style="font-size:0.68rem; color:var(--theme-text-muted); margin:0; line-height:1.4;">不支持视觉（图片会保存为文件，不发送给模型）</p>
            </div>
            <input type="checkbox" style="width:18px; height:18px; accent-color:var(--theme-primary); cursor:pointer; flex-shrink:0;">
          </div>
        </div>
      </div>
    </div>

    <div class="llm-config-dialog__footer">
      <div class="llm-config-footer">
        <div class="llm-config-footer__actions">
          <span class="llm-config-footer__unsaved">未保存</span>
          <button class="llm-config-btn">取消</button>
          <button class="llm-config-btn llm-config-btn--primary">检测并保存</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
