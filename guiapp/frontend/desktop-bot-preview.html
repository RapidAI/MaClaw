<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DesktopBot style preview</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; min-height: 100%; background-color: var(--theme-page-bg, #f4f7fb); }
      #root > div { height: 100%; min-height: 0; width: 100%; }
      /* 模拟真实外壳：工作区在 #App 弹性行里占满剩余宽度。 */
      #App > .desktop-bot-workspace { flex: 1 1 auto; min-width: 0; }
    </style>
</head>
<body>
<script>
  window.__MACLAW_LAST_ERROR = '';
  window.addEventListener('error', function (ev) {
    window.__MACLAW_LAST_ERROR = String((ev && ev.message) || ev)
      + '\n' + (ev && ev.error && ev.error.stack ? ev.error.stack : '')
      + '\n@' + (ev && ev.filename) + ':' + (ev && ev.lineno);
  });
  window.addEventListener('unhandledrejection', function (ev) {
    window.__MACLAW_LAST_ERROR = 'rejection: ' + String((ev && (ev.reason && (ev.reason.stack || ev.reason.message))) || ev.reason || ev);
  });
</script>
<div id="root"></div>
<script src="./src/dev/desktopBotPreview.tsx" type="module"></script>
</body>
</html>
