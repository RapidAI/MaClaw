name: pptx-gen
description: "PPT 生成 — 根据 JSON 大纲生成专业版式的 PowerPoint（.pptx）。theme 为 business/academic/warm/launch/tech/education/ceremony/minimal，或 auto 并提供 purpose，按用途自动选风格。每页 layout 支持 auto/bullets/cards/section/agenda/kpi/quote/closing，以及 kicker、images、charts。生成后用 office(action=preview_pptx) 渲染每页预览图，检查排版并迭代修复。"
triggers:
    - 生成PPT
    - 制作PPT
    - PPT制作
    - 做PPT
    - make pptx
    - generate pptx
    - create presentation
requires:
    python:
        - python-pptx
steps:
    - action: bash
      params:
        command: python -m pip install python-pptx --quiet 2>&1
        timeout: 60000
      continue_on_error: true

    - action: bash
      params:
        command: python "{baseDir}/scripts/build_pptx.py" --input "{{input}}" --output "{{output}}"
        timeout: 120000
      continue_on_error: false
      on_error: "PPTX 生成失败，请检查输入的大纲 JSON 文件是否合法（需含 title 与 slides 数组）"

status: active
platforms:
    - universal
requires_gui: false
produces_artifact: true
