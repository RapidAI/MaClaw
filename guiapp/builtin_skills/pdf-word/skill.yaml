name: pdf-word
description: "PDF 转 Word — 上传 PDF 文件，保留基本版式输出 Word 文档（.docx）。支持中英文混合文档。"
triggers:
    - PDF转Word
    - pdf to word
    - pdf to docx
    - 转换PDF
    - convert pdf
requires:
    python:
        - pymupdf
        - python-docx
steps:
    # The runner resolves requires.python before launching steps, installs into
    # its managed runtime, and reports that preparation through run status.
    # Do not install with the system `python` here: it duplicates work on every
    # run and may target a different interpreter than the converter receives.
    - action: bash
      params:
        command: python "{baseDir}/scripts/convert.py" --input "{{input}}" --output "{{output}}"
        timeout: 120000
      continue_on_error: false
      on_error: "PDF 转换失败，请检查文件是否为有效的 PDF 格式"

status: active
platforms:
    - universal
requires_gui: false
produces_artifact: true
