<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/skillmarket/maclaw-logo.png" alt="MaClaw logo">
      <div>
        <h1 id="pageTitle">MaClaw Capability Market</h1>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <div class="nav-actions">
      <a class="user-link" href="/skillmarket/user" id="userLink"></a>
      <div class="lang-switch" aria-label="Language">
        <button type="button" id="langZh" onclick="setLanguage('zh')" aria-pressed="false">&#20013;&#25991;</button>
        <button type="button" id="langEn" onclick="setLanguage('en')" aria-pressed="true">EN</button>
      </div>
    </div>
  </header>

  <section class="market-shell">
    <div class="search-panel">
      <div class="eyebrow" id="heroEyebrow"></div>
      <h2 id="heroTitle"></h2>
      <p class="subtitle" id="subtitle"></p>
      <div class="toolbar">
        <input id="searchInput" type="search" autocomplete="off" aria-label="Search capability name, scenario, or tag">
        <button id="searchBtn" type="button" onclick="doSearch()"></button>
      </div>
      <div class="market-stats" aria-label="Marketplace metrics">
        <div class="metric">
          <div class="metric-value" id="metricResults">0</div>
          <div class="metric-label" id="metricResultsLabel"></div>
        </div>
        <div class="metric">
          <div class="metric-value" id="metricRating">0.0</div>
          <div class="metric-label" id="metricRatingLabel"></div>
        </div>
        <div class="metric">
          <div class="metric-value" id="metricDownloads">0</div>
          <div class="metric-label" id="metricDownloadsLabel"></div>
        </div>
      </div>
    </div>
    <aside class="insight-panel">
      <div class="insight-title" id="insightTitle"></div>
      <div class="insight-row">
        <span id="insightStatusLabel"></span>
        <strong><span class="status-dot"></span><span id="insightStatusValue"></span></strong>
      </div>
      <div class="insight-row">
        <span id="insightCatalogLabel"></span>
        <strong id="insightCatalogValue">-</strong>
      </div>
      <div class="insight-row">
        <span id="insightRefreshLabel"></span>
        <strong id="insightRefreshValue"></strong>
      </div>
    </aside>
  </section>

  <main class="content-panel">
    <div role="tablist" aria-label="Capability types" style="display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px">
      <button class="cap-tab active" id="capTabSkills" onclick="switchCapTab('skills')" role="tab" aria-selected="true" aria-controls="capSkillsView" style="height:38px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius);background:#172033;border-color:#172033;color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer">Skills</button>
      <button class="cap-tab" id="capTabMCP" onclick="switchCapTab('mcp')" role="tab" aria-selected="false" aria-controls="capMCPView" style="height:38px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--muted);font:inherit;font-size:15px;font-weight:800;cursor:pointer">MCP</button>
    </div>
    <div id="capSkillsView" role="tabpanel" aria-labelledby="capTabSkills">
    <div class="section-head">
      <div>
        <h3 id="sectionTitle"></h3>
        <div class="section-note" id="sectionNote"></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Skill views">
        <button class="tab active" data-view="search" id="tabSearch" role="tab" aria-selected="true" aria-controls="view-search"></button>
        <button class="tab" data-view="top-rating" id="tabRating" role="tab" aria-selected="false" aria-controls="view-top-rating"></button>
        <button class="tab" data-view="top-downloads" id="tabDownloads" role="tab" aria-selected="false" aria-controls="view-top-downloads"></button>
        <button class="tab" data-view="top-newest" id="tabNewest" role="tab" aria-selected="false" aria-controls="view-top-newest"></button>
      </div>
    </div>

    <div id="view-search" role="tabpanel" aria-labelledby="tabSearch">
      <div id="searchResults" class="grid" aria-busy="false"></div>
      <div id="searchEmpty" class="state" style="display:none" aria-live="polite"></div>
    </div>

    <div id="view-top-rating" role="tabpanel" aria-labelledby="tabRating" style="display:none"><div id="ratingList" class="grid" aria-busy="false"></div><div id="ratingEmpty" class="state" style="display:none" aria-live="polite"></div></div>
    <div id="view-top-downloads" role="tabpanel" aria-labelledby="tabDownloads" style="display:none"><div id="downloadsList" class="grid" aria-busy="false"></div><div id="downloadsEmpty" class="state" style="display:none" aria-live="polite"></div></div>
    <div id="view-top-newest" role="tabpanel" aria-labelledby="tabNewest" style="display:none"><div id="newestList" class="grid" aria-busy="false"></div><div id="newestEmpty" class="state" style="display:none" aria-live="polite"></div></div>
    </div>
    <div id="capMCPView" role="tabpanel" aria-labelledby="capTabMCP" style="display:none">
      <div class="section-head"><div><h3 id="mcpSectionTitle"></h3><div class="section-note" id="mcpSectionNote"></div></div></div>
      <div id="mcpMarketList" class="grid" aria-busy="false"></div>
      <div id="mcpMarketEmpty" class="state" style="display:none" aria-live="polite"></div>
    </div>
  </main>
</div>

<div class="overlay" id="detailOverlay" aria-hidden="true">
  <div class="detail" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <button class="detail-close" id="detailClose" type="button" onclick="closeDetail()" aria-label="Close">x</button>
    <h2 id="detailName"></h2>
    <div id="detailTags" class="card-tags"></div>
    <p id="detailDesc"></p>
    <div class="detail-row">
      <span id="detailRatingWrap"></span>
      <span id="detailDownloadsWrap"></span>
      <span id="detailPriceWrap"></span>
      <span id="detailVersionWrap"></span>
      <span id="detailDateWrap"></span>
      <span id="detailStatusWrap" style="display:none"></span>
    </div>
    <div>
      <div id="rateLabel"></div>
      <div id="ratingRow" class="rating-row"></div>
      <p id="rateMsg" aria-live="polite"></p>
    </div>
  </div>
</div>

  priceFree:{zh:'\u514d\u8d39',en:'Free'},credits:{zh:'\u79ef\u5206',en:'Credits'},downloads:{zh:'\u4e0b\u8f7d',en:'Downloads'},rating:{zh:'\u8bc4\u5206',en:'Rating'},status:{zh:'\u72b6\u6001',en:'Status'},version:{zh:'\u7248\u672c',en:'Version'},uploaded:{zh:'\u4e0a\u4f20',en:'Uploaded'},
  rateLabel:{zh:'\u8bc4\u5206\uff08-2 \u5230 +2\uff09',en:'Rate (-2 to +2)'},rateNeedEmail:{zh:'\u8bf7\u8f93\u5165\u90ae\u7bb1\u540e\u8bc4\u5206',en:'Enter your email to rate.'},rateOk:{zh:'\u8bc4\u5206\u5df2\u63d0\u4ea4',en:'Rating submitted.'},network:{zh:'\u7f51\u7edc\u9519\u8bef\u3002',en:'Network error.'},
  statusPending:{zh:'\u5f85\u5ba1\u6838',en:'Pending Review'},statusPublished:{zh:'\u5df2\u4e0a\u67b6',en:'Published'},statusRejected:{zh:'\u5df2\u62d2\u7edd',en:'Rejected'},statusWithdrawn:{zh:'\u5df2\u4e0b\u67b6',en:'Withdrawn'},statusDraft:{zh:'\u8349\u7a3f',en:'Draft'},statusActive:{zh:'\u6709\u6548',en:'Active'},statusInactive:{zh:'\u672a\u542f\u7528',en:'Inactive'},statusUnknown:{zh:'\u672a\u77e5',en:'Unknown'}
};
function t(key){return (I18N[key]&&I18N[key][LANG])||key}
function setLanguage(lang){LANG=lang==='en'?'en':'zh';localStorage.setItem('sm_lang',LANG);document.getElementById('html-root').lang=LANG==='zh'?'zh-CN':'en';applyI18n();refreshCurrentView();}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];});}
function fmtDate(v){if(!v)return '-';try{var d=new Date(v);if(isNaN(d))return String(v);return d.toLocaleDateString(LANG==='zh'?'zh-CN':'en-US',{year:'numeric',month:'2-digit',day:'2-digit'});}catch(_){return String(v);}}
function statusText(v){var raw=String(v||'').toLowerCase();var map={pending_review:'statusPending',pending:'statusPending',published:'statusPublished',approved:'statusPublished',rejected:'statusRejected',withdrawn:'statusWithdrawn',draft:'statusDraft',active:'statusActive',inactive:'statusInactive'};return t(map[raw]||'statusUnknown')}
function activeView(){var active=document.querySelector('.tab.active');return active&&active.dataset.view?active.dataset.view:'search';}
function sectionKey(view){return view==='top-rating'?'Rating':view==='top-downloads'?'Downloads':view==='top-newest'?'Newest':'Search';}
function updateSectionText(){var key=sectionKey(activeView());sectionTitle.textContent=t('section'+key);sectionNote.textContent=t('note'+key);}
function updateMetrics(items){currentMetricItems=Array.isArray(items)?items:[];var total=currentMetricItems.length;var ratingSum=0;var ratingCount=0;var downloads=0;currentMetricItems.forEach(function(s){var rating=Number(s.avg_rating||0);if(rating){ratingSum+=rating;ratingCount++;}downloads+=Number(s.download_count||0);});metricResults.textContent=String(total);metricRating.textContent=ratingCount?(ratingSum/ratingCount).toFixed(1):'0.0';metricDownloads.textContent=String(downloads);insightCatalogValue.textContent=total+' '+t('skillsUnit');insightRefreshValue.textContent=t('justNow');}
function applyI18n(){document.title=t('title');pageTitle.textContent=t('title');brandSub.textContent=t('brandSub');subtitle.textContent=t('subtitle');userLink.textContent=t('userLink');heroEyebrow.textContent=t('heroEyebrow');heroTitle.textContent=t('heroTitle');tabSearch.textContent=t('tabSearch');tabRating.textContent=t('tabRating');tabDownloads.textContent=t('tabDownloads');tabNewest.textContent=t('tabNewest');searchInput.placeholder=t('searchPlaceholder');searchInput.setAttribute('aria-label',t('searchPlaceholder'));searchBtn.textContent=t('search');metricResultsLabel.textContent=t('metricResults');metricRatingLabel.textContent=t('metricRating');metricDownloadsLabel.textContent=t('metricDownloads');insightTitle.textContent=t('insightTitle');insightStatusLabel.textContent=t('insightStatusLabel');insightStatusValue.textContent=t('insightStatusValue');insightCatalogLabel.textContent=t('insightCatalogLabel');insightRefreshLabel.textContent=t('insightRefreshLabel');searchEmpty.textContent=t('emptySearch');ratingEmpty.textContent=t('emptyTop');downloadsEmpty.textContent=t('emptyTop');newestEmpty.textContent=t('emptyTop');rateLabel.textContent=t('rateLabel');langZh.classList.toggle('active',LANG==='zh');langEn.classList.toggle('active',LANG==='en');langZh.setAttribute('aria-pressed',LANG==='zh'?'true':'false');langEn.setAttribute('aria-pressed',LANG==='en'?'true':'false');updateSectionText();updateMetrics(currentMetricItems);}
function refreshCurrentView(){var view=activeView();if(view==='top-rating')loadTop('rating');else if(view==='top-downloads')loadTop('downloads');else if(view==='top-newest')loadTop('newest');else doSearch();}
function renderCards(containerId,emptyId,items){var c=document.getElementById(containerId),e=document.getElementById(emptyId);c.setAttribute('aria-busy','false');c.innerHTML='';if(!items.length){e.style.display='';updateMetrics([]);return;}e.style.display='none';updateMetrics(items);items.forEach(function(s){var tags=(s.tags||[]).map(function(tag){return '<span class="tag">'+esc(tag)+'</span>';}).join('');var price=s.price?String(s.price)+' '+t('credits'):t('priceFree');var date=s.created_at?fmtDate(s.created_at):'';var version=s.version?'<div class="card-version">v'+esc(s.version)+'</div>':'';var card=document.createElement('div');card.className='card';card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('aria-label',s.name?String(s.name):t('detailTitle'));card.innerHTML='<div class="card-top"><div><div class="card-name">'+esc(s.name||'-')+'</div>'+version+'</div><span class="price-pill">'+esc(price)+'</span></div>'+'<div class="card-desc">'+esc(s.description||'')+'</div>'+'<div class="card-tags">'+tags+'</div>'+'<div class="card-meta"><span>'+t('rating')+': '+Number(s.avg_rating||0).toFixed(1)+'</span><span>'+t('downloads')+': '+Number(s.download_count||0)+'</span>'+(date?'<span>'+date+'</span>':'')+'</div>';card.onclick=function(){showDetail(s)};card.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();showDetail(s);}};c.appendChild(card);});}
function showLoading(containerId,emptyId){var c=document.getElementById(containerId);c.setAttribute('aria-busy','true');c.innerHTML='';var e=document.getElementById(emptyId);e.style.display='';e.textContent=t('loading');}
async function doSearch(){showLoading('searchResults','searchEmpty');try{const r=await fetch('/api/v1/skillmarket/search?q='+encodeURIComponent(searchInput.value.trim())+'&top_n=30');if(!r.ok)throw new Error(await r.text());const data=await r.json();const list=data.results||data||[];renderCards('searchResults','searchEmpty',Array.isArray(list)?list:[]);}catch(_){searchResults.setAttribute('aria-busy','false');updateMetrics([]);searchEmpty.style.display='';searchEmpty.textContent=t('network');}}
async function loadTop(sortBy){var map={rating:['ratingList','ratingEmpty'],downloads:['downloadsList','downloadsEmpty'],newest:['newestList','newestEmpty']};showLoading(map[sortBy][0],map[sortBy][1]);try{const r=await fetch('/api/v1/skillmarket/top?sort='+sortBy+'&limit=20');if(!r.ok)throw new Error(await r.text());const data=await r.json();const list=data.entries||data||[];renderCards(map[sortBy][0],map[sortBy][1],Array.isArray(list)?list:[]);}catch(_){updateMetrics([]);document.getElementById(map[sortBy][0]).setAttribute('aria-busy','false');document.getElementById(map[sortBy][1]).style.display='';document.getElementById(map[sortBy][1]).textContent=t('network');}}
function showDetail(s){detailReturnFocus=document.activeElement;detailName.textContent=s.name||'-';detailDesc.textContent=s.description||'';detailTags.innerHTML=(s.tags||[]).map(function(tag){return '<span class="tag">'+esc(tag)+'</span>';}).join('');detailRatingWrap.textContent=t('rating')+': '+Number(s.avg_rating||0).toFixed(1);detailDownloadsWrap.textContent=t('downloads')+': '+Number(s.download_count||0);detailPriceWrap.textContent=(s.price?String(s.price)+' '+t('credits'):t('priceFree'));detailVersionWrap.textContent=t('version')+': '+(s.version||'-');detailDateWrap.textContent=t('uploaded')+': '+(s.created_at?fmtDate(s.created_at):'-');if(s.status){detailStatusWrap.style.display='';detailStatusWrap.textContent=t('status')+': '+statusText(s.status);}else{detailStatusWrap.style.display='none';}ratingRow.innerHTML='';[-2,-1,0,1,2].forEach(function(score){var btn=document.createElement('button');btn.type='button';btn.textContent=score>0?('+'+score):String(score);btn.onclick=function(){submitRating(s.id,score);};ratingRow.appendChild(btn);});rateMsg.textContent='';detailOverlay.classList.add('active');detailOverlay.setAttribute('aria-hidden','false');detailClose.focus();}
function closeDetail(){var target=detailReturnFocus;detailOverlay.classList.remove('active');detailOverlay.setAttribute('aria-hidden','true');detailReturnFocus=null;if(target&&typeof target.focus==='function')target.focus();}
detailOverlay.addEventListener('click',function(e){if(e.target===detailOverlay)closeDetail();});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail();});
async function submitRating(skillID,score){var email=window.prompt(t('rateNeedEmail'));if(!email)return;try{const r=await fetch('/api/v1/skillmarket/'+skillID+'/rate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,score:score})});if(!r.ok){rateMsg.textContent=await r.text();return;}rateMsg.textContent=t('rateOk');Array.prototype.forEach.call(document.querySelectorAll('#ratingRow button'),function(btn){btn.classList.toggle('selected',btn.textContent===(score>0?('+'+score):String(score)));});}catch(_){rateMsg.textContent=t('network');}}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(tab){tab.addEventListener('click',function(){Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(btn){var active=btn===tab;btn.classList.toggle('active',active);btn.setAttribute('aria-selected',active?'true':'false');});['search','top-rating','top-downloads','top-newest'].forEach(function(id){document.getElementById('view-'+id).style.display=id===tab.dataset.view?'':'none';});updateSectionText();if(tab.dataset.view==='top-rating')loadTop('rating');if(tab.dataset.view==='top-downloads')loadTop('downloads');if(tab.dataset.view==='top-newest')loadTop('newest');if(tab.dataset.view==='search')doSearch();});});
searchInput.addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
applyI18n();doSearch();

// ─── MCP Marketplace Tab ──────────────────────────────────────────────────
Object.assign(I18N, {
  mcpSectionTitle:{zh:'MCP \u80fd\u529b\u5305',en:'MCP Capabilities'},
  mcpSectionNote:{zh:'\u53ef\u4f9b\u5ba2\u6237\u7aef\u5b89\u88c5\u7684 MCP \u670d\u52a1\u5668\u80fd\u529b\u5305\u3002',en:'MCP server capability packages available for client installation.'},
  mcpMarketEmpty:{zh:'\u6682\u65e0 MCP \u80fd\u529b\u5305\u3002',en:'No MCP capabilities available.'},
  mcpFree:{zh:'\u514d\u8d39',en:'Free'},
  mcpInstall:{zh:'\u5b89\u88c5',en:'Install'}
});

function switchCapTab(tab) {
  var skills = document.getElementById('capTabSkills');
  var mcp = document.getElementById('capTabMCP');
  var activeStyle = 'height:38px;padding:0 14px;border:1px solid #172033;border-radius:var(--radius);background:#172033;color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer';
  var inactiveStyle = 'height:38px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--muted);font:inherit;font-size:15px;font-weight:800;cursor:pointer';
  skills.style.cssText = tab === 'skills' ? activeStyle : inactiveStyle;
  mcp.style.cssText = tab === 'mcp' ? activeStyle : inactiveStyle;
  skills.setAttribute('aria-selected', tab === 'skills' ? 'true' : 'false');
  mcp.setAttribute('aria-selected', tab === 'mcp' ? 'true' : 'false');
  document.getElementById('capSkillsView').style.display = tab === 'skills' ? '' : 'none';
  document.getElementById('capMCPView').style.display = tab === 'mcp' ? '' : 'none';
  if (tab === 'mcp') loadMCPMarket();
}

function applyMCPi18n() {
  var el = document.getElementById('mcpSectionTitle');
  if (el) el.textContent = (I18N.mcpSectionTitle && I18N.mcpSectionTitle[LANG]) || 'MCP Capabilities';
  var note = document.getElementById('mcpSectionNote');
  if (note) note.textContent = (I18N.mcpSectionNote && I18N.mcpSectionNote[LANG]) || '';
}

var _origApplyI18n = applyI18n;
applyI18n = function() { _origApplyI18n(); applyMCPi18n(); };

async function loadMCPMarket() {
  var list = document.getElementById('mcpMarketList');
  var empty = document.getElementById('mcpMarketEmpty');
  list.setAttribute('aria-busy','true');
  list.innerHTML = '';
  empty.style.display = 'none';
  try {
    var r = await fetch('/api/capability-market/mcp');
    if (!r.ok) throw new Error(await r.text());
    var data = await r.json();
    var items = data.items || [];
    if (!items.length) { empty.style.display = ''; empty.textContent = (I18N.mcpMarketEmpty && I18N.mcpMarketEmpty[LANG]) || 'No MCP capabilities.'; return; }
    items.forEach(function(item) {
      var price = (item.pricing && item.pricing.mode && item.pricing.mode !== 'free') ? item.pricing.mode : ((I18N.mcpFree && I18N.mcpFree[LANG]) || 'Free');
      var transport = (item.mcp && item.mcp.transport) || 'stdio';
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="card-top"><div><div class="card-name">' + esc(item.display_name || item.capability_id) + '</div><div class="card-version">' + esc(item.version || '') + '</div></div><span class="price-pill">' + esc(price) + '</span></div>' +
        '<div class="card-desc">' + esc(item.description || '') + '</div>' +
        '<div class="card-tags"><span class="tag">MCP</span><span class="tag">' + esc(transport) + '</span></div>' +
        '<div class="card-meta"><span>' + esc(item.publisher || '') + '</span></div>';
      list.appendChild(card);
    });
  } catch(e) { empty.style.display = ''; empty.textContent = String(e.message || e); }
  finally { list.setAttribute('aria-busy','false'); }
}

applyMCPi18n();

</script>
