    const GOSSIP_TEXT={"en":{"comments":"Comments","lock":"Lock","unlock":"Unlock","delete":"Delete","noComments":"No comments","postDeleted":"Post deleted","postLocked":"Post locked","postUnlocked":"Post unlocked","commentDeleted":"Comment deleted","loadFailed":"Load gossip failed: {error}","loadCommentsFailed":"Load comments failed: {error}","locked":"Locked","open":"Open","machine":"Machine","email":"Email","score":"Score","votes":"Votes","unknownUser":"Unknown","na":"n/a","page":"Page {current} / {total}"},"zh":{"comments":"\u8bc4\u8bba","lock":"\u9501\u5b9a","unlock":"\u89e3\u9501","delete":"\u5220\u9664","noComments":"\u6682\u65e0\u8bc4\u8bba","postDeleted":"\u5df2\u5220\u9664\u5410\u69fd","postLocked":"\u5df2\u9501\u5b9a\u5410\u69fd","postUnlocked":"\u5df2\u89e3\u9501\u5410\u69fd","commentDeleted":"\u5df2\u5220\u9664\u8bc4\u8bba","loadFailed":"\u52a0\u8f7d\u5410\u69fd\u5217\u8868\u5931\u8d25\uff1a{error}","loadCommentsFailed":"\u52a0\u8f7d\u8bc4\u8bba\u5931\u8d25\uff1a{error}","locked":"\u5df2\u9501\u5b9a","open":"\u5f00\u653e","machine":"\u673a\u5668","email":"\u90ae\u7bb1","score":"\u5206\u503c","votes":"\u6295\u7968","unknownUser":"\u672a\u77e5\u7528\u6237","na":"\u65e0","page":"\u7b2c {current} / {total} \u9875"}};
    const gtr=(key,vars={})=>((GOSSIP_TEXT[currentLang]||GOSSIP_TEXT.en)[key]||GOSSIP_TEXT.en[key]||key).replace(/\{(\w+)\}/g,(_,n)=>vars[n]??'');
    let gossipPage=1;const gossipPageSize=100;const gossipCommentPageSize=100;const gossipCommentPages={};
    async function loadGossipList(page){if(page)gossipPage=page;try{const data=await api('/api/admin/gossip?page='+gossipPage);const posts=data.posts||[];const total=data.total||0;const root=document.getElementById('gossipList');const totalPages=Math.max(1,Math.ceil(total/gossipPageSize));if(!posts.length){if(total>0&&gossipPage>totalPages){gossipPage=totalPages;return loadGossipList(gossipPage)}root.innerHTML='<div class="hint">'+tr('gossipEmpty')+'</div>';document.getElementById('gossipPager').style.display='none';return}root.innerHTML=posts.map(p=>{const nickname=escapeHtml(p.nickname||gtr('unknownUser'));const category=escapeHtml(p.category||'-');const content=escapeHtml(p.content||'');const machine=escapeHtml(p.machine_id||gtr('na'));const email=escapeHtml(p.user_email||gtr('na'));const createdAt=escapeHtml(p.created_at||'-');const score=Number(p.score||0);const votes=Number(p.votes||0);return `<div class="item gossip-card"><div class="item-head"><div class="gossip-title"><span class="item-title gossip-name" title="${nickname}">${nickname}</span><span class="badge ${p.locked?'warn':'info'}">${p.locked?gtr('locked'):gtr('open')}</span></div><span class="badge info">${category}</span></div><div class="item-meta gossip-text" title="${content}">${content||'-'}</div><div class="item-meta mono gossip-meta" style="font-size:11px"><span>${gtr('machine')}: ${machine}</span><span>${gtr('email')}: ${email}</span><span>${gtr('score')}: ${score}</span><span>${gtr('votes')}: ${votes}</span></div><div class="item-meta mono gossip-detail" style="font-size:10px" title="${createdAt}">${createdAt}</div><div class="actions"><button class="btn-ghost" onclick="loadGossipComments('${p.id}')">${gtr('comments')}</button><button class="btn-secondary" onclick="toggleGossipLock('${p.id}',${!p.locked})">${p.locked?gtr('unlock'):gtr('lock')}</button><button class="btn-danger" onclick="deleteGossipPost('${p.id}')">${gtr('delete')}</button></div><div id="gossip-comments-${p.id}" class="list gossip-comment-list"></div></div>`}).join('');document.getElementById('gossipPager').style.display='flex';document.getElementById('gossipPageInfo').textContent=gtr('page',{current:gossipPage,total:totalPages});document.getElementById('gossipPrevBtn').disabled=gossipPage<=1;document.getElementById('gossipNextBtn').disabled=gossipPage>=totalPages}catch(err){setOutput(gtr('loadFailed',{error:err.message}))}}
    function changeGossipPage(delta){loadGossipList(gossipPage+delta)}
    async function deleteGossipPost(id){try{await api('/api/admin/gossip',{method:'DELETE',body:JSON.stringify({id})});showToast(gtr('postDeleted'),'success');loadGossipList()}catch(err){showToast(err.message,'error')}}
    async function toggleGossipLock(id,locked){try{await api('/api/admin/gossip/lock',{method:'POST',body:JSON.stringify({id,locked})});showToast(locked?gtr('postLocked'):gtr('postUnlocked'),'success');loadGossipList()}catch(err){showToast(err.message,'error')}}
    function renderGossipCommentPager(postId,currentPage,totalPages){if(totalPages<=1)return '';return `<div class="pager" style="margin-top:10px;padding:0"><div class="pager-meta">${gtr('page',{current:currentPage,total:totalPages})}</div><div class="pager-actions"><button class="btn-ghost" style="height:30px;font-size:12px" onclick="changeGossipCommentPage('${postId}',-1)" ${currentPage<=1?'disabled':''}>&larr;</button><button class="btn-ghost" style="height:30px;font-size:12px" onclick="changeGossipCommentPage('${postId}',1)" ${currentPage>=totalPages?'disabled':''}>&rarr;</button></div></div>`;}
    async function loadGossipComments(postId,page){try{const root=document.getElementById('gossip-comments-'+postId);if(!root)return;const currentPage=page||gossipCommentPages[postId]||1;gossipCommentPages[postId]=currentPage;const data=await api('/api/admin/gossip/comments?post_id='+encodeURIComponent(postId)+'&page='+currentPage);const comments=data.comments||[];const total=Number(data.total||0);const totalPages=Math.max(1,Math.ceil(total/gossipCommentPageSize));if(!comments.length&&total>0&&currentPage>totalPages){gossipCommentPages[postId]=totalPages;return loadGossipComments(postId,totalPages)}if(!comments.length){root.innerHTML='<div class="hint" style="padding:8px">'+gtr('noComments')+'</div>';return}const html=comments.map(c=>{const content=escapeHtml(c.content||'');const nickname=escapeHtml(c.nickname||gtr('unknownUser'));const machine=escapeHtml(c.machine_id||gtr('na'));const email=escapeHtml(c.user_email||gtr('na'));const createdAt=escapeHtml(c.created_at||'-');const rating=c.rating?'<span class="badge info">&#9733;'+escapeHtml(String(c.rating))+'</span>':'';return `<div class="item gossip-comment-card"><div class="item-meta" title="${content}">${content||'-'} ${rating}</div><div class="mono gossip-detail" style="font-size:11px" title="${nickname} | ${machine} | ${email} | ${createdAt}">${nickname} | ${machine} | ${email} | ${createdAt}</div><div class="actions"><button class="btn-danger" style="height:28px;font-size:11px" onclick="deleteGossipComment('${c.id}','${c.post_id}')">${gtr('delete')}</button></div></div>`}).join('');root.innerHTML=html+renderGossipCommentPager(postId,currentPage,totalPages)}catch(err){setOutput(gtr('loadCommentsFailed',{error:err.message}))}}
    function changeGossipCommentPage(postId,delta){const next=(gossipCommentPages[postId]||1)+delta;if(next<1)return;loadGossipComments(postId,next)}
    async function deleteGossipComment(id,postId){try{await api('/api/admin/gossip/comments',{method:'DELETE',body:JSON.stringify({id,post_id:postId})});showToast(gtr('commentDeleted'),'success');loadGossipComments(postId,gossipCommentPages[postId]||1)}catch(err){showToast(err.message,'error')}}
    function escapeHtml(s){if(!s)return'';const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(s).replace(/[&<>"']/g,c=>m[c])}
    // SkillHub Management
    // Import from URL
    function applyImportI18n(){
      document.getElementById('importTitle').textContent=shtr('importTitle');
      document.getElementById('importDesc').textContent=shtr('importDesc');
      document.getElementById('importUrlInput').placeholder=shtr('importPlaceholder');
      document.getElementById('importBtn').textContent=shtr('import');
    }
    async function importFromURL(){
      const url=document.getElementById('importUrlInput').value.trim();
      if(!url){showToast(shtr('enterUrl'),'error');return}
      const btn=document.getElementById('importBtn');
      const resultEl=document.getElementById('importResult');
      btn.disabled=true;btn.textContent=shtr('importing');
      resultEl.textContent='';
      try{
        const data=await api('/api/admin/skillhub/import-url',{method:'POST',body:JSON.stringify({url})});
        const msgs=[];
        if(data.published&&data.published.length)msgs.push(shtr('importedPrefix')+data.published.join(', '));
        if(data.errors&&data.errors.length)msgs.push(shtr('errorsPrefix')+data.errors.join('; '));
        if(!data.published||!data.published.length)msgs.push(shtr('noImportable'));
        resultEl.textContent=msgs.join(' | ');
        if(data.published&&data.published.length){showToast(shtr('importedCount',{count:data.published.length}),'success');loadSkillHubList()}
      }catch(err){resultEl.textContent=err.message;showToast(err.message,'error')}
      finally{btn.disabled=false;btn.textContent=shtr('import')}
    }
    const SKILLHUB_TEXT={"en":{"importTitle":"Import Skill from URL","importDesc":"Enter a GitHub repo URL or raw skill.yaml URL to import free Skills.","importPlaceholder":"https://github.com/user/repo or raw skill.yaml URL","import":"Import","importing":"Importing...","enterUrl":"Please enter a URL","importedPrefix":"Imported: ","errorsPrefix":"Errors: ","noImportable":"No importable skills found","importedCount":"Imported {count} skill(s)","visible":"Visible","hidden":"Hidden","noDescription":"No description","show":"Show","hide":"Hide","delete":"Delete","visibilityUpdated":"Visibility updated","deleteConfirm":"Are you sure you want to delete skill \"{name}\"? This cannot be undone.","deleted":"Skill deleted","loadFailed":"Load SkillHub failed: {error}","page":"Page {current} / {total}","source":"Source","downloads":"Downloads","rating":"Rating","updated":"Updated","trust":"Trust","unknown":"Unknown"},"zh":{"importTitle":"? URL ?? Skill","importDesc":"?? GitHub ??????? skill.yaml ?????????? Skill?","importPlaceholder":"https://github.com/user/repo ??? skill.yaml ??","import":"??","importing":"???...","enterUrl":"??? URL","importedPrefix":"????","errorsPrefix":"???","noImportable":"??????? Skill","importedCount":"???? {count} ? Skill","visible":"??","hidden":"??","noDescription":"????","show":"??","hide":"??","delete":"??","visibilityUpdated":"??????","deleteConfirm":"????? Skill?{name}???????????","deleted":"???","loadFailed":"?? SkillHub ???{error}","page":"? {current} / {total} ?","source":"??","downloads":"??","rating":"??","updated":"??","trust":"???","unknown":"??"}};
    const shtr=(key,vars={})=>((SKILLHUB_TEXT[currentLang]||SKILLHUB_TEXT.en)[key]||SKILLHUB_TEXT.en[key]||key).replace(/\{(\w+)\}/g,(_,n)=>vars[n]??'');
    function applySkillHubI18n(){
      const set=(id,value)=>{const el=document.getElementById(id); if(el) el.textContent=value;};
      set('importTitle',shtr('importTitle'));
      set('importDesc',shtr('importDesc'));
      set('importBtn',shtr('import'));
      const input=document.getElementById('importUrlInput'); if(input) input.placeholder=shtr('importPlaceholder');
    }
        let skillhubPage=1;const skillhubPageSize=20;let _skillhubSkills=[];
    function fmtDate(d){if(!d)return'-';try{const t=new Date(d);if(isNaN(t))return d;return t.toLocaleDateString(currentLang==='zh'?'zh-CN':'en-US',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+t.toLocaleTimeString(currentLang==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit'})}catch(e){return d}}
    async function loadSkillHubList(page){if(page)skillhubPage=page;try{const data=await api('/api/admin/skillhub/list?page='+skillhubPage+'&page_size='+skillhubPageSize);const skills=data.skills||[];const total=data.total||0;_skillhubSkills=skills;const root=document.getElementById('skillhubList');const totalPages=Math.max(1,Math.ceil(total/skillhubPageSize));if(!skills.length){if(total>0&&skillhubPage>totalPages){skillhubPage=totalPages;return loadSkillHubList(skillhubPage)}root.innerHTML='<div class=\"hint\">'+tr('skillhubEmpty')+'</div>';document.getElementById('skillhubPager').style.display='none';return}root.innerHTML=skills.map((s,idx)=>{const srcTag=s.source_url?`<div class=\"item-meta mono skillhub-source\" style=\"font-size:11px\" title=\"${escapeHtml(s.source_url)}\">${shtr('source')}: ${escapeHtml(s.source_url)}</div>`:'';const verTag=s.version?`<span class=\"badge info\" style=\"margin-left:6px;font-size:10px\">v${escapeHtml(s.version)}</span>`:'';const description=escapeHtml(s.description||shtr('noDescription'));const trustLevel=escapeHtml(s.trust_level||shtr('unknown'));const uploadDate=s.created_at?fmtDate(s.created_at):'-';const updateDate=s.updated_at&&s.updated_at!==s.created_at?fmtDate(s.updated_at):'';const dateLine=updateDate?`${uploadDate} | ${shtr('updated')}: ${updateDate}`:uploadDate;return `<div class=\"item skillhub-card\"><div class=\"item-head\"><div class=\"item-title skillhub-title\" style=\"font-size:14px\" title=\"${escapeHtml(s.name)}\">${escapeHtml(s.name)}${verTag}</div><span class=\"badge ${s.visible===false?'warn':'ok'}\" style=\"font-size:10px;padding:4px 8px\">${s.visible===false?shtr('hidden'):shtr('visible')}</span></div><div class=\"item-meta skillhub-desc\" style=\"font-size:12px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\" title=\"${description}\">${description}</div>${srcTag}<div class=\"item-meta mono skillhub-stats\" style=\"font-size:11px\"><span>${shtr('downloads')}: ${s.downloads||0}</span><span>${shtr('rating')}: ${(s.avg_rating||0).toFixed(1)} (${s.rating_count||0})</span><span class=\"badge info\" style=\"font-size:9px;padding:2px 6px\" title=\"${shtr('trust')}: ${trustLevel}\">${trustLevel}</span></div><div class=\"item-meta mono skillhub-date\" style=\"font-size:10px\" title=\"${escapeHtml(dateLine)}\">${escapeHtml(dateLine)}</div><div class=\"actions\" style=\"gap:6px\"><button class=\"btn-secondary\" style=\"height:30px;font-size:11px;min-width:auto;padding:0 10px\" onclick=\"skillhubSetVisibility('${s.id}',${s.visible===false})\">${s.visible===false?shtr('show'):shtr('hide')}</button><button class=\"btn-danger\" style=\"height:30px;font-size:11px;min-width:auto;padding:0 10px\" onclick=\"skillhubDelete(${idx})\">${shtr('delete')}</button></div></div>`}).join('');document.getElementById('skillhubPager').style.display='flex';document.getElementById('skillhubPageInfo').textContent=shtr('page',{current:skillhubPage,total:totalPages});document.getElementById('skillhubPrevBtn').disabled=skillhubPage<=1;document.getElementById('skillhubNextBtn').disabled=skillhubPage>=totalPages}catch(err){setOutput(shtr('loadFailed',{error:err.message}))}}
    function changeSkillHubPage(delta){loadSkillHubList(skillhubPage+delta)}
    async function skillhubSetVisibility(id,visible){try{await api('/api/admin/skillhub/visibility',{method:'POST',body:JSON.stringify({id,visible})});showToast(shtr('visibilityUpdated'),'success');loadSkillHubList()}catch(err){showToast(err.message,'error')}}
    async function skillhubDelete(idx){const s=_skillhubSkills[idx];if(!s)return;const msg=shtr('deleteConfirm',{name:s.name});if(!confirm(msg))return;try{await api('/api/admin/skillhub/'+encodeURIComponent(s.id),{method:'DELETE'});showToast(shtr('deleted'),'success');loadSkillHubList()}catch(err){showToast(err.message,'error')}}
    const MOD_TEXT={en:{title:'LLM Content Moderation',desc:'Configure LLM-based automatic content moderation for the Gossip Wall. When enabled, new gossip posts are checked by the LLM and flagged if inappropriate.',enabled:'Enable Moderation',url:'LLM API URL',model:'Model Name',apiKey:'API Key',urlPlaceholder:'https://api.openai.com/v1',modelPlaceholder:'gpt-4o-mini',apiKeyPlaceholder:'sk-...',testLabel:'Test Content',testPlaceholder:'Enter test content...',emptyTestContent:'Enter test content',save:'Save Moderation Config',test:'Test',saved:'Moderation config saved.',saveFailed:'Save moderation config failed: {error}',loadFailed:'Load moderation config failed: {error}',testResult:'Result: {result}',testFailed:'Test failed: {error}',filterAll:'All Posts',filterFlagged:'Flagged Only',flag:'Flag',unflag:'Unflag',flagged:'Flagged',postFlagged:'Post flagged.',postUnflagged:'Post unflagged.'},zh:{title:'\u004c\u004c\u004d \u5185\u5bb9\u5ba1\u6838',desc:'\u914d\u7f6e\u57fa\u4e8e LLM \u7684\u5410\u69fd\u5899\u81ea\u52a8\u5185\u5bb9\u5ba1\u6838\u3002\u5f00\u542f\u540e\uff0c\u65b0\u53d1\u5e03\u7684\u5410\u69fd\u4f1a\u7ecf\u8fc7 LLM \u68c0\u67e5\uff0c\u4e0d\u5408\u89c4\u5185\u5bb9\u81ea\u52a8\u6807\u8bb0\u4e3a\u5ba1\u6838\u72b6\u6001\uff0c\u4e0d\u5728\u524d\u53f0\u5c55\u793a\u3002',enabled:'\u542f\u7528\u5ba1\u6838',url:'LLM API \u5730\u5740',model:'\u6a21\u578b\u540d\u79f0',apiKey:'API Key',urlPlaceholder:'https://api.openai.com/v1',modelPlaceholder:'gpt-4o-mini',apiKeyPlaceholder:'sk-...',testLabel:'\u6d4b\u8bd5\u5185\u5bb9',testPlaceholder:'\u8bf7\u8f93\u5165\u6d4b\u8bd5\u5185\u5bb9...',emptyTestContent:'\u8bf7\u8f93\u5165\u6d4b\u8bd5\u5185\u5bb9',save:'\u4fdd\u5b58\u5ba1\u6838\u914d\u7f6e',test:'\u6d4b\u8bd5',saved:'\u5ba1\u6838\u914d\u7f6e\u5df2\u4fdd\u5b58\u3002',saveFailed:'\u4fdd\u5b58\u5ba1\u6838\u914d\u7f6e\u5931\u8d25\uff1a{error}',loadFailed:'\u52a0\u8f7d\u5ba1\u6838\u914d\u7f6e\u5931\u8d25\uff1a{error}',testResult:'\u7ed3\u679c\uff1a{result}',testFailed:'\u6d4b\u8bd5\u5931\u8d25\uff1a{error}',filterAll:'\u5168\u90e8\u5e16\u5b50',filterFlagged:'\u4ec5\u770b\u5ba1\u6838',flag:'\u6807\u8bb0\u5ba1\u6838',unflag:'\u53d6\u6d88\u5ba1\u6838',flagged:'\u5df2\u5ba1\u6838',postFlagged:'\u5e16\u5b50\u5df2\u6807\u8bb0\u4e3a\u5ba1\u6838\u3002',postUnflagged:'\u5e16\u5b50\u5df2\u53d6\u6d88\u5ba1\u6838\u6807\u8bb0\u3002'}};
        const mtr=key=>(MOD_TEXT[currentLang]||MOD_TEXT.en)[key]||MOD_TEXT.en[key]||key;
    let gossipFilter='';
    function setGossipFilter(f){gossipFilter=f;document.getElementById('gossipFilterAll').className=f===''?'btn-secondary':'btn-ghost';document.getElementById('gossipFilterFlagged').className=f==='flagged'?'btn-secondary':'btn-ghost';gossipPage=1;loadGossipList()}
    // Override loadGossipList to support filter
    const _origLoadGossipList=loadGossipList;
    loadGossipList=async function(page){if(page)gossipPage=page;try{const filterParam=gossipFilter?'&filter='+gossipFilter:'';const data=await api('/api/admin/gossip?page='+gossipPage+filterParam);const posts=data.posts||[];const total=data.total||0;const root=document.getElementById('gossipList');const totalPages=Math.max(1,Math.ceil(total/gossipPageSize));if(!posts.length){if(total>0&&gossipPage>totalPages){gossipPage=totalPages;return loadGossipList(gossipPage)}root.innerHTML='<div class="hint">'+tr('gossipEmpty')+'</div>';document.getElementById('gossipPager').style.display='none';return}root.innerHTML=posts.map(p=>{const flagBadge=p.flagged?` <span class="badge danger">${mtr('flagged')}</span>`:'';const nickname=escapeHtml(p.nickname||gtr('unknownUser'));const category=escapeHtml(p.category||'-');const content=escapeHtml(p.content||'');const machine=escapeHtml(p.machine_id||gtr('na'));const email=escapeHtml(p.user_email||gtr('na'));const createdAt=escapeHtml(p.created_at||'-');return `<div class="item gossip-card" style="${p.flagged?'border-left:3px solid var(--danger);':''}"><div class="item-head"><div class="gossip-title"><span class="item-title gossip-name" title="${nickname}">${nickname}</span><span class="badge ${p.locked?'warn':'info'}">${p.locked?gtr('locked'):gtr('open')}</span>${flagBadge}</div><span class="badge info">${category}</span></div><div class="item-meta gossip-text" title="${content}">${content||'-'}</div><div class="item-meta mono gossip-meta" style="font-size:11px"><span>ID: ${escapeHtml(p.id)}</span><span>${gtr('machine')}: ${machine}</span><span>${gtr('email')}: ${email}</span><span>${gtr('score')}: ${Number(p.score||0)}</span><span>${gtr('votes')}: ${Number(p.votes||0)}</span></div><div class="item-meta mono gossip-detail" style="font-size:10px" title="${createdAt}">${createdAt}</div><div class="actions"><button class="btn-ghost" onclick="loadGossipComments('${p.id}')">${gtr('comments')}</button><button class="btn-secondary" onclick="toggleGossipLock('${p.id}',${!p.locked})">${p.locked?gtr('unlock'):gtr('lock')}</button><button class="btn-${p.flagged?'secondary':'danger'}" onclick="toggleGossipFlag('${p.id}',${!p.flagged})">${p.flagged?mtr('unflag'):mtr('flag')}</button><button class="btn-danger" onclick="deleteGossipPost('${p.id}')">${gtr('delete')}</button></div><div id="gossip-comments-${p.id}" class="list gossip-comment-list"></div></div>`}).join('');document.getElementById('gossipPager').style.display='flex';document.getElementById('gossipPageInfo').textContent=gtr('page',{current:gossipPage,total:totalPages});document.getElementById('gossipPrevBtn').disabled=gossipPage<=1;document.getElementById('gossipNextBtn').disabled=gossipPage>=totalPages}catch(err){setOutput(gtr('loadFailed',{error:err.message}))}};
    async function toggleGossipFlag(id,flagged){try{await api('/api/admin/gossip/flag',{method:'POST',body:JSON.stringify({id,flagged})});showToast(flagged?mtr('postFlagged'):mtr('postUnflagged'),'success');loadGossipList()}catch(err){showToast(err.message,'error')}}
    async function loadModerationConfig(){try{const data=await api('/api/admin/moderation/config');document.getElementById('moderationEnabled').checked=!!data.enabled;document.getElementById('moderationUrl').value=data.url||'';document.getElementById('moderationModel').value=data.model||'';document.getElementById('moderationApiKey').value=data.api_key||''}catch(err){setOutput(mtr('loadFailed').replace('{error}',err.message))}}

  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = smtr('saving'); }
  try {
    await api('/api/v1/admin/config/trial', {method:'PUT', body: JSON.stringify({trial_duration_days: days, auto_publish_threshold: threshold, max_uploads_per_hour: maxUploads})});
    showToast(smtr('configSaved'), 'success');
    await loadSmTrialConfig();
  } catch(err) { showToast(err.message, 'error'); }
  finally {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = previousText || smtr('save'); }
  }
}

async function loadCenterComputeProviders() {
  try {
    var data = await api('/api/compute/providers');
    var list = Array.isArray(data) ? data : (data.providers || []);
    var sourceBadge = document.getElementById('ccSourceBadge');
    sourceBadge.textContent = ((data.source || 'cloud') === 'cloud' ? ctr('sourceCloud') : (data.source || 'cloud')) + ' ' + ctr('modeSuffix');
    sourceBadge.dataset.loaded = '1';
    var syncStatus = document.getElementById('ccSyncStatus');
    syncStatus.textContent = ctr('syncStatus', { value: data.last_sync || ctr('syncUnknown') });
    syncStatus.dataset.loaded = '1';
    var providerList = document.getElementById('ccProviderList');
    providerList.dataset.loaded = '1';
    if (!list.length) { providerList.innerHTML = '<div class="hint">' + ctr('emptyProviders') + '</div>'; return; }
    var html = '';
    list.forEach(function(p) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:var(--soft);border:1px solid rgba(20,33,54,.08);margin-bottom:8px">';
      html += '<div><strong>' + _cesc(p.name) + '</strong> <span class="badge info" style="font-size:10px">' + _cesc(p.protocol) + '</span> <span style="color:var(--muted);font-size:12px">' + _cesc(p.model||'') + '</span></div>';
      html += '<span class="badge ' + (p.enabled?'ok':'warn') + '">' + (p.enabled?ctr('enabled'):ctr('disabled')) + '</span>';
      html += '</div>';
    });
    providerList.innerHTML = html;
  } catch(e) {
    var providerList = document.getElementById('ccProviderList');
    providerList.dataset.loaded = '1';
    providerList.innerHTML = '<div class="hint">' + ctr('loadFailed', { error: _cesc(e.message) }) + '</div>';
  }
}
async function loadCenterCostStats() {
  var period = document.getElementById('ccPeriod').value;
  var start = document.getElementById('ccStart').value;
  var end = document.getElementById('ccEnd').value;
  var url = '/api/compute/cost/diworkers?period=' + period;
  if (start) url += '&start=' + start;
  if (end) url += '&end=' + end;
  try {
    var data = await api(url);
    var summaries = data.summaries || [];
    var costArea = document.getElementById('ccCostArea');
    costArea.dataset.loaded = '1';
    if (!summaries.length) { costArea.innerHTML = '<div class="hint">' + ctr('noData') + '</div>'; return; }
    var html = '<div class="list" style="gap:8px">';
    summaries.forEach(function(s) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid rgba(20,33,54,.08)">';
      html += '<div><strong>' + _cesc(s.diworker_id) + '</strong> <span style="color:var(--muted);font-size:12px">' + _cesc(s.provider_name) + ' / ' + _cesc(s.model) + '</span></div>';
      html += '<div style="text-align:right"><div style="font-weight:700">' + ctr('totalCost') + ': ' + (s.total_cost||0).toFixed(4) + '</div><div style="font-size:11px;color:var(--muted)">' + _cfmt(s.total_tokens) + ' tokens</div></div>';
      html += '</div>';
    });
    html += '</div>';
    costArea.innerHTML = html;
  } catch(e) {
    var costArea = document.getElementById('ccCostArea');
    costArea.dataset.loaded = '1';
    costArea.innerHTML = '<div class="hint">' + ctr('queryFailed', { error: _cesc(e.message) }) + '</div>';
  }
}
function _cesc(s) { var d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function _cfmt(n) { return n ? n.toLocaleString() : '0'; }
