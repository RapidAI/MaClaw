        'status.409':{en:'You already have this expert, or the submission conflicts with an existing version.',zh:'该专家已获取，或提交内容与已有版本冲突。',mn:'Энэ шинжээчийг аль хэдийн авсан, эсвэл илгээлт байгаа хувилбартай зөрчилдөж байна.'},
        'status.413':{en:'The expert pack is larger than the platform allows.',zh:'专家包超过平台允许的大小。',mn:'Шинжээчийн багц платформын зөвшөөрсөн хэмжээнээс их байна.'},
        'status.429':{en:'Too many requests. Try again later.',zh:'操作过于频繁，请稍后再试。',mn:'Хэт олон үйлдэл. Дараа дахин оролдоно уу.'},
        'status.fail':{en:'Request failed. Try again later.',zh:'请求失败，请稍后重试。',mn:'Хүсэлт амжилтгүй. Дараа дахин оролдоно уу.'}
      };
      function resolveStoreLang(storageKey){
        var params=new URLSearchParams(location.search);
        var queryLang=params.get('lang');
        var saved=null;
        try{saved=localStorage.getItem(storageKey);}catch(e){}
        if(queryLang!=null&&String(queryLang).trim()!=='') return window.HubCenterI18n.normalizeHubLang(queryLang);
        return window.HubCenterI18n.detectHubLang(navigator.languages, saved);
      }
      var LANG=window.__hubExpertLang;
      if(window.HubCenterI18n&&LANG!=='en'&&LANG!=='zh'&&LANG!=='mn') LANG=resolveStoreLang(STORE_KEY);
      function tr(key,vars){
        if(!window.HubCenterI18n) return '';
        var value=window.HubCenterI18n.pick(COPY[key], LANG);
        var s=value==null?'':String(value);
        if(!vars) return s;
        return s.replace(/\{(\w+)\}/g,function(_,n){return vars[n]!=null?String(vars[n]):'';});
      }
      function applyI18n(){
        if(!window.HubCenterI18n) return;
        document.documentElement.lang=window.HubCenterI18n.htmlLang(LANG);
        document.documentElement.setAttribute('data-hub-lang', LANG);
        document.title=tr('meta.title');
        var desc=document.querySelector('meta[name="description"]');
        if(desc) desc.setAttribute('content', tr('meta.desc'));
        document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=tr(el.getAttribute('data-i18n'));});
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.setAttribute('placeholder', tr(el.getAttribute('data-i18n-placeholder')));});
        document.querySelectorAll('[data-i18n-aria]').forEach(function(el){el.setAttribute('aria-label', tr(el.getAttribute('data-i18n-aria')));});
        document.querySelectorAll('.lang-switch button').forEach(function(btn){
          var on=btn.getAttribute('data-lang')===LANG;
          btn.setAttribute('aria-pressed', on?'true':'false');
        });
      }
      function setStoreLang(lang){
        if(!window.HubCenterI18n) return;
        LANG=window.HubCenterI18n.normalizeHubLang(lang);
        try{localStorage.setItem(STORE_KEY, LANG);}catch(e){}
        applyI18n();
        var openId=currentDetail&&currentDetail.id;
        load(page);
        if(openId && !detailBackdrop.hidden) showDetail(openId);
      }
      document.querySelectorAll('.lang-switch button').forEach(function(btn){
        btn.addEventListener('click', function(){setStoreLang(btn.getAttribute('data-lang'));});
      });
      try{applyI18n();}catch(e){}
      document.documentElement.setAttribute('data-i18n-ready','1');
      function money(v){return Number(v)>0?esc(v)+' Credits':esc(tr('free'))}
      function statusText(status, fallback){var key='status.'+status;if(COPY[key]) return tr(key);return fallback||tr('status.fail')}
      function jsonResponse(response){return response.text().then(function(text){var body={};try{body=text?JSON.parse(text):{}}catch(_){ }if(!response.ok){var error=new Error(body.error||body.message||statusText(response.status));error.status=response.status;throw error}return body})}
      function render(data){var items=Array.isArray(data.experts)?data.experts:[];totalPages=Number(data.total_pages)||1;grid.innerHTML=items.length?items.map(function(x){var id=esc(x.id),action=x.owned?'<a href="/api/v1/expert-market/experts/'+id+'/download" class="market-action">'+esc(tr('download'))+'</a>':'<button type="button" class="market-action" data-buy="'+id+'">'+esc(tr('acquire'))+'</button>';return '<article class="card"><div class="card-head"><span class="icon">✦</span><div><h2>'+esc(x.name||tr('unnamed'))+'</h2><span class="version">v'+esc(x.version||'1.0.0')+'</span></div></div><p>'+esc(x.description||tr('noIntro'))+'</p><div class="meta"><span>'+esc(tr('downloads',{n:x.download_count||0}))+'</span><span class="price">'+money(x.price)+'</span></div><div class="card-actions"><button type="button" class="market-action" data-detail="'+id+'">'+esc(tr('detail.btn'))+'</button>'+action+'</div></article>'}).join(''):'<div class="state empty">'+esc(tr('empty'))+'</div>';state.hidden=true;grid.hidden=false;pager.hidden=totalPages<=1;document.getElementById('pageInfo').textContent=tr('page',{page:page,pages:totalPages});document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages}
      function load(next){page=next||1;state.textContent=tr('loading');state.hidden=false;grid.hidden=true;fetch('/api/v1/expert-market/experts?q='+encodeURIComponent(q.value.trim())+'&sort='+encodeURIComponent(sort.value)+'&page='+page+'&page_size='+size).then(jsonResponse).then(render).catch(function(e){state.hidden=false;state.textContent=tr('loadFail')+(e.message||statusText(e.status));pager.hidden=true})}
      function closeDetail(){detailBackdrop.hidden=true;currentDetail=null;document.getElementById('detailBuy').hidden=true;document.getElementById('detailDownload').hidden=true}
      function showDetail(id){detailBackdrop.hidden=false;document.getElementById('detailTitle').textContent=tr('detail.title');document.getElementById('detailMeta').textContent='';document.getElementById('detailBody').textContent=tr('detail.loading');fetch('/api/v1/expert-market/experts/'+encodeURIComponent(id)).then(jsonResponse).then(function(x){currentDetail=x;document.getElementById('detailTitle').textContent=x.name||tr('unnamed');document.getElementById('detailMeta').textContent=tr('detail.meta',{version:x.version||'1.0.0',n:x.download_count||0,price:Number(x.price)>0?x.price+' Credits':tr('free')});document.getElementById('detailBody').textContent=x.description||tr('noIntro');var download=document.getElementById('detailDownload'),buy=document.getElementById('detailBuy');if(x.owned){download.href='/api/v1/expert-market/experts/'+encodeURIComponent(x.id)+'/download';download.hidden=false}else{buy.hidden=false}}).catch(function(e){document.getElementById('detailBody').textContent=e.message||statusText(e.status)})}
      function purchase(id,button){button.disabled=true;button.textContent=tr('working');fetch('/api/v1/expert-market/experts/'+encodeURIComponent(id)+'/purchase',{method:'POST'}).then(jsonResponse).then(function(body){button.outerHTML='<a href="'+esc(body.download_url||('/api/v1/expert-market/experts/'+encodeURIComponent(id)+'/download'))+'" class="market-action">'+esc(tr('download'))+'</a>';if(currentDetail&&currentDetail.id===id){closeDetail();load(page)}}).catch(function(e){button.disabled=false;button.textContent=tr('acquire');state.hidden=false;state.textContent=e.message||statusText(e.status)})}
      grid.addEventListener('click',function(e){var detail=e.target.closest('[data-detail]'),buy=e.target.closest('[data-buy]');if(detail){showDetail(detail.getAttribute('data-detail'));return}if(buy)purchase(buy.getAttribute('data-buy'),buy)});
      document.getElementById('detailClose').onclick=closeDetail;detailBackdrop.onclick=function(e){if(e.target===detailBackdrop)closeDetail()};document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!detailBackdrop.hidden)closeDetail()});document.getElementById('detailBuy').onclick=function(){if(currentDetail)purchase(currentDetail.id,this)};
      document.getElementById('search').onclick=function(){load(1)};q.addEventListener('keydown',function(e){if(e.key==='Enter')load(1)});sort.onchange=function(){load(1)};document.getElementById('prev').onclick=function(){load(page-1)};document.getElementById('next').onclick=function(){load(page+1)};
      document.getElementById('publishForm').addEventListener('submit',function(e){e.preventDefault();var form=e.currentTarget,note=document.getElementById('publishNotice'),button=form.querySelector('button');note.className='notice';note.textContent='';button.disabled=true;button.textContent=tr('submitting');fetch('/api/v1/expert-market/experts',{method:'POST',body:new FormData(form)}).then(jsonResponse).then(function(){note.className='notice success';note.textContent=tr('submitted');form.reset();form.version.value='1';form.price.value='0';load(1)}).catch(function(err){note.className='notice error';note.textContent=err.message||statusText(err.status)}).finally(function(){button.disabled=false;button.textContent=tr('submit')})});
      load(1);
    })();
  </script>
</body>
</html>
