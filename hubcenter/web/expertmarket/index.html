<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MaClaw AI 专家市场：发现、获取和发布可复用的 AI 专家配置。">
  <title>MaClaw AI 专家市场</title>
  <link rel="stylesheet" href="/pro-ui.css">
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667386;--line:#dce3ed;--blue:#2563eb;--soft:#eaf1ff;--shadow:0 10px 26px rgba(15,23,42,.05)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfcfe,#f5f7fb);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 55px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.crumb{color:var(--muted);font-size:12px}.crumb a,.creator a,.hero a{color:var(--blue);text-decoration:none}.top a{display:inline-flex;align-items:center;min-height:35px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#4d5b6e;text-decoration:none;font-size:12px}.top a.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .hero{padding:27px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(130deg,#fff,#f2f7ff);box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;font-size:30px;font-weight:600}.hero p{max-width:700px;margin:0;color:var(--muted);font-size:13px;line-height:1.75}
    .toolbar{display:flex;gap:9px;align-items:center;margin:16px 0}.toolbar input,.toolbar select,.toolbar button{height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#4d5b6e;font:inherit;font-size:12px}.toolbar input{flex:1;min-width:0;padding:0 12px}.toolbar select,.toolbar button{padding:0 12px}.toolbar button{background:var(--blue);border-color:var(--blue);color:#fff;cursor:pointer}
    .state{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{display:flex;flex-direction:column;min-height:205px;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}.card-head{display:flex;gap:10px;align-items:center}.icon{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:10px;background:var(--soft);color:#174ea6;font-size:19px}.card h2{margin:0;font-size:14px;font-weight:600}.version{display:block;margin-top:2px;color:#8a96a6;font-size:11px}.card p{margin:13px 0;color:var(--muted);font-size:12px;line-height:1.6}.meta{display:flex;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid #edf1f5;color:var(--muted);font-size:11px}.price{color:#1d4ed8;font-weight:600}.card-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}.card-actions button,.market-action{height:31px;padding:0 10px;border:1px solid #bfd2f8;border-radius:7px;background:var(--soft);color:#174ea6;font:inherit;font-size:11px;cursor:pointer}.market-action{display:inline-flex;align-items:center;text-decoration:none}.card-actions button:disabled{opacity:.6;cursor:default}.empty{grid-column:1/-1}.pager{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:19px;color:var(--muted);font-size:12px}.pager button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#4d5b6e;cursor:pointer}.pager button:disabled{opacity:.45;cursor:default}
    .creator,.publish{border:1px solid #c9d8fb;border-radius:10px;background:#eaf1ff;font-size:12px}.creator{display:flex;align-items:center;gap:13px;margin:14px 0;padding:14px 16px}.creator strong{font-size:13px;color:#174ea6}.creator span{color:#536276}.creator a{margin-left:auto;font-weight:600;white-space:nowrap}.publish{margin-top:10px;padding:14px 16px;background:#fff;border-color:var(--line);color:#536276}.publish summary{cursor:pointer;color:#174ea6;font-weight:600}.publish-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}.publish-form label{font-size:12px}.publish-form input,.publish-form select{display:block;width:100%;height:34px;margin-top:4px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.publish-form input[type=file]{padding:5px}.publish-form .check{display:flex;align-items:flex-start;gap:7px;grid-column:1/-1;color:var(--muted);line-height:1.45}.publish-form .check input{width:15px;height:15px;margin:2px 0 0}.publish-form button{align-self:end;height:34px;border:0;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer}.notice{margin:9px 0 0;color:var(--muted);font-size:12px}.notice.error{color:#b42318}.notice.success{color:#26704e}
    .dialog-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(23,32,51,.38)}.dialog-backdrop[hidden]{display:none}.dialog{width:min(600px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border:0;border-radius:14px;background:#fff;box-shadow:0 18px 55px rgba(15,23,42,.2)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.dialog h2{margin:0;font-size:19px}.dialog-close{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:18px;cursor:pointer}.detail-meta{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 15px;color:var(--muted);font-size:12px}.detail-body{padding:13px;border:1px solid #edf1f5;border-radius:9px;background:#f8fafc;color:#536276;font-size:12px;line-height:1.7;white-space:pre-wrap}.detail-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    @media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{padding:18px 14px 40px}.top{align-items:flex-start;flex-direction:column}.top a{width:100%;justify-content:center}.toolbar{align-items:stretch;flex-wrap:wrap}.toolbar input{flex-basis:100%}.toolbar select,.toolbar button{flex:1}.grid{grid-template-columns:1fr}.creator{align-items:flex-start;flex-direction:column;gap:5px}.creator a{margin-left:0}.publish-form{grid-template-columns:1fr}.dialog-backdrop{padding:12px;place-items:end center}.dialog{max-height:calc(100vh - 24px);padding:16px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div class="crumb"><a href="/developer">开发者社区</a> / 专家市场</div><a class="primary" href="/developer/docs/#expert">专家开发文档 →</a></div>
    <header class="hero"><h1>AI 专家市场</h1><p>发现经过审核的 AI 专家配置。专家由提示词、工具、Skill 和安全策略组成，购买后可在 MaClaw 桌面端安装使用；开发者可提交版本并按平台规则获得 Credits 收益。</p></header>
    <div class="toolbar" role="search"><input id="query" type="search" placeholder="搜索专家名称或描述" aria-label="搜索专家"><select id="sort" aria-label="排序"><option value="">最新发布</option><option value="downloads">下载最多</option><option value="sales">收益最高</option></select><button id="search" type="button">搜索</button></div>
    <div id="state" class="state" role="status" aria-live="polite">正在加载专家…</div><div id="grid" class="grid" hidden></div>
    <div class="pager" hidden id="pager"><button id="prev" type="button">上一页</button><span id="pageInfo"></span><button id="next" type="button">下一页</button></div>
    <section class="creator"><strong>发布你的 AI 专家</strong><span>在 MaClaw 桌面端完成打包与提交，平台审核通过后即可公开展示。</span><a href="/developer/docs/#publish">查看发布要求 →</a></section>
    <details class="publish" id="publish"><summary>上传专家包（需要登录）</summary><form class="publish-form" id="publishForm"><label>版本<input name="version" value="1" maxlength="80" required></label><label>价格（Credits）<input name="price" type="number" min="0" max="999999" value="0" required></label><label>可见性<select name="visibility"><option value="public">公开审核</option><option value="private">仅自己可见</option></select></label><label>包文件<input name="package" type="file" accept=".zip,application/zip" required></label><label class="check"><input name="platform_distribution" type="checkbox" value="true"><span>允许平台分发（可选）<br>勾选后，审核通过的公开专家才可被企业/租户级目录分发；私有分享不会启用此权限。</span></label><button type="submit">提交审核</button></form><p id="publishNotice" class="notice" role="status" aria-live="polite"></p></details>
  </div>
  <div id="detailBackdrop" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="dialog-head"><div><h2 id="detailTitle">专家详情</h2><div id="detailMeta" class="detail-meta"></div></div><button id="detailClose" class="dialog-close" type="button" aria-label="关闭">×</button></div><div id="detailBody" class="detail-body">正在加载…</div><div class="detail-actions"><a id="detailDownload" class="market-action" hidden>下载</a><button id="detailBuy" class="market-action" type="button" hidden>获取</button></div></section></div>
  <script>
    (function(){
      var page=1,size=20,totalPages=1,currentDetail=null;
      var q=document.getElementById('query'),sort=document.getElementById('sort'),state=document.getElementById('state'),grid=document.getElementById('grid'),pager=document.getElementById('pager'),detailBackdrop=document.getElementById('detailBackdrop');
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){return Number(v)>0?esc(v)+' Credits':'免费'}
      function statusText(status, fallback){var map={400:'提交内容不完整，请检查版本、价格和 ZIP 包。',401:'请先在开发者工作台登录后再继续。',402:'Credits 余额不足，无法获取该专家。',403:'当前账号没有执行此操作的权限。',404:'专家不存在或已下架。',409:'该专家已获取，或提交内容与已有版本冲突。',413:'专家包超过平台允许的大小。',429:'操作过于频繁，请稍后再试。'};return map[status]||fallback||'请求失败，请稍后重试。'}
      function jsonResponse(response){return response.text().then(function(text){var body={};try{body=text?JSON.parse(text):{}}catch(_){ }if(!response.ok){var error=new Error(body.error||body.message||statusText(response.status));error.status=response.status;throw error}return body})}
      function render(data){var items=Array.isArray(data.experts)?data.experts:[];totalPages=Number(data.total_pages)||1;grid.innerHTML=items.length?items.map(function(x){var id=esc(x.id),action=x.owned?'<a href="/api/v1/expert-market/experts/'+id+'/download" class="market-action">下载</a>':'<button type="button" class="market-action" data-buy="'+id+'">获取</button>';return '<article class="card"><div class="card-head"><span class="icon">✦</span><div><h2>'+esc(x.name||'未命名专家')+'</h2><span class="version">v'+esc(x.version||'1.0.0')+'</span></div></div><p>'+esc(x.description||'暂无介绍')+'</p><div class="meta"><span>'+esc(x.download_count||0)+' 次下载</span><span class="price">'+money(x.price)+'</span></div><div class="card-actions"><button type="button" class="market-action" data-detail="'+id+'">详情</button>'+action+'</div></article>'}).join(''):'<div class="state empty">暂时没有符合条件的专家。</div>';state.hidden=true;grid.hidden=false;pager.hidden=totalPages<=1;document.getElementById('pageInfo').textContent='第 '+page+' / '+totalPages+' 页';document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages}
      function load(next){page=next||1;state.textContent='正在加载专家…';state.hidden=false;grid.hidden=true;fetch('/api/v1/expert-market/experts?q='+encodeURIComponent(q.value.trim())+'&sort='+encodeURIComponent(sort.value)+'&page='+page+'&page_size='+size).then(jsonResponse).then(render).catch(function(e){state.hidden=false;state.textContent='加载失败：'+(e.message||statusText(e.status));pager.hidden=true})}
      function closeDetail(){detailBackdrop.hidden=true;currentDetail=null;document.getElementById('detailBuy').hidden=true;document.getElementById('detailDownload').hidden=true}
      function showDetail(id){detailBackdrop.hidden=false;document.getElementById('detailTitle').textContent='专家详情';document.getElementById('detailMeta').textContent='';document.getElementById('detailBody').textContent='正在加载…';fetch('/api/v1/expert-market/experts/'+encodeURIComponent(id)).then(jsonResponse).then(function(x){currentDetail=x;document.getElementById('detailTitle').textContent=x.name||'未命名专家';document.getElementById('detailMeta').textContent='v'+(x.version||'1.0.0')+' · '+(x.download_count||0)+' 次下载 · '+(Number(x.price)>0?x.price+' Credits':'免费');document.getElementById('detailBody').textContent=x.description||'暂无介绍';var download=document.getElementById('detailDownload'),buy=document.getElementById('detailBuy');if(x.owned){download.href='/api/v1/expert-market/experts/'+encodeURIComponent(x.id)+'/download';download.hidden=false}else{buy.hidden=false}}).catch(function(e){document.getElementById('detailBody').textContent=e.message||statusText(e.status)})}
      function purchase(id,button){button.disabled=true;button.textContent='处理中…';fetch('/api/v1/expert-market/experts/'+encodeURIComponent(id)+'/purchase',{method:'POST'}).then(jsonResponse).then(function(body){button.outerHTML='<a href="'+esc(body.download_url||('/api/v1/expert-market/experts/'+encodeURIComponent(id)+'/download'))+'" class="market-action">下载</a>';if(currentDetail&&currentDetail.id===id){closeDetail();load(page)}}).catch(function(e){button.disabled=false;button.textContent='获取';state.hidden=false;state.textContent=e.message||statusText(e.status)})}
      grid.addEventListener('click',function(e){var detail=e.target.closest('[data-detail]'),buy=e.target.closest('[data-buy]');if(detail){showDetail(detail.getAttribute('data-detail'));return}if(buy)purchase(buy.getAttribute('data-buy'),buy)});
      document.getElementById('detailClose').onclick=closeDetail;detailBackdrop.onclick=function(e){if(e.target===detailBackdrop)closeDetail()};document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!detailBackdrop.hidden)closeDetail()});document.getElementById('detailBuy').onclick=function(){if(currentDetail)purchase(currentDetail.id,this)};
      document.getElementById('search').onclick=function(){load(1)};q.addEventListener('keydown',function(e){if(e.key==='Enter')load(1)});sort.onchange=function(){load(1)};document.getElementById('prev').onclick=function(){load(page-1)};document.getElementById('next').onclick=function(){load(page+1)};
      document.getElementById('publishForm').addEventListener('submit',function(e){e.preventDefault();var form=e.currentTarget,note=document.getElementById('publishNotice'),button=form.querySelector('button');note.className='notice';note.textContent='';button.disabled=true;button.textContent='提交中…';fetch('/api/v1/expert-market/experts',{method:'POST',body:new FormData(form)}).then(jsonResponse).then(function(){note.className='notice success';note.textContent='已提交审核，审核通过后会出现在专家市场。';form.reset();form.version.value='1';form.price.value='0';load(1)}).catch(function(err){note.className='notice error';note.textContent=err.message||statusText(err.status)}).finally(function(){button.disabled=false;button.textContent='提交审核'})});
      load(1);
    })();
  </script>
</body>
</html>
