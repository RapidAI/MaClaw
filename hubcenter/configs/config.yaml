server:
  listen_host: 0.0.0.0
  listen_port: 9388
  public_base_url: https://hubs.mypapers.top

database:
  driver: sqlite
  dsn: ./data/maclaw-hubcenter.db
  wal: true
  auto_vacuum: incremental
  maintenance:
    enabled: true
    incremental_vacuum_pages: 32
    window_start: "03:00"
    window_end: "05:00"
    free_headroom_bytes: 536870912
    metrics_interval_minutes: 30
    warn_pending_ops: 20000
    warn_db_bytes: 1073741824
  busy_timeout_ms: 5000
  max_read_open_conns: 8
  max_read_idle_conns: 4
  max_write_open_conns: 1
  max_write_idle_conns: 1

mail:
  enabled: false
  provider: smtp
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_username: no-reply@example.com
  smtp_password: change-me
  from_name: MaClaw Hub Center
  from_email: no-reply@example.com

logging:
  level: info
  dir: ./data/logs

runtime:
  soft_memory_limit_mb: 1536
